name: Archon OS CI & E2E Quality Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  validate-and-audit:
    name: 1. Pre-Flight Config & Secrets Audit
    runs-on: ubuntu-latest
    env:
      # Audit D09: auch der Restore-Test in diesem Job darf nie in shared data/ schreiben.
      ARCHON_TEST_DB_ISOLATION: "1"
    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (gepinnt)

      - name: Python 3.13 einrichten
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 (gepinnt)
        with:
          python-version: "3.13"
          cache: "pip"

      - name: CI-Helfer aus Hash-Lock installieren (F002)
        # pip bleibt auf der von setup-python gepinnten Toolchain — kein
        # Upgrade-Schritt. Alle Helfer (inkl. pip selbst) kommen
        # hash-geprüft und mit voller Transitiv-Kette aus requirements-ci.lock.txt.
        run: |
          test -f requirements-ci.lock.txt
          python -m pip install --require-hashes --no-deps -r requirements-ci.lock.txt

      - name: Pre-Flight Konfigurationsprüfung
        run: python scripts/validate_config.py --strict

      - name: Profil-SSOT Drift-Check (inkl. field_mismatch)
        run: |
          python - <<'PY'
          import json, subprocess, sys
          result = subprocess.run(
              [sys.executable, "scripts/sync_profile_ssot.py", "--check",
               "--allow-missing-hermes", "--json"],
              capture_output=True, text=True,
          )
          print(result.stdout)
          if result.returncode != 0:
              sys.exit(result.stderr or "sync_profile_ssot.py --check fehlgeschlagen")
          report = json.loads(result.stdout)
          # A8: detect_drift() meldet field_mismatch hart — explizit im Gate auswerten.
          fm = report.get("field_mismatch") or []
          if fm:
              sys.exit(f"Profil-SSOT field_mismatch: {fm[:10]}")
          print(f"Profil-SSOT: field_mismatch leer (drift={report.get('drift')})")
          PY

      - name: Kanonische souls/ gegen SSOT prüfen (D15)
        run: python scripts/build_souls_ssot.py --check

      - name: Runtime-SOUL-Caches aus souls/ regenerieren (D15)
        # Caches sind gitignored und fehlen im frischen CI-Checkout. Ohne diesen
        # Schritt wuerde der Drift-Gate 0 Dateien pruefen und trotzdem gruen sein.
        run: python scripts/sync_soul_runtime_cache.py

      - name: Runtime-SOUL-Cache Drift (D15)
        run: python scripts/check_soul_ssot_drift.py --allow-missing --min-checked 284

      - name: Rollen-SSOT — semantische Negativ-Abgrenzung (D15)
        run: |
          python - <<'PY'
          import json, sys
          sys.path.insert(0, "scripts")
          from build_souls_ssot import semantic_scope_report, MIN_DISTINCT_NEGATIVE_SCOPES
          profiles = json.load(open("agent_profiles.json", encoding="utf-8"))
          sem = semantic_scope_report(profiles)
          # D15: Praesenz allein ist kein "rollenspezifisch" — nur echte Semantik zaehlt.
          print(
              f"negative_scope: {len(profiles)}/{len(profiles)} vorhanden, "
              f"{sem['distinct_bodies']} distinct (Minimum {MIN_DISTINCT_NEGATIVE_SCOPES})"
          )
          errors = []
          if sem["distinct_bodies"] < MIN_DISTINCT_NEGATIVE_SCOPES:
              errors.append(f"nur {sem['distinct_bodies']} distinct bodies")
          if sem["missing_en"]:
              errors.append(f"EN-Scope fehlt: {sem['missing_en'][:10]}")
          if sem["identical_en"]:
              errors.append(f"EN-Scope unuebersetzt: {sem['identical_en'][:10]}")
          if sem["high_risk_without_hitl"]:
              errors.append(f"HIGH_RISK ohne HITL: {sem['high_risk_without_hitl'][:10]}")
          if errors:
              sys.exit("D15-Semantik-Gate: " + "; ".join(errors))
          PY

      - name: EU-AI-Act HIGH_RISK == EXPECTED_HIGH_RISK_COUNT (D15, harter Test)
        run: |
          python - <<'PY'
          import sys
          from backend.eu_ai_act_inventory import EUAIActInventoryManager, EXPECTED_HIGH_RISK_COUNT
          stats = EUAIActInventoryManager().get_stats()
          n = stats["high_risk_count"]
          print(f"high_risk_count={n} (Soll {EXPECTED_HIGH_RISK_COUNT})")
          if n != EXPECTED_HIGH_RISK_COUNT:
              sys.exit(f"high_risk_count {n} != {EXPECTED_HIGH_RISK_COUNT}")
          PY

      - name: Compose-Image-Digest-Gate (D09, aufgelöster Wert)
        # Der Gate prueft nicht den Roh-String, sondern den von `docker compose
        # config` aufgeloesten Wert. Ein Env-Override wie N8N_IMAGE=...:latest
        # darf nicht gruen bleiben, nur weil der Quelltext ein ${...:-...@sha256}
        # enthaelt (Negativprobe am Ende dieses Schritts).
        run: |
          set -e
          [ -f .env ] || cp .env.example .env
          PROFILES="$(python - <<'PY'
          import yaml
          data = yaml.safe_load(open('docker-compose.yml', encoding='utf-8')) or {}
          names = sorted({p for c in (data.get('services') or {}).values() for p in (c.get('profiles') or [])})
          print(','.join(names))
          PY
          )"
          check_digest() {
            python - "$1" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          bad = []
          for svc, cfg in (data.get('services') or {}).items():
              if 'build' in cfg:
                  continue
              image = str(cfg.get('image') or '').strip()
              if image and '@sha256:' not in image:
                  bad.append(f'{svc}: {image}')
          if bad:
              sys.exit('Externe Images ohne @sha256: (aufgelöst):\n  ' + '\n  '.join(bad))
          print('OK: alle externen Images @sha256:-gepinnt')
          PY
          }
          for f in docker-compose.yml CRM/docker-compose.yml pocketbase/docker-compose.yml; do
            echo "Digest-Gate: $f"
            COMPOSE_PROFILES="$PROFILES" docker compose -f "$f" config --format json > /tmp/compose-resolved.json
            check_digest /tmp/compose-resolved.json
          done
          # Negativprobe: ein bewusst ungepinnter Env-Override muss den Gate rot machen.
          COMPOSE_PROFILES="$PROFILES" N8N_IMAGE=n8nio/n8n:latest \
            docker compose -f docker-compose.yml config --format json > /tmp/compose-negative.json
          if check_digest /tmp/compose-negative.json; then
            echo "Negativprobe fehlgeschlagen: ungepinnter Env-Override blieb unentdeckt"
            exit 1
          fi
          echo "Negativprobe bestanden: Gate lehnt ungepinnten Env-Override ab"

      - name: Audit-HMAC-Key vorhanden (GoBD-Startup-Gate)
        env:
          ARCHON_AUDIT_HMAC_KEY: ci-test-key-not-for-production
        run: python scripts/ensure_audit_hmac_key.py --check

      - name: Secrets- & Credential-Audit (Zero-Leak Gate)
        run: python scripts/audit_secrets.py --all

      - name: JavaScript Syntax Check
        run: |
          for f in static/js/*.js static/hermes-webui/*.js scripts/*.js; do
            node --check "$f"
          done

      - name: Python Syntax Check (compileall, D09-M5)
        # Das Image uebernimmt per Dockerfile:38 ALLE Root-*.py. Der Gate muss
        # deshalb explizit auch die grossen Root-Monolithen pruefen, nicht nur
        # main.py und core_dispatcher.py.
        run: |
          python -m compileall -q archon backend scripts tools utils \
            main.py core_dispatcher.py api_provider.py views_core.py \
            core_skills_engine.py watchdog_daemon.py local_security_guard.py \
            backup_archon.py dossier_builder.py jev_router.py \
            local_memory_bridge.py oracle_news_radar.py archon_crm_mcp.py \
            apollo_voice_engine.py create_lang_pages.py \
            research_engine.py research_engine_v2.py \
            seo_execution_agent.py telegram_notify.py update_dist.py

      - name: Import-Layer-Contracts (lint-imports, D09-M2, HARTES GATE)
        # Beide Contracts aus .importlinter (backend UND archon.core) werden
        # inklusiv transitiver Kanten geprueft. Kein continue-on-error:
        # jeder gebrochene Contract macht den Job rot. Das Binary kommt
        # hash-geprueft aus requirements-ci.lock.txt (siehe Install-Schritt).
        run: lint-imports --no-logo .importlinter

      - name: SQLite busy_timeout SSOT (D03/M2 — HARTES GATE, Ratchet bis 2026-12-31)
        # D03/M2: audit_busy_timeout_ssot()/CLI existierten, waren aber nicht
        # in CI verdrahtet (= Theater nach §0). Dieser Schritt ist HART —
        # KEIN continue-on-error. Bekannte Altlasten (Stand 2026-11-26)
        # stehen im datierten Ratchet; JEDER neue Drift und jede Zunahme der
        # Altlasten macht den Gate rot. Nach 2026-12-31: --allow-drift
        # entfernen und die Literale auf DB_BUSY_TIMEOUT_S migrieren.
        run: |
          set -euo pipefail
          cat > /tmp/archon_busy_timeout_allowlist.txt <<'ARCHON_BUSY_TIMEOUT_ALLOWLIST'
          archon/routers/chat.py
          archon/routers/hermes_ops.py
          archon/routers/telemetry.py
          backend/agent_eval_arena.py
          backend/agent_router.py
          backend/agent_scorecard_engine.py
          backend/api_key_manager.py
          backend/approval_policy_engine.py
          backend/audit_log.py
          backend/bandit_model_router.py
          backend/client_approval_portal.py
          backend/consensus_gate.py
          backend/contract_manager.py
          backend/core_memory_manager.py
          backend/db_backup_manager.py
          backend/dead_letter_queue.py
          backend/deal_pipeline.py
          backend/dry_run_simulator.py
          backend/dunning_engine.py
          backend/durable_checkpoint_manager.py
          backend/egress_firewall.py
          backend/email_draft_engine.py
          backend/ephemeral_team_spawner.py
          backend/eval_gates.py
          backend/eval_regression_runner.py
          backend/execution_receipt_ledger.py
          backend/flightlog_backtester.py
          backend/graceful_shutdown_coordinator.py
          backend/handoff_desk.py
          backend/human_feedback_engine.py
          backend/hybrid_search_engine.py
          backend/idempotency_guard.py
          backend/knowledge_graph_store.py
          backend/map_reduce_executor.py
          backend/mcp_gateway.py
          backend/memory_consolidator.py
          backend/metrics_collector.py
          backend/model_benchmarker.py
          backend/notification_hub.py
          backend/operations_api.py
          backend/operations_calendar.py
          backend/operations_projects.py
          backend/otel_tracer.py
          backend/precedent_log.py
          backend/process_lock.py
          backend/prompt_optimizer.py
          backend/role_budget_engine.py
          backend/self_evolving_tooling.py
          backend/semantic_cache.py
          backend/session_taint_guard.py
          backend/skill_synthesizer.py
          backend/sla_contract_enforcer.py
          backend/speculative_hedger.py
          backend/system_updater.py
          backend/task_self_healer.py
          backend/tenant_context.py
          backend/time_tracking_invoice.py
          backend/time_travel_debugger.py
          backend/tool_permission_manager.py
          backend/trajectory_budget.py
          backend/treasury_engine.py
          backend/war_room_simulator.py
          backend/watchdog_radar_v2.py
          backend/workflow_dag_runner.py
          backend/workflow_scheduler.py
          backend/workflow_templates.py
          local_memory_bridge.py
          oracle_news_radar.py
          scripts/deploy_v036_and_backup.py
          scripts/deploy_v038_and_backup.py
          scripts/litestream_manager.py
          scripts/migrate_tenant_dbs.py
          tests/test_med2_e_services.py
          tests/test_p2_shared_queue.py
          ARCHON_BUSY_TIMEOUT_ALLOWLIST
          mapfile -t ALLOW < /tmp/archon_busy_timeout_allowlist.txt
          args=()
          for f in "${ALLOW[@]}"; do
            args+=(--allow-drift "$f")
          done
          python -m backend.db_paths --audit-busy-timeout "${args[@]}" > busy_timeout_report.json
          python - <<'PY'
          import json
          import sys

          with open("busy_timeout_report.json", encoding="utf-8") as fh:
              report = json.load(fh)
          unexpected = report.get("unexpected") or []
          if unexpected:
              sys.exit(
                  "Neuer busy_timeout-Drift ausserhalb des datierten Ratchets: "
                  + repr(unexpected[:20])
              )
          known = len(report.get("offenders") or [])
          BASELINE = 133  # Stand 2026-11-26
          if known > BASELINE:
              sys.exit(
                  f"busy_timeout-Altlasten gewachsen: {known} > {BASELINE} "
                  "(Ratchet verletzt)"
              )
          print(
              f"busy_timeout-SSOT OK: {known} bekannte Altlasten, 0 neue "
              "(Ratchet bis 2026-12-31)"
          )
          PY

      - name: YAML-Parse-Gate (yaml.safe_load)
        # F-070: harter Gate für alle Workflow-/Compose-YAMLs (kein `|| true`).
        run: |
          python - <<'PY'
          import glob
          import sys
          import yaml

          files = sorted(set(
              glob.glob(".github/workflows/*.yml")
              + glob.glob(".github/workflows/*.yaml")
              + glob.glob("docker-compose*.yml")
              + glob.glob("docker-compose*.yaml")
          ))
          if not files:
              sys.exit("Keine YAML-Dateien fuer den Parse-Gate gefunden")
          for path in files:
              with open(path, "r", encoding="utf-8") as fh:
                  yaml.safe_load(fh)
              print(f"yaml.safe_load OK: {path}")
          PY

      - name: Restore-Test-Gate (5/5)
        # F-070: fuehrt den echten Restore-Test aus. Deterministische Fixtures
        # werden im CI-Runner erzeugt; als Quelle dient ausschliesslich ein
        # frisches Backup-Artefakt, nie eine Live-DB (Audit A).
        run: |
          set -e
          python - <<'PY'
          import gzip
          import os
          import sqlite3
          import tempfile

          backup_dir = os.path.join(".hermes", "backups", "db")
          os.makedirs(backup_dir, exist_ok=True)
          specs = (
              ("ops.db", "tasks"),
              ("business.db", "deals"),
              ("memory.db", "learnings"),
              ("pb_data.db", "kontakte"),
          )
          with tempfile.TemporaryDirectory() as tmp:
              for name, table in specs:
                  raw = os.path.join(tmp, name)
                  con = sqlite3.connect(raw)
                  con.execute(f'CREATE TABLE "{table}" (id INTEGER PRIMARY KEY, payload TEXT)')
                  con.execute(f'INSERT INTO "{table}" (payload) VALUES (?)', ("ci-fixture",))
                  con.commit()
                  con.close()
                  with open(raw, "rb") as src, gzip.open(
                          os.path.join(backup_dir, f"{name}_ci.db.gz"), "wb") as dst:
                      dst.write(src.read())

          # Das Tenant-Artefakt aktiviert den 5. Check (TENANT_REPLICATION).
          tenant_dir = os.path.join("data", "tenants", "ci_verify")
          os.makedirs(tenant_dir, exist_ok=True)
          con = sqlite3.connect(os.path.join(tenant_dir, "tenant.db"))
          con.execute("PRAGMA journal_mode=WAL")
          con.execute("CREATE TABLE t (id INTEGER PRIMARY KEY)")
          con.execute("INSERT INTO t DEFAULT VALUES")
          con.commit()
          con.close()
          PY
          # D10-M2: Echtes Litestream-Replikat + Restore via gepinntem Image erzeugen.
          LITESTREAM_IMG="litestream/litestream:0.5.1@sha256:b6b174e740f00e624fe15053f65348ab7e42daa3cc3ce1fa4cf6b89db5e3788d"
          mkdir -p "$PWD/dr_replicas/tenants/ci_verify"
          cat > /tmp/ci_litestream.yml <<'YAML'
          dbs:
            - path: /app/data/tenants/ci_verify/tenant.db
              replica:
                type: file
                path: /opt/litestream_replicas/tenants/ci_verify/tenant.db
                sync-interval: 1s
          YAML
          docker run --rm -u "$(id -u):$(id -g)" \
            -v "$PWD/data:/app/data" \
            -v "$PWD/dr_replicas:/opt/litestream_replicas" \
            -v /tmp/ci_litestream.yml:/etc/litestream.yml:ro \
            "$LITESTREAM_IMG" replicate -exec "sleep 2" -config /etc/litestream.yml
          cat > /tmp/ci_litestream.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          exec docker run --rm -u "$(id -u):$(id -g)" \
            -v "$PWD/dr_replicas:/opt/litestream_replicas:ro" \
            -v /tmp:/tmp \
            -v /tmp/ci_litestream.yml:/etc/litestream.yml:ro \
            litestream/litestream:0.5.1@sha256:b6b174e740f00e624fe15053f65348ab7e42daa3cc3ce1fa4cf6b89db5e3788d \
            restore -o "$3" -config /etc/litestream.yml "$6"
          SH
          chmod +x /tmp/ci_litestream.sh
          ARCHON_AUDIT_HMAC_KEY="ci-test-key-not-for-production" \
          ARCHON_LITESTREAM_REPLICA_DIR="$PWD/dr_replicas" \
          ARCHON_LITESTREAM_BIN="/tmp/ci_litestream.sh" \
            python scripts/automated_restore_test.py --json > restore_report.json
          python - <<'PY'
          import json
          import sys

          with open("restore_report.json", "r", encoding="utf-8") as fh:
              report = json.load(fh)
          details = report.get("details", [])
          passed = [d for d in details if d.get("status") == "PASSED"]
          print(f"Restore-Test: {len(passed)}/{len(details)} Checks bestanden")
          for d in details:
              print(f"  {d.get('status')}: {d.get('database')} {d.get('error') or ''}")
          if (report.get("overall_status") != "PASSED"
                  or len(details) < 5 or len(passed) != len(details)):
              sys.exit(f"Restore-Gate fehlgeschlagen: {len(passed)}/{len(details)} bestanden")
          PY

  frontend-build:
    name: 1b. Next.js Typecheck & Build
    runs-on: ubuntu-latest
    env:
      ARCHON_TEST_DB_ISOLATION: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (gepinnt)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (gepinnt)
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Dependencies (lockfile, reproducible)
        run: npm ci
        working-directory: frontend
      - name: TypeScript Typecheck
        run: npx tsc --noEmit
        working-directory: frontend
      - name: Sanitizer-Regressionstests (npm test)
        run: npm test
        working-directory: frontend
      - name: Production Build
        run: npm run build
        working-directory: frontend

  test-suites:
    name: 2. Unit- & Security-Tests
    needs: validate-and-audit
    runs-on: ubuntu-latest
    env:
      # GitHub-Runner ist Bare-Metal (kein /.dockerenv): Sandbox-Run-Verzeichnis
      # ist bereits ein Host-Pfad, DooD-Mount-Auflösung ist nicht nötig.
      ARCHON_SANDBOX_BARE_METAL: "1"
      # Audit D09: Tests dürfen niemals in das shared data/ schreiben.
      # tests/conftest.py:60-64 erzeugt bei gesetztem Flag ein temp. ARCHON_DATA_DIR.
      ARCHON_TEST_DB_ISOLATION: "1"
    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (gepinnt)

      - name: Python 3.13 einrichten
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 (gepinnt)
        with:
          python-version: "3.13"

      - name: Abhängigkeiten installieren (Hash-Locks, F002)
        run: |
          # Audit D09: Hash-Locks sind zwingend — kein stiller Fallback auf Bereiche.
          test -f requirements.lock.txt
          pip install --require-hashes --no-deps -r requirements.lock.txt
          test -f requirements-test.lock.txt
          pip install --require-hashes --no-deps -r requirements-test.lock.txt
          test -f requirements-ci.lock.txt
          pip install --require-hashes --no-deps -r requirements-ci.lock.txt
          mkdir -p data inbox

      - name: Gesamte Pytest-Suite ausführen
        run: pytest tests/ -q

      - name: Security-Guard Tests ausführen
        run: python -m unittest tests/test_security_and_validation.py

      - name: Router Tests ausführen
        run: python -m unittest tests/test_jev_router.py

      - name: Telegram-Adapter Smoke-Test (W6-D, HARTES GATE)
        # Verbindlicher Vertrag mit Partition W6-D: das Skript wird dort
        # angelegt (D09-H1, Patch-Mount des Hermes-Adapters). Exit 1 = rot,
        # ausdruecklich KEIN continue-on-error. Dieser Job installiert die
        # Root-Locks, daher stehen alle Laufzeit-Abhaengigkeiten bereit.
        run: python scripts/telegram_adapter_smoke_test.py

  e2e-lifecycle:
    name: 3. End-to-End Lebenszyklus (Telegram -> Triage -> Task -> Fan-In -> Freigabe)
    needs: test-suites
    runs-on: ubuntu-latest
    env:
      ARCHON_TEST_DB_ISOLATION: "1"
    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (gepinnt)

      - name: Python 3.13 einrichten
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 (gepinnt)
        with:
          python-version: "3.13"

      - name: Abhängigkeiten installieren (Hash-Lock, F002)
        run: |
          test -f requirements-ci.lock.txt
          pip install --require-hashes --no-deps -r requirements-ci.lock.txt
          mkdir -p data inbox

      - name: E2E Lifecycle & MCP Testsuite
        run: python -m unittest tests/test_e2e_lifecycle.py

  docker-lint:
    name: 4. Docker-Compose Validierung
    needs: validate-and-audit
    runs-on: ubuntu-latest
    env:
      ARCHON_TEST_DB_ISOLATION: "1"
    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (gepinnt)

      - name: Docker Compose Syntaxprüfung (alle Varianten)
        run: |
          set -e
          [ -f .env ] || cp .env.example .env
          for f in docker-compose*.yml CRM/docker-compose.yml pocketbase/docker-compose.yml; do
            [ -f "$f" ] || continue
            echo "Prüfe $f"
            docker compose -f "$f" config --quiet
          done

  security-scan:
    name: 5. SAST / Dependency-Audit / SBOM
    needs: validate-and-audit
    runs-on: ubuntu-latest
    env:
      ARCHON_TEST_DB_ISOLATION: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (gepinnt)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 (gepinnt)
        with:
          python-version: "3.13"

      - name: Security-Tools + SBOM-Generator aus Hash-Lock (F002)
        # pip-audit, bandit und cyclonedx-py (inkl. Transitiv-Kette) kommen
        # ausschliesslich aus dem hash-geprüften CI-Lockfile.
        run: |
          test -f requirements-ci.lock.txt
          python -m pip install --require-hashes --no-deps -r requirements-ci.lock.txt

      - name: SBOM (CycloneDX 1.5 JSON aus den Hash-Locks)
        # Kein `pip list` mehr. cyclonedx-py erzeugt echte CycloneDX-Struktur
        # und übernimmt die --hash=sha256-Werte beider Lockfiles in
        # externalReferences[].hashes (Upstream-Requirements-Parser).
        run: |
          set -e
          test -f requirements.lock.txt
          python -m pip install --require-hashes --no-deps -r requirements.lock.txt
          cat requirements.lock.txt requirements-ci.lock.txt \
            | cyclonedx-py requirements - \
                --spec-version 1.5 --output-format JSON \
                --output-file sbom-python.raw.json
          python - <<'PY'
          import json
          from pathlib import Path

          doc = json.loads(Path("sbom-python.raw.json").read_text(encoding="utf-8"))
          for component in doc.get("components") or []:
              hashes = []
              for ref in component.get("externalReferences") or []:
                  for item in ref.get("hashes") or []:
                      if item not in hashes:
                          hashes.append(item)
              if hashes:
                  # Der Requirements-Parser legt Hashes nur in externalReferences
                  # ab; component.hashes ist in CycloneDX 1.5 zulässig und wird
                  # hier aus denselben echten Werten übernommen.
                  component["hashes"] = hashes
          Path("sbom-python.cdx.json").write_text(
              json.dumps(doc, indent=2, ensure_ascii=False) + "\n", encoding="utf-8"
          )
          PY
          rm -f sbom-python.raw.json

      - name: SBOM-Gate (components[].hashes, hart)
        run: |
          python - <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          doc = json.loads(Path("sbom-python.cdx.json").read_text(encoding="utf-8"))
          if doc.get("bomFormat") != "CycloneDX" or str(doc.get("specVersion")) != "1.5":
              sys.exit(f"SBOM kein CycloneDX 1.5: {doc.get('bomFormat')} {doc.get('specVersion')}")
          components = doc.get("components") or []
          if len(components) < 80:
              sys.exit(f"SBOM unvollständig: nur {len(components)} Komponenten")
          missing = []
          for component in components:
              hashes = component.get("hashes") or []
              if not any(
                  h.get("alg") == "SHA-256"
                  and re.fullmatch(r"[0-9a-f]{64}", h.get("content") or "")
                  for h in hashes
              ):
                  missing.append(str(component.get("name")))
          if missing:
              sys.exit("SBOM-Gate: ohne SHA-256-Hash: " + ", ".join(sorted(set(missing))[:20]))
          print(f"SBOM-Gate OK: {len(components)} Komponenten, alle mit SHA-256-Hash")
          PY

      - name: SBOM-Artefakt hochladen
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 (gepinnt)
        with:
          name: sbom-python-cdx15
          path: sbom-python.cdx.json

      - name: Bekannte CVEs in Abhängigkeiten (pip-audit)
        # Hartes Gate: keine bekannten CVEs in der hash-geprüften Lockdatei.
        run: pip-audit -r requirements.lock.txt

      - name: Static Application Security Testing (bandit, D09-M5)
        # Hartes Gate auf HIGH-Severity-Funde (lokaler Lauf: 0 Funde).
        # Dieselbe explizite Root-Dateiliste wie compileall/Ruff — die per
        # *.py ins Image kopierten Monolithen duerfen nicht unsichtbar bleiben.
        env:
          PYTHONIOENCODING: utf-8
        run: |
          bandit -q -lll -r \
            main.py core_dispatcher.py api_provider.py views_core.py \
            core_skills_engine.py watchdog_daemon.py local_security_guard.py \
            backup_archon.py dossier_builder.py jev_router.py \
            local_memory_bridge.py oracle_news_radar.py archon_crm_mcp.py \
            apollo_voice_engine.py create_lang_pages.py \
            research_engine.py research_engine_v2.py \
            seo_execution_agent.py telegram_notify.py update_dist.py \
            backend archon -x tests,scripts

  quality-gates:
    name: 6. Quality Gates (scharf)
    # Audit D09 / Register C24 aufgelöst: der Job darf wieder rot werden.
    # Scharf: kritischer Ruff-Subset (E9,F63,F7,F82), Coverage/Pytest, Install/Setup.
    # Re-Audit D09/R-B: keine continue-on-error-Baselines mehr. Die vollständigen
    # Läufe (ruff/mypy/eslint) laufen als HARTES Changed-Files-Ratchet: alter
    # Code bleibt unangetastet, aber jede geänderte Datei muss sauber sein.
    needs: validate-and-audit
    runs-on: ubuntu-latest
    env:
      ARCHON_TEST_DB_ISOLATION: "1"
    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (gepinnt)
        with:
          # Changed-Files-Ratchet braucht den Base-Commit (S-9.3).
          fetch-depth: 0

      - name: Python 3.13 einrichten
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 (gepinnt)
        with:
          python-version: "3.13"

      - name: Node 22 einrichten (nur für ESLint)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (gepinnt)
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Python-Abhängigkeiten + Qualitäts-Tools (Hash-Locks, F002)
        run: |
          test -f requirements.lock.txt
          pip install --require-hashes --no-deps -r requirements.lock.txt
          test -f requirements-test.lock.txt
          pip install --require-hashes --no-deps -r requirements-test.lock.txt
          # ruff/mypy/coverage und alle Helfer kommen hash-geprüft aus dem
          # CI-Lockfile — keine Versionbereiche, kein ungepinnter pip-Upgrade.
          test -f requirements-ci.lock.txt
          pip install --require-hashes --no-deps -r requirements-ci.lock.txt
          mkdir -p data inbox

      - name: Ruff – kritische Fehlerklassen (HARTES GATE, D09-M5)
        # E9 = Syntaxfehler, F63/F7/F82 = ungültige Syntax/undefinierte Namen.
        # Diese Klassen bedeuten kaputten Code, nicht Style – null Toleranz.
        # Root-Module explizit wie in compileall/bandit, damit alle drei
        # statischen Gates denselben ausgelieferten Code erfassen.
        run: |
          ruff check --select E9,F63,F7,F82 --output-format=concise \
            archon backend scripts tools utils \
            main.py core_dispatcher.py api_provider.py views_core.py \
            core_skills_engine.py watchdog_daemon.py local_security_guard.py \
            backup_archon.py dossier_builder.py jev_router.py \
            local_memory_bridge.py oracle_news_radar.py archon_crm_mcp.py \
            apollo_voice_engine.py create_lang_pages.py \
            research_engine.py research_engine_v2.py \
            seo_execution_agent.py telegram_notify.py update_dist.py

      - name: Doku-Versionsabgleich gegen config/version.json (HARTES GATE, F12)
        run: python scripts/check_doc_version_sync.py

      - name: D09-M7 — keine Content-Domäne / kein /content-studio als Produktfläche (HARTES GATE)
        shell: bash
        run: |
          # Produktmodell-Korrektur 23.11.2026: Content läuft als
          # Task -> Workflow -> Agent -> Gate -> Artefakt. Erlaubt sind nur
          # (a) normative/ HISTORISCHE Audit-Dokumente, die das VERBOT benennen,
          # (b) der kommentierte LEGACY-ALIAS in static/index.html.
          WHITELIST='00_SOLL_SPEC\.md|domain_09\.md|HANDOFF_W4_W7\.md|GEWICHTETE_BEFUNDLISTE\.md|MASTER_PLAN\.md|AUDIT_ABSCHLUSS_2026_11_23\.md|fix_w1_d_tenant_ledger\.md|SYSTEM_AUDIT_2026_KONSOLIDIERT\.md|SYSTEM_ARCHITEKTUR_UND_AUDIT_2026\.md|w7_[a-z]+_report\.md'
          HITS=$(grep -rnF '/content-studio' CHANGELOG.md docs audit_reports static/index.html \
            --exclude-dir=node_modules \
            | grep -vE "$WHITELIST" \
            | grep -vF 'LEGACY-ALIAS' || true)
          if [ -n "$HITS" ]; then
            echo "D09-M7: /content-studio weiterhin als Produktfläche beschrieben:"
            echo "$HITS"
            exit 1
          fi
          echo "D09-M7: keine eigene Content-Domäne — nur kommentierter Legacy-Alias erlaubt."

      - name: Changed-Files-Ratchet – Diff-Bereich bestimmen
        id: changed
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="origin/${{ github.base_ref }}...HEAD"
          else
            RANGE="HEAD^ HEAD"
          fi
          echo "py=$(git diff --name-only --diff-filter=ACMR $RANGE -- '*.py' '*.pyi' | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          echo "newpy=$(git diff --name-only --diff-filter=A $RANGE -- '*.py' | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          echo "js=$(git diff --name-only --diff-filter=ACMR $RANGE -- 'frontend/src/**/*.ts' 'frontend/src/**/*.tsx' 'frontend/src/**/*.js' 'frontend/src/**/*.mjs' | sed 's|^frontend/||' | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - name: Ruff – geänderte Dateien (HARTES RATCHET-GATE)
        shell: bash
        run: |
          FILES="${{ steps.changed.outputs.py }}"
          if [ -n "$FILES" ]; then
            echo "Ruff prüft geänderte Dateien: $FILES"
            # Audit D09: der Legacy-Ignore aus ruff.toml gilt nicht fuer den
            # Ratchet — F401/F841 muessen bei geaenderten Dateien wieder greifen.
            ruff check --select E,F,I --ignore E501 $FILES --output-format=concise
          else
            echo "Keine geänderten Python-Dateien — Ratchet nichts zu prüfen."
          fi

      - name: mypy – geänderte Dateien (HARTES RATCHET-GATE)
        # F002/D09-M1: mypy.ini ist die SSOT (python_version 3.13,
        # warn_unused_ignores). Kein Flag überschreibt die Konfiguration mehr.
        shell: bash
        run: |
          FILES="${{ steps.changed.outputs.py }}"
          if [ -n "$FILES" ]; then
            echo "mypy prüft geänderte Dateien: $FILES"
            mypy --config-file mypy.ini $FILES
          else
            echo "Keine geänderten Python-Dateien — Ratchet nichts zu prüfen."
          fi

      - name: mypy – neu hinzugefügte Module (disallow_untyped_defs, HARTES GATE)
        # F002: neue Module müssen von Anfang an vollständig typisiert sein.
        # Bestandsmodule mit `# mypy: ignore-errors` bleiben davon unberührt (F044).
        shell: bash
        run: |
          NEW="${{ steps.changed.outputs.newpy }}"
          if [ -n "$NEW" ]; then
            echo "mypy prüft neue Module mit disallow_untyped_defs: $NEW"
            mypy --config-file mypy.ini --disallow-untyped-defs $NEW
          else
            echo "Keine neuen Python-Dateien — kein Neumodul-Gate nötig."
          fi

      - name: Coverage (HARTES GATE – pytest muss laufen)
        run: |
          coverage run -m pytest tests/ -q
          coverage report

      - name: Frontend-Abhängigkeiten für ESLint installieren
        run: npm ci --prefix frontend

      - name: ESLint – geänderte Dateien (HARTES RATCHET-GATE)
        shell: bash
        run: |
          FILES="${{ steps.changed.outputs.js }}"
          if [ -n "$FILES" ]; then
            echo "ESLint prüft geänderte Dateien: $FILES"
            cd frontend && npx eslint $FILES
          else
            echo "Keine geänderten Frontend-Dateien — Ratchet nichts zu prüfen."
          fi
