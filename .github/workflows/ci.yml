name: Archon OS CI & E2E Quality Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  validate-and-audit:
    name: 1. Pre-Flight Config & Secrets Audit
    runs-on: ubuntu-latest
    env:
      # Audit D09: auch der Restore-Test in diesem Job darf nie in shared data/ schreiben.
      ARCHON_TEST_DB_ISOLATION: "1"
    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (gepinnt)

      - name: Python 3.13 einrichten
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 (gepinnt)
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Basis-Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml requests psutil

      - name: Pre-Flight Konfigurationsprüfung
        run: python scripts/validate_config.py --strict

      - name: Profil-SSOT Drift-Check (inkl. field_mismatch)
        run: |
          python - <<'PY'
          import json, subprocess, sys
          result = subprocess.run(
              [sys.executable, "scripts/sync_profile_ssot.py", "--check",
               "--allow-missing-hermes", "--json"],
              capture_output=True, text=True,
          )
          print(result.stdout)
          if result.returncode != 0:
              sys.exit(result.stderr or "sync_profile_ssot.py --check fehlgeschlagen")
          report = json.loads(result.stdout)
          # A8: detect_drift() meldet field_mismatch hart — explizit im Gate auswerten.
          fm = report.get("field_mismatch") or []
          if fm:
              sys.exit(f"Profil-SSOT field_mismatch: {fm[:10]}")
          print(f"Profil-SSOT: field_mismatch leer (drift={report.get('drift')})")
          PY

      - name: Kanonische souls/ gegen SSOT prüfen (D15)
        run: python scripts/build_souls_ssot.py --check

      - name: Runtime-SOUL-Caches aus souls/ regenerieren (D15)
        # Caches sind gitignored und fehlen im frischen CI-Checkout. Ohne diesen
        # Schritt wuerde der Drift-Gate 0 Dateien pruefen und trotzdem gruen sein.
        run: python scripts/sync_soul_runtime_cache.py

      - name: Runtime-SOUL-Cache Drift (D15)
        run: python scripts/check_soul_ssot_drift.py --allow-missing --min-checked 568

      - name: Rollen-SSOT — semantische Negativ-Abgrenzung (D15)
        run: |
          python - <<'PY'
          import json, sys
          sys.path.insert(0, "scripts")
          from build_souls_ssot import semantic_scope_report, MIN_DISTINCT_NEGATIVE_SCOPES
          profiles = json.load(open("agent_profiles.json", encoding="utf-8"))
          sem = semantic_scope_report(profiles)
          # D15: Praesenz allein ist kein "rollenspezifisch" — nur echte Semantik zaehlt.
          print(
              f"negative_scope: {len(profiles)}/{len(profiles)} vorhanden, "
              f"{sem['distinct_bodies']} distinct (Minimum {MIN_DISTINCT_NEGATIVE_SCOPES})"
          )
          errors = []
          if sem["distinct_bodies"] < MIN_DISTINCT_NEGATIVE_SCOPES:
              errors.append(f"nur {sem['distinct_bodies']} distinct bodies")
          if sem["missing_en"]:
              errors.append(f"EN-Scope fehlt: {sem['missing_en'][:10]}")
          if sem["identical_en"]:
              errors.append(f"EN-Scope unuebersetzt: {sem['identical_en'][:10]}")
          if sem["high_risk_without_hitl"]:
              errors.append(f"HIGH_RISK ohne HITL: {sem['high_risk_without_hitl'][:10]}")
          if errors:
              sys.exit("D15-Semantik-Gate: " + "; ".join(errors))
          PY

      - name: EU-AI-Act HIGH_RISK == EXPECTED_HIGH_RISK_COUNT (D15, harter Test)
        run: |
          python - <<'PY'
          import sys
          from backend.eu_ai_act_inventory import EUAIActInventoryManager, EXPECTED_HIGH_RISK_COUNT
          stats = EUAIActInventoryManager().get_stats()
          n = stats["high_risk_count"]
          print(f"high_risk_count={n} (Soll {EXPECTED_HIGH_RISK_COUNT})")
          if n != EXPECTED_HIGH_RISK_COUNT:
              sys.exit(f"high_risk_count {n} != {EXPECTED_HIGH_RISK_COUNT}")
          PY

      - name: Compose-Image-Digest-Gate (D09, aufgelöster Wert)
        # Der Gate prueft nicht den Roh-String, sondern den von `docker compose
        # config` aufgeloesten Wert. Ein Env-Override wie N8N_IMAGE=...:latest
        # darf nicht gruen bleiben, nur weil der Quelltext ein ${...:-...@sha256}
        # enthaelt (Negativprobe am Ende dieses Schritts).
        run: |
          set -e
          [ -f .env ] || cp .env.example .env
          PROFILES="$(python - <<'PY'
          import yaml
          data = yaml.safe_load(open('docker-compose.yml', encoding='utf-8')) or {}
          names = sorted({p for c in (data.get('services') or {}).values() for p in (c.get('profiles') or [])})
          print(','.join(names))
          PY
          )"
          check_digest() {
            python - "$1" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          bad = []
          for svc, cfg in (data.get('services') or {}).items():
              if 'build' in cfg:
                  continue
              image = str(cfg.get('image') or '').strip()
              if image and '@sha256:' not in image:
                  bad.append(f'{svc}: {image}')
          if bad:
              sys.exit('Externe Images ohne @sha256: (aufgelöst):\n  ' + '\n  '.join(bad))
          print('OK: alle externen Images @sha256:-gepinnt')
          PY
          }
          for f in docker-compose.yml CRM/docker-compose.yml pocketbase/docker-compose.yml; do
            echo "Digest-Gate: $f"
            COMPOSE_PROFILES="$PROFILES" docker compose -f "$f" config --format json > /tmp/compose-resolved.json
            check_digest /tmp/compose-resolved.json
          done
          # Negativprobe: ein bewusst ungepinnter Env-Override muss den Gate rot machen.
          COMPOSE_PROFILES="$PROFILES" N8N_IMAGE=n8nio/n8n:latest \
            docker compose -f docker-compose.yml config --format json > /tmp/compose-negative.json
          if check_digest /tmp/compose-negative.json; then
            echo "Negativprobe fehlgeschlagen: ungepinnter Env-Override blieb unentdeckt"
            exit 1
          fi
          echo "Negativprobe bestanden: Gate lehnt ungepinnten Env-Override ab"

      - name: Audit-HMAC-Key vorhanden (GoBD-Startup-Gate)
        env:
          ARCHON_AUDIT_HMAC_KEY: ci-test-key-not-for-production
        run: python scripts/ensure_audit_hmac_key.py --check

      - name: Secrets- & Credential-Audit (Zero-Leak Gate)
        run: python scripts/audit_secrets.py --all

      - name: JavaScript Syntax Check
        run: |
          for f in static/js/*.js static/hermes-webui/*.js scripts/*.js; do
            node --check "$f"
          done

      - name: Python Syntax Check (compileall)
        run: python -m compileall -q archon backend scripts tools utils core_dispatcher.py main.py

      - name: YAML-Parse-Gate (yaml.safe_load)
        # F-070: harter Gate für alle Workflow-/Compose-YAMLs (kein `|| true`).
        run: |
          python - <<'PY'
          import glob
          import sys
          import yaml

          files = sorted(set(
              glob.glob(".github/workflows/*.yml")
              + glob.glob(".github/workflows/*.yaml")
              + glob.glob("docker-compose*.yml")
              + glob.glob("docker-compose*.yaml")
          ))
          if not files:
              sys.exit("Keine YAML-Dateien fuer den Parse-Gate gefunden")
          for path in files:
              with open(path, "r", encoding="utf-8") as fh:
                  yaml.safe_load(fh)
              print(f"yaml.safe_load OK: {path}")
          PY

      - name: Restore-Test-Gate (5/5)
        # F-070: fuehrt den echten Restore-Test aus. Deterministische Fixtures
        # werden im CI-Runner erzeugt; als Quelle dient ausschliesslich ein
        # frisches Backup-Artefakt, nie eine Live-DB (Audit A).
        run: |
          set -e
          python - <<'PY'
          import gzip
          import os
          import sqlite3
          import tempfile

          backup_dir = os.path.join(".hermes", "backups", "db")
          os.makedirs(backup_dir, exist_ok=True)
          specs = (
              ("ops.db", "tasks"),
              ("business.db", "deals"),
              ("memory.db", "learnings"),
              ("pb_data.db", "kontakte"),
          )
          with tempfile.TemporaryDirectory() as tmp:
              for name, table in specs:
                  raw = os.path.join(tmp, name)
                  con = sqlite3.connect(raw)
                  con.execute(f'CREATE TABLE "{table}" (id INTEGER PRIMARY KEY, payload TEXT)')
                  con.execute(f'INSERT INTO "{table}" (payload) VALUES (?)', ("ci-fixture",))
                  con.commit()
                  con.close()
                  with open(raw, "rb") as src, gzip.open(
                          os.path.join(backup_dir, f"{name}_ci.db.gz"), "wb") as dst:
                      dst.write(src.read())

          # Das Tenant-Artefakt aktiviert den 5. Check (TENANT_REPLICATION).
          tenant_dir = os.path.join("data", "tenants", "ci_verify")
          os.makedirs(tenant_dir, exist_ok=True)
          con = sqlite3.connect(os.path.join(tenant_dir, "tenant.db"))
          con.execute("CREATE TABLE t (id INTEGER PRIMARY KEY)")
          con.commit()
          con.close()
          PY
          python scripts/automated_restore_test.py --json > restore_report.json
          python - <<'PY'
          import json
          import sys

          with open("restore_report.json", "r", encoding="utf-8") as fh:
              report = json.load(fh)
          details = report.get("details", [])
          passed = [d for d in details if d.get("status") == "PASSED"]
          print(f"Restore-Test: {len(passed)}/{len(details)} Checks bestanden")
          for d in details:
              print(f"  {d.get('status')}: {d.get('database')} {d.get('error') or ''}")
          if (report.get("overall_status") != "PASSED"
                  or len(details) < 5 or len(passed) != len(details)):
              sys.exit(f"Restore-Gate fehlgeschlagen: {len(passed)}/{len(details)} bestanden")
          PY

  frontend-build:
    name: 1b. Next.js Typecheck & Build
    runs-on: ubuntu-latest
    env:
      ARCHON_TEST_DB_ISOLATION: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (gepinnt)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (gepinnt)
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Dependencies (lockfile, reproducible)
        run: npm ci
        working-directory: frontend
      - name: TypeScript Typecheck
        run: npx tsc --noEmit
        working-directory: frontend
      - name: Sanitizer-Regressionstests (npm test)
        run: npm test
        working-directory: frontend
      - name: Production Build
        run: npm run build
        working-directory: frontend

  test-suites:
    name: 2. Unit- & Security-Tests
    needs: validate-and-audit
    runs-on: ubuntu-latest
    env:
      # GitHub-Runner ist Bare-Metal (kein /.dockerenv): Sandbox-Run-Verzeichnis
      # ist bereits ein Host-Pfad, DooD-Mount-Auflösung ist nicht nötig.
      ARCHON_SANDBOX_BARE_METAL: "1"
      # Audit D09: Tests dürfen niemals in das shared data/ schreiben.
      # tests/conftest.py:60-64 erzeugt bei gesetztem Flag ein temp. ARCHON_DATA_DIR.
      ARCHON_TEST_DB_ISOLATION: "1"
    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (gepinnt)

      - name: Python 3.13 einrichten
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 (gepinnt)
        with:
          python-version: "3.13"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          # Audit D09: Hash-Lock ist zwingend — kein stiller Fallback auf Bereiche.
          test -f requirements.lock.txt
          pip install --require-hashes --no-deps -r requirements.lock.txt
          test -f requirements-test.lock.txt
          pip install --require-hashes --no-deps -r requirements-test.lock.txt
          # pyyaml/requests/psutil kommen bereits hash-geprueft aus requirements.lock.txt.
          mkdir -p data inbox

      - name: Gesamte Pytest-Suite ausführen
        run: pytest tests/ -q

      - name: Security-Guard Tests ausführen
        run: python -m unittest tests/test_security_and_validation.py

      - name: Router Tests ausführen
        run: python -m unittest tests/test_jev_router.py

  e2e-lifecycle:
    name: 3. End-to-End Lebenszyklus (Telegram -> Triage -> Task -> Fan-In -> Freigabe)
    needs: test-suites
    runs-on: ubuntu-latest
    env:
      ARCHON_TEST_DB_ISOLATION: "1"
    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (gepinnt)

      - name: Python 3.13 einrichten
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 (gepinnt)
        with:
          python-version: "3.13"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml requests psutil
          mkdir -p data inbox

      - name: E2E Lifecycle & MCP Testsuite
        run: python -m unittest tests/test_e2e_lifecycle.py

  docker-lint:
    name: 4. Docker-Compose Validierung
    needs: validate-and-audit
    runs-on: ubuntu-latest
    env:
      ARCHON_TEST_DB_ISOLATION: "1"
    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (gepinnt)

      - name: Docker Compose Syntaxprüfung (alle Varianten)
        run: |
          set -e
          [ -f .env ] || cp .env.example .env
          for f in docker-compose*.yml CRM/docker-compose.yml pocketbase/docker-compose.yml; do
            [ -f "$f" ] || continue
            echo "Prüfe $f"
            docker compose -f "$f" config --quiet
          done

  security-scan:
    name: 5. SAST / Dependency-Audit / SBOM
    needs: validate-and-audit
    runs-on: ubuntu-latest
    env:
      ARCHON_TEST_DB_ISOLATION: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (gepinnt)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 (gepinnt)
        with:
          python-version: "3.13"

      - name: Security-Tools installieren
        run: python -m pip install --upgrade pip "pip-audit>=2.7,<3.0" "bandit>=1.8,<2.0"

      - name: SBOM (Python-Dependency-Inventar)
        run: |
          python -m pip install --require-hashes --no-deps -r requirements.lock.txt
          python -m pip list --format=json > sbom-python.json

      - name: SBOM-Artefakt hochladen
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 (gepinnt)
        with:
          name: sbom-python
          path: sbom-python.json

      - name: Bekannte CVEs in Abhängigkeiten (pip-audit)
        # Hartes Gate: keine bekannten CVEs in der hash-geprüften Lockdatei.
        run: pip-audit -r requirements.lock.txt

      - name: Static Application Security Testing (bandit)
        # Hartes Gate auf HIGH-Severity-Funde (lokaler Lauf: 0 Funde).
        env:
          PYTHONIOENCODING: utf-8
        run: bandit -q -lll -r main.py core_dispatcher.py backend archon -x tests,scripts

  quality-gates:
    name: 6. Quality Gates (scharf)
    # Audit D09 / Register C24 aufgelöst: der Job darf wieder rot werden.
    # Scharf: kritischer Ruff-Subset (E9,F63,F7,F82), Coverage/Pytest, Install/Setup.
    # Re-Audit D09/R-B: keine continue-on-error-Baselines mehr. Die vollständigen
    # Läufe (ruff/mypy/eslint) laufen als HARTES Changed-Files-Ratchet: alter
    # Code bleibt unangetastet, aber jede geänderte Datei muss sauber sein.
    needs: validate-and-audit
    runs-on: ubuntu-latest
    env:
      ARCHON_TEST_DB_ISOLATION: "1"
    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (gepinnt)
        with:
          # Changed-Files-Ratchet braucht den Base-Commit (S-9.3).
          fetch-depth: 0

      - name: Python 3.13 einrichten
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 (gepinnt)
        with:
          python-version: "3.13"

      - name: Node 22 einrichten (nur für ESLint)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (gepinnt)
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Python-Abhängigkeiten für Coverage installieren (Hash-Lock, zwingend)
        run: |
          python -m pip install --upgrade pip
          test -f requirements.lock.txt
          pip install --require-hashes --no-deps -r requirements.lock.txt
          test -f requirements-test.lock.txt
          pip install --require-hashes --no-deps -r requirements-test.lock.txt
          # pyyaml/requests/psutil kommen bereits hash-geprueft aus requirements.lock.txt.
          mkdir -p data inbox

      - name: Qualitäts-Tools installieren (gepinnt, isolierter Schritt)
        run: pip install "ruff==0.17.6" "mypy==2.4.1" "coverage==7.17.5"

      - name: Ruff – kritische Fehlerklassen (HARTES GATE)
        # E9 = Syntaxfehler, F63/F7/F82 = ungültige Syntax/undefinierte Namen.
        # Diese Klassen bedeuten kaputten Code, nicht Style – null Toleranz.
        run: ruff check --select E9,F63,F7,F82 --output-format=concise archon backend scripts tools utils core_dispatcher.py main.py

      - name: Changed-Files-Ratchet – Diff-Bereich bestimmen
        id: changed
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="origin/${{ github.base_ref }}...HEAD"
          else
            RANGE="HEAD^ HEAD"
          fi
          echo "py=$(git diff --name-only --diff-filter=ACMR $RANGE -- '*.py' '*.pyi' | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          echo "js=$(git diff --name-only --diff-filter=ACMR $RANGE -- 'frontend/src/**/*.ts' 'frontend/src/**/*.tsx' 'frontend/src/**/*.js' 'frontend/src/**/*.mjs' | sed 's|^frontend/||' | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - name: Ruff – geänderte Dateien (HARTES RATCHET-GATE)
        shell: bash
        run: |
          FILES="${{ steps.changed.outputs.py }}"
          if [ -n "$FILES" ]; then
            echo "Ruff prüft geänderte Dateien: $FILES"
            # Audit D09: der Legacy-Ignore aus ruff.toml gilt nicht fuer den
            # Ratchet — F401/F841 muessen bei geaenderten Dateien wieder greifen.
            ruff check --select E,F,I --ignore E501 $FILES --output-format=concise
          else
            echo "Keine geänderten Python-Dateien — Ratchet nichts zu prüfen."
          fi

      - name: mypy – geänderte Dateien (HARTES RATCHET-GATE)
        shell: bash
        run: |
          FILES="${{ steps.changed.outputs.py }}"
          if [ -n "$FILES" ]; then
            echo "mypy prüft geänderte Dateien: $FILES"
            mypy --ignore-missing-imports --follow-imports=silent $FILES
          else
            echo "Keine geänderten Python-Dateien — Ratchet nichts zu prüfen."
          fi

      - name: Coverage (HARTES GATE – pytest muss laufen)
        run: |
          coverage run -m pytest tests/ -q
          coverage report

      - name: Frontend-Abhängigkeiten für ESLint installieren
        run: npm ci --prefix frontend

      - name: ESLint – geänderte Dateien (HARTES RATCHET-GATE)
        shell: bash
        run: |
          FILES="${{ steps.changed.outputs.js }}"
          if [ -n "$FILES" ]; then
            echo "ESLint prüft geänderte Dateien: $FILES"
            cd frontend && npx eslint $FILES
          else
            echo "Keine geänderten Frontend-Dateien — Ratchet nichts zu prüfen."
          fi
