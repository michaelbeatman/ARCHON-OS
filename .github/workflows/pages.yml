name: Deploy landing page

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # F-071: Actions per Commit-SHA pinnen (checkout-SHA wie in ci.yml:16).
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (gepinnt)
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5 (gepinnt)
      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3 (gepinnt)
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4 (gepinnt)

      # IndexNow ping after successful deploy
      - name: Ping IndexNow
        if: success()
        run: |
          KEY="ecac6512cb55e5cf2c2cbc128fb011880d31a24bbf3e8fcbda3db80e2ecab3b6"
          HOST="michaelbeatman.github.io"
          URLS=(
            "https://${HOST}/ARCHON-OS/"
            "https://${HOST}/ARCHON-OS/de/"
            "https://${HOST}/ARCHON-OS/zh/"
            "https://${HOST}/ARCHON-OS/ja/"
            "https://${HOST}/ARCHON-OS/ko/"
            "https://${HOST}/ARCHON-OS/ru/"
            "https://${HOST}/ARCHON-OS/fr/"
            "https://${HOST}/ARCHON-OS/es/"
            "https://${HOST}/ARCHON-OS/it/"
            "https://${HOST}/ARCHON-OS/nl/"
            "https://${HOST}/ARCHON-OS/pt/"
          )
          for url in "${URLS[@]}"; do
            echo "Pinging IndexNow for: $url"
            curl -s -X POST "https://api.indexnow.org/indexnow" \
              -H "Content-Type: application/json" \
              -d "{\"host\":\"${HOST}\",\"key\":\"${KEY}\",\"urlList\":[\"${url}\"]}" \
              || echo "Warning: ping failed for $url"
            sleep 0.5
          done
