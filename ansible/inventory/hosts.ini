# ==============================================================================
# Archon OS / AgenticOS 2026 - Ansible Inventory
# ==============================================================================

[local]
localhost ansible_connection=local ansible_python_interpreter=/usr/bin/python3

[homeservers]
# archon-homeserver ansible_host=192.168.1.100 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa

[production]
# archon-prod-01 ansible_host=prod.archon-os.internal ansible_user=deploy

[archon_nodes:children]
local
homeservers
production

[archon_nodes:vars]
archon_app_dir=/opt/archon-os
archon_data_dir=/opt/data
archon_user="{{ ansible_env.USER | default('ubuntu') }}"
archon_branch=main
use_dev_stack=true
