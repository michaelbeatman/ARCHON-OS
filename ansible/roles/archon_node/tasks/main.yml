---
# ==============================================================================
# Archon Node Provisioning Tasks
# ==============================================================================

- name: Update apt cache and install essential dependencies
  apt:
    name: "{{ archon_system_packages }}"
    state: present
    update_cache: yes
  when: ansible_os_family == "Debian"

- name: Create keyring directory for Docker
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  when: ansible_os_family == "Debian"

- name: Download Docker official GPG key
  get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'
    force: no
  when: ansible_distribution == "Ubuntu"

- name: Add Docker repository to Apt sources
  apt_repository:
    repo: "deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
    filename: docker
  when: ansible_distribution == "Ubuntu"

- name: Install Docker CE, CLI, and Docker Compose plugin
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: yes
  when: ansible_os_family == "Debian"

- name: Ensure Docker service is started and enabled
  service:
    name: docker
    state: started
    enabled: yes

- name: Add deployment user to docker group
  user:
    name: "{{ archon_user_name }}"
    groups: docker
    append: yes

- name: Ensure target application and data directory tree exists
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ archon_user_name }}"
    group: "{{ archon_user_name }}"
    mode: '0775'
  loop: "{{ archon_directories }}"

- name: Check if .env configuration exists
  stat:
    path: "{{ archon_install_root }}/.env"
  register: env_file_stat

- name: Initialize .env from .env.example if missing
  copy:
    src: "{{ archon_install_root }}/.env.example"
    dest: "{{ archon_install_root }}/.env"
    remote_src: yes
    owner: "{{ archon_user_name }}"
    group: "{{ archon_user_name }}"
    mode: '0600'
  when: not env_file_stat.stat.exists and archon_install_root is defined

- name: Configure file permissions for runtime data directories
  file:
    path: "{{ item }}"
    state: directory
    recurse: yes
    owner: "{{ archon_user_name }}"
    group: "{{ archon_user_name }}"
    mode: 'u=rwX,g=rX,o=rX'
  loop:
    - "{{ archon_install_root }}/data"
    - "{{ archon_install_root }}/pocketbase"
    - "{{ archon_install_root }}/static"
  ignore_errors: yes

- name: Warn when production DR target is still local (Audit D10)
  debug:
    msg: >-
      ARCHON_LITESTREAM_REPLICA_DIR ist nicht gesetzt: das Replikat liegt auf
      demselben Host wie die Primaer-DB. RTO-Ziel <= 30 min ist so nicht
      erreichbar. Bitte archon_litestream_replica_dir auf ein externes
      Volume/NAS setzen und scripts/automated_restore_test.py periodisch
      ausfuehren.
  when:
    - archon_observability == "full"
    - archon_litestream_replica_dir | default('') | length == 0

- name: Check external Litestream DR target exists (Audit D10)
  stat:
    path: "{{ archon_litestream_replica_dir }}"
  register: dr_target_stat
  when:
    - archon_observability == "full"
    - archon_litestream_replica_dir | default('') | length > 0

- name: Abort deploy when the external DR target is not mounted
  fail:
    msg: >-
      archon_litestream_replica_dir zeigt auf ein nicht vorhandenes Ziel.
      Bitte das externe Volume/NAS mounten oder den Pfad bewusst leeren
      (dann nur lokales Entwicklungs-Replikat, kein echtes DR-Ziel).
  when:
    - archon_observability == "full"
    - archon_litestream_replica_dir | default('') | length > 0
    - not dr_target_stat.stat.exists

- name: Launch Docker Compose stack
  command:
    cmd: "docker compose -f {{ archon_compose_file }} up -d --build --remove-orphans"
    chdir: "{{ archon_install_root }}"
  environment:
    # Audit D10: Profile muessen im Produktiv-Deploy aktiviert werden —
    # ohne COMPOSE_PROFILES bleiben Prometheus/Alertmanager/Grafana/Loki/
    # Promtail/Litestream/OTel trotz "full" aus (kein Adressat fuer Alarme).
    COMPOSE_PROFILES: "{{ 'monitoring,logging,replication,tracing' if archon_observability == 'full' else '' }}"
    ARCHON_OBSERVABILITY: "{{ archon_observability }}"
    # Audit D05/D10 (F-01): Produktion + erzwungene /readyz-Probes im
    # Produktiv-Deploy — sonst bleibt der Gate fail-open.
    ENVIRONMENT: "{{ archon_environment }}"
    ARCHON_READINESS_PROBES: "{{ archon_readiness_probes }}"
    # Audit D10: Watchdog-Altersschwellen an den externen Autoheal und den
    # Daemon durchreichen (beide Default 120 s).
    AUTOHEAL_WATCHDOG_MAX_AGE_S: "{{ archon_autoheal_watchdog_max_age_s }}"
    ARCHON_WATCHDOG_MAX_LAST_SEEN_AGE_S: "{{ archon_watchdog_max_last_seen_age_s }}"
    # Audit D10/DR: nur der vom Betreiber gesetzte Pfad wird weitergereicht;
    # leer laesst Compose seinen (lokalen) Default.
    ARCHON_LITESTREAM_REPLICA_DIR: "{{ archon_litestream_replica_dir | default('') }}"
  become_user: "{{ archon_user_name }}"
  register: docker_compose_output
  changed_when: "'Started' in docker_compose_output.stdout or 'Created' in docker_compose_output.stdout"

- name: Verify Observability services are up (Audit D10)
  command:
    cmd: "docker compose -f {{ archon_compose_file }} ps --status running --services"
    chdir: "{{ archon_install_root }}"
  become_user: "{{ archon_user_name }}"
  register: running_observability_services
  changed_when: false
  # alertmanager ist nur bei gesetzten Secrets erforderlich; ohne Secrets
  # bleibt der Status ehrlich `alerts_not_configured` (kein Crashloop).
  failed_when:
    - "'alertmanager' not in running_observability_services.stdout_lines"
    - archon_alert_secrets_configured | bool
  when: archon_observability == "full"

- name: Verify Mission Control readiness (dependency probes)
  uri:
    url: "{{ archon_readycheck_url }}"
    method: GET
    status_code: 200
  register: ready_result
  until: ready_result.status == 200
  retries: 12
  delay: 5
  # Kein ignore_errors: Readiness ist der Produktiv-Gate, nicht "Container läuft".

- name: Verify Mission Control health endpoint
  uri:
    url: "{{ archon_healthcheck_url }}"
    method: GET
    status_code: 200
  register: health_result
  until: health_result.status == 200
  retries: 12
  delay: 5
  # Kein ignore_errors: ein nicht erreichbarer Health-Endpoint muss das
  # Deployment scheitern lassen, statt "complete" zu melden.

- name: Send Alertmanager test alarm (Audit D10)
  uri:
    url: "http://localhost:9093/api/v2/alerts"
    method: POST
    body_format: json
    body:
      - labels:
          alertname: ArchonAlertmanagerSmokeTest
          severity: critical
          service: archon-deploy
        annotations:
          summary: "Archon OS Alertmanager smoke test"
          description: "Testalarm nach dem Ansible-Deploy; Telegram-Empfang gegenpruefen"
    status_code: 200
  register: alert_test_result
  when:
    - archon_observability == "full"
    - archon_alert_secrets_configured | bool
    - archon_alertmanager_test_alarm | bool

- name: Report alerts_not_configured (Audit D10)
  debug:
    msg: >-
      alerts_not_configured: TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID sind nicht
      hinterlegt. Alertmanager wurde nicht als Adressat verdrahtet; die
      Prometheus-Regeln bleiben ohne Zustellungsweg. Für echte Alarme
      archon_alert_secrets_configured: true setzen und Secrets in .env
      eintragen.
  when:
    - archon_observability == "full"
    - not (archon_alert_secrets_configured | bool)

- name: Schedule periodic Litestream restore test (Audit D10)
  # RTO-Ziel <= 30 min wird durch einen echten, periodischen Restore-Test
  # messbar — nicht nur durch einen Kommentar im Replikat-Pfad.
  cron:
    name: "archon-litestream-restore-test"
    minute: "0"
    hour: "*/6"
    job: "cd {{ archon_install_root }} && docker compose -f docker-compose.yml exec -T archon-os python scripts/automated_restore_test.py >> {{ archon_install_root }}/logs/restore_test.log 2>&1"
    user: "{{ archon_user_name }}"
  when:
    - archon_observability == "full"
    - archon_litestream_replica_dir | default('') | length > 0

- name: Display deployment completion status
  debug:
    msg: "Archon OS Node provisioning complete. Mission Control reachable on port 8501."
