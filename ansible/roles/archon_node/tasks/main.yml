---
# ==============================================================================
# Archon Node Provisioning Tasks
# ==============================================================================

- name: Update apt cache and install essential dependencies
  apt:
    name: "{{ archon_system_packages }}"
    state: present
    update_cache: yes
  when: ansible_os_family == "Debian"

- name: Create keyring directory for Docker
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  when: ansible_os_family == "Debian"

- name: Download Docker official GPG key
  get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'
    force: no
  when: ansible_distribution == "Ubuntu"

- name: Add Docker repository to Apt sources
  apt_repository:
    repo: "deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
    filename: docker
  when: ansible_distribution == "Ubuntu"

- name: Install Docker CE, CLI, and Docker Compose plugin
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: yes
  when: ansible_os_family == "Debian"

- name: Ensure Docker service is started and enabled
  service:
    name: docker
    state: started
    enabled: yes

- name: Add deployment user to docker group
  user:
    name: "{{ archon_user_name }}"
    groups: docker
    append: yes

- name: Ensure target application and data directory tree exists
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ archon_user_name }}"
    group: "{{ archon_user_name }}"
    mode: '0775'
  loop: "{{ archon_directories }}"

- name: Check if .env configuration exists
  stat:
    path: "{{ archon_install_root }}/.env"
  register: env_file_stat

- name: Initialize .env from .env.example if missing
  copy:
    src: "{{ archon_install_root }}/.env.example"
    dest: "{{ archon_install_root }}/.env"
    remote_src: yes
    owner: "{{ archon_user_name }}"
    group: "{{ archon_user_name }}"
    mode: '0600'
  when: not env_file_stat.stat.exists and archon_install_root is defined

- name: Configure file permissions for runtime data directories
  file:
    path: "{{ item }}"
    state: directory
    recurse: yes
    owner: "{{ archon_user_name }}"
    group: "{{ archon_user_name }}"
    mode: 'u=rwX,g=rX,o=rX'
  loop:
    - "{{ archon_install_root }}/data"
    - "{{ archon_install_root }}/pocketbase"
    - "{{ archon_install_root }}/static"
  ignore_errors: yes

- name: Warn when production DR target is still local (Audit D10)
  debug:
    msg: >-
      ARCHON_LITESTREAM_REPLICA_DIR ist nicht gesetzt: das Replikat liegt auf
      demselben Host wie die Primaer-DB. RTO-Ziel <= 30 min ist so nicht
      erreichbar. Bitte archon_litestream_replica_dir auf ein externes
      Volume/NAS setzen und scripts/automated_restore_test.py periodisch
      ausfuehren.
  # W5-C/D10-M3: DR gilt im Default (archon_dr_enabled: true), nicht nur im
  # Observability-Profil "full".
  when:
    - archon_dr_enabled | bool
    - archon_litestream_replica_dir | default('') | length == 0

- name: Check external Litestream DR target exists (Audit D10)
  stat:
    path: "{{ archon_litestream_replica_dir }}"
  register: dr_target_stat
  when:
    - archon_dr_enabled | bool
    - archon_litestream_replica_dir | default('') | length > 0

- name: Abort deploy when the external DR target is not mounted
  fail:
    msg: >-
      archon_litestream_replica_dir zeigt auf ein nicht vorhandenes Ziel.
      Bitte das externe Volume/NAS mounten oder den Pfad bewusst leeren
      (dann nur lokales Entwicklungs-Replikat, kein echtes DR-Ziel).
  when:
    - archon_dr_enabled | bool
    - archon_litestream_replica_dir | default('') | length > 0
    - not dr_target_stat.stat.exists

- name: Fail fast on Compose contract before starting the stack (Audit D10/M3+M4)
  # W5-C: `docker compose config --quiet` loest die ${VAR:?...}-Pflicht-Env
  # auf (ARCHON_HEARTBEAT_WEBHOOK_URL) und verifiziert die gehaertete Compose.
  # Ohne echten Empfaenger bricht der Deploy HIER ab, statt einen stillen
  # Dead-Man-Switch zu deployen. Ensures no override file is merged: -f is
  # explicit in every downstream command of this role.
  command:
    cmd: "docker compose -f {{ archon_compose_file }} config --quiet"
    chdir: "{{ archon_install_root }}"
  become_user: "{{ archon_user_name }}"
  changed_when: false

- name: Launch Docker Compose stack
  command:
    # W5-C/D10-M3: Litestream ist jetzt ein Default-Dienst. Bewusstes
    # archon_dr_enabled: false skaliert ihn auf 0 statt ihn ueber ein Profil
    # zu verstecken (nur isolierte Entwicklungs-Hosts).
    cmd: "docker compose -f {{ archon_compose_file }} up -d --build --remove-orphans{{ ' --scale litestream=0' if not (archon_dr_enabled | bool) else '' }}"
    chdir: "{{ archon_install_root }}"
  environment:
    # Audit D10: Observability-Profile bleiben "full"-Opt-in (Prometheus,
    # Alertmanager, Grafana, Loki, Promtail, OTel). W5-C/D10-M3: das
    # replication-Profil ist stattdessen an archon_dr_enabled (Default true)
    # gebunden — DR ist kein Monitoring-Feature und laeuft auch bei
    # archon_observability=off. Litestream zusaetzlich ohnehin als
    # Default-Dienst in docker-compose.yml (kein profiles:-Gate mehr).
    COMPOSE_PROFILES: "{{ ((['replication'] if archon_dr_enabled | bool else []) + (['monitoring', 'logging', 'tracing'] if archon_observability == 'full' else [])) | join(',') }}"
    ARCHON_OBSERVABILITY: "{{ archon_observability }}"
    # Audit D05/D10 (F-01): Produktion + erzwungene /readyz-Probes im
    # Produktiv-Deploy — sonst bleibt der Gate fail-open.
    ENVIRONMENT: "{{ archon_environment }}"
    ARCHON_READINESS_PROBES: "{{ archon_readiness_probes }}"
    ARCHON_READINESS_PROBE_URLS: "{{ archon_readiness_probe_urls }}"
    # Audit D10: Watchdog-Altersschwellen an den externen Autoheal und den
    # Daemon durchreichen (beide Default 120 s).
    AUTOHEAL_WATCHDOG_MAX_AGE_S: "{{ archon_autoheal_watchdog_max_age_s }}"
    ARCHON_WATCHDOG_MAX_LAST_SEEN_AGE_S: "{{ archon_watchdog_max_last_seen_age_s }}"
    # Audit D10/DR: nur der vom Betreiber gesetzte Pfad wird weitergereicht;
    # leer laesst Compose seinen (lokalen) Default.
    ARCHON_LITESTREAM_REPLICA_DIR: "{{ archon_litestream_replica_dir | default('') }}"
  become_user: "{{ archon_user_name }}"
  register: docker_compose_output
  changed_when: "'Started' in docker_compose_output.stdout or 'Created' in docker_compose_output.stdout"

- name: Verify Observability and DR services are up (Audit D10/M3)
  command:
    cmd: "docker compose -f {{ archon_compose_file }} ps --status running --services"
    chdir: "{{ archon_install_root }}"
  become_user: "{{ archon_user_name }}"
  register: running_observability_services
  changed_when: false
  # alertmanager ist nur bei gesetzten Secrets erforderlich; ohne Secrets
  # bleibt der Status ehrlich `alerts_not_configured` (kein Crashloop).
  # W5-C/D10-M3: zusaetzlich ist die echte Replikation im DEFAULT-Deploy
  # Pflicht — `docker ps` muss litestream zeigen, sonst ist DR nur Doku.
  failed_when:
    - archon_observability == "full" and archon_alert_secrets_configured | bool and 'alertmanager' not in running_observability_services.stdout_lines
    - archon_dr_enabled | bool and 'litestream' not in running_observability_services.stdout_lines
  when: archon_observability == "full" or archon_dr_enabled | bool

- name: Verify Mission Control readiness (dependency probes)
  uri:
    url: "{{ archon_readycheck_url }}"
    method: GET
    status_code: 200
  register: ready_result
  until: ready_result.status == 200
  retries: 12
  delay: 5
  # Kein ignore_errors: Readiness ist der Produktiv-Gate, nicht "Container läuft".

- name: Verify Mission Control health endpoint
  uri:
    url: "{{ archon_healthcheck_url }}"
    method: GET
    status_code: 200
  register: health_result
  until: health_result.status == 200
  retries: 12
  delay: 5
  # Kein ignore_errors: ein nicht erreichbarer Health-Endpoint muss das
  # Deployment scheitern lassen, statt "complete" zu melden.

- name: Send Alertmanager test alarm (Audit D10)
  uri:
    url: "http://localhost:9093/api/v2/alerts"
    method: POST
    body_format: json
    body:
      - labels:
          alertname: ArchonAlertmanagerSmokeTest
          severity: critical
          service: archon-deploy
        annotations:
          summary: "Archon OS Alertmanager smoke test"
          description: "Testalarm nach dem Ansible-Deploy; Telegram-Empfang gegenpruefen"
    status_code: 200
  register: alert_test_result
  when:
    - archon_observability == "full"
    - archon_alert_secrets_configured | bool
    - archon_alertmanager_test_alarm | bool

- name: Report alerts_not_configured (Audit D10)
  debug:
    msg: >-
      alerts_not_configured: TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID sind nicht
      hinterlegt. Alertmanager wurde nicht als Adressat verdrahtet; die
      Prometheus-Regeln bleiben ohne Zustellungsweg. Für echte Alarme
      archon_alert_secrets_configured: true setzen und Secrets in .env
      eintragen.
  when:
    - archon_observability == "full"
    - not (archon_alert_secrets_configured | bool)

- name: Schedule periodic Litestream restore test (Audit D10)
  # RTO-Ziel <= 30 min wird durch einen echten, periodischen Restore-Test
  # messbar — nicht nur durch einen Kommentar im Replikat-Pfad.
  cron:
    name: "archon-litestream-restore-test"
    minute: "0"
    hour: "*/6"
    job: "cd {{ archon_install_root }} && docker compose -f docker-compose.yml exec -T archon-os python scripts/automated_restore_test.py >> {{ archon_install_root }}/logs/restore_test.log 2>&1"
    user: "{{ archon_user_name }}"
  # W5-C/D10-M3: nicht mehr an Observability gebunden — der 6-h-Restore-Test
  # ist im Default (archon_dr_enabled: true) Teil des 24/7-Betriebs.
  when:
    - archon_dr_enabled | bool
    - archon_litestream_replica_dir | default('') | length > 0

- name: Schedule periodic chaos resilience suite (Audit D10/F043)
  # Restart-Recovery SLA < 15 s und echte WAL-Schreiblast (8x50
  # BEGIN IMMEDIATE) werden alle 6 h gemessen. `--live` ist noetig, damit
  # die SLA ueberhaupt gemessen wird (dry_run = nicht pruefbar). Ein Bruch
  # lässt die Suite mit Exit 1 fehlschlagen und landet im Cron-Log;
  # der CI-Gate nutzt denselben Exit-Code.
  cron:
    name: "archon-chaos-resilience-test"
    minute: "15"
    hour: "*/6"
    job: "cd {{ archon_install_root }} && docker compose -f docker-compose.yml exec -T archon-os python scripts/chaos_tester.py --live >> {{ archon_install_root }}/logs/chaos_test.log 2>&1"
    user: "{{ archon_user_name }}"
  # W5-C/D10-M3: wie der Restore-Test an DR statt an Monitoring gebunden.
  when: archon_dr_enabled | bool

- name: Schedule independent external dead-man heartbeat (Audit D10/M4)
  # W5-C: Der In-App-Heartbeat wird aus dem 30-s-Deadlock-Loop geschrieben —
  # haengt dieser, sterben Sender UND Pruefer gleichzeitig. Dieser Cron
  # schreibt den externen Dead-Man-Heartbeat unabhaengig davon alle 5 min.
  # Die Webhook-URL bleibt NUR in der .env (nicht in crontab -l sichtbar);
  # Compose erzwingt sie zusaetzlich ueber ${...:?...}.
  cron:
    name: "archon-deadman-heartbeat"
    minute: "*/5"
    job: "cd {{ archon_install_root }} && set -a && . ./.env && set +a && curl -fsS --max-time 10 -X POST -H 'Content-Type: application/json' -d '{\"status\":\"ok\",\"source\":\"archon-cron-heartbeat\"}' \"$ARCHON_HEARTBEAT_WEBHOOK_URL\" >> {{ archon_install_root }}/logs/heartbeat.log 2>&1"
    user: "{{ archon_user_name }}"
  when: archon_deadman_enabled | bool

- name: Verify Zero-Egress worker network is inspectable via socket proxy (Audit D10/M8)
  # W5-C: NETWORKS=1 + enge /networks/<name>/json-ACL in haproxy.cfg machen
  # `docker network inspect` aus dem Archon-Container heraus moeglich. Der
  # Gate Scheitert hart, wenn das Netz fehlt oder Internal != true — damit
  # ist die Sandbox-Voraussetzung im Produktivpfad nachgewiesen (§0).
  command:
    cmd: >-
      docker compose -f {{ archon_compose_file }} exec -T archon-os python -c
      "import subprocess,sys,json; r=subprocess.run(['docker','network','inspect','archon-worker-zero-egress_net'],capture_output=True,text=True); d=json.loads(r.stdout) if r.returncode==0 and r.stdout.strip() else []; sys.exit(0 if d and d[0].get('Internal') is True else 1)"
    chdir: "{{ archon_install_root }}"
  become_user: "{{ archon_user_name }}"
  changed_when: false
  when: archon_dr_enabled | bool

- name: Display deployment completion status
  debug:
    msg: "Archon OS Node provisioning complete. Mission Control reachable on port 8501."
