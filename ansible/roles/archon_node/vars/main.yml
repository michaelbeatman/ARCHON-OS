---
# Defaults and configuration variables for archon_node role
archon_repo_url: "https://github.com/michaelbeatman/ARCHON-OS.git"
archon_install_root: "/opt/archon-os"
archon_data_root: "/opt/data"
archon_user_name: "{{ ansible_user | default(ansible_env.USER | default('ubuntu')) }}"

# Required Linux system packages
archon_system_packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg
  - lsb-release
  - git
  - rsync
  - jq
  - unzip
  - htop
  - python3
  - python3-pip
  - python3-venv

# Working and persistence directories
archon_directories:
  - "{{ archon_install_root }}"
  - "{{ archon_install_root }}/data"
  - "{{ archon_install_root }}/agent_workspace"
  - "{{ archon_install_root }}/pocketbase/pb_data"
  - "{{ archon_install_root }}/pocketbase-media/pb_data"
  - "{{ archon_install_root }}/paperclip_data"
  - "{{ archon_install_root }}/obsidian_vault"
  - "{{ archon_install_root }}/static/avatars"
  - "{{ archon_install_root }}/logs"
  - "{{ archon_data_root }}"
  - "{{ archon_data_root }}/backups"
  - "{{ archon_data_root }}/secrets"
  - "{{ archon_data_root }}/snapshots"
  - "{{ ansible_env.HOME }}/.hermes"

# Audit D10: Produktiv-Deploy nutzt die produktive Compose-Datei.
# Die Dev-Variante contained --reload und hostgebundene /mnt/raid-Mounts
# und ist bewusst NICHT fuer den 24/7-Betrieb gedacht.
archon_compose_file: "docker-compose.yml"
archon_healthcheck_url: "http://localhost:8501/health"
archon_readycheck_url: "http://localhost:8501/readyz"

# Audit D05/D10 (F-01, D-D9): Produktionsmodus und erzwungene externe
# /readyz-Probes als Default-Deploy-Pfad. Nur bewusst isolierte Entwicklung
# darf diese Werte ueberschreiben.
archon_environment: "production"
archon_readiness_probes: "1"

# Audit D10: Alertmanager-Nachweis. Der Betreiber setzt
# archon_alert_secrets_configured auf true, wenn TELEGRAM_BOT_TOKEN und
# TELEGRAM_CHAT_ID in der .env hinterlegt sind; erst dann greift der
# Testalarm-Gate und alertmanager ist im ps-Check erforderlich.
archon_alert_secrets_configured: false
archon_alertmanager_test_alarm: true

# Audit D10: Watchdog-Altersschwellen im Container konsistent verdrahten.
archon_autoheal_watchdog_max_age_s: "120"
archon_watchdog_max_last_seen_age_s: "120"

# Audit D10: Produktiv-Observability im Ansible-Deploy. "full" aktiviert die
# Compose-Profile monitoring,logging,replication,tracing — damit starten
# Prometheus, Grafana, Loki, Promtail, Litestream und der OTel-Collector; der
# Alertmanager nur bei gesetzten Telegram-Secrets. Langfuse v2 ist EOL und
# aus Compose/Startern entfernt (Audit D09/D10, D-D8). Default "off" =
# Normal-Start (identisch zu start.bat / install.sh).
archon_observability: "off"

# Audit D10/DR: Das Litestream-Replikat liegt auf einem vom DB-Volumen
# GETRENNTEN Ziel. Der Betreiber mountet /mnt/archon-dr (NAS/externes Volume)
# und passt den Pfad an; der Deploy bricht ab, wenn das Ziel nicht existiert.
# Leer = Compose-Default ./dr_replicas (nur Entwicklung, kein echtes DR-Ziel).
# RPO ~5-10 s (sync-interval), RTO-Ziel <= 30 min, messbar durch den
# periodischen Restore-Test (scripts/automated_restore_test.py, alle 6 h).
archon_litestream_replica_dir: "/mnt/archon-dr/litestream_replicas"
