<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archon CRM - LinkedIn Companion</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <span class="logo">⚡</span>
        <div>
          <h1>Archon CRM</h1>
          <span class="version">v1.0.0</span>
        </div>
      </div>
      <div id="status-indicator" class="status-indicator offline" title="Checking server connection...">
        <span class="status-dot"></span>
        <span id="status-text">Prüfe...</span>
      </div>
    </header>

    <!-- Tab Navigation -->
    <nav class="nav-tabs">
      <button class="tab-btn active" data-tab="tab-current">Aktuelles Profil</button>
      <button class="tab-btn" data-tab="tab-search">CRM Suche</button>
      <button class="tab-btn" data-tab="tab-settings">Einstellungen</button>
    </nav>

    <!-- Tab 1: Current Profile -->
    <section id="tab-current" class="tab-content active">
      <div id="current-profile-card" class="card">
        <div class="loading-spinner">Scanne LinkedIn-Seite...</div>
      </div>
    </section>

    <!-- Tab 2: CRM Search -->
    <section id="tab-search" class="tab-content">
      <div class="search-box">
        <input type="text" id="search-input" placeholder="Name, Firma oder Rolle suchen..." />
        <button id="search-btn" class="btn btn-primary">Suchen</button>
      </div>
      <div id="search-results" class="results-list">
        <p class="hint">Gib einen Suchbegriff ein...</p>
      </div>
    </section>

    <!-- Tab 3: Settings -->
    <section id="tab-settings" class="tab-content">
      <div class="card settings-card">
        <label for="pb-url-input">PocketBase URL:</label>
        <div class="input-group">
          <input type="url" id="pb-url-input" value="http://localhost:8090" placeholder="http://localhost:8090" />
          <button id="save-settings-btn" class="btn btn-secondary">Speichern</button>
        </div>
        <p class="hint-text">Standard: <code>http://localhost:8090</code></p>
        <div id="settings-feedback" class="feedback"></div>
      </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <a href="http://localhost:8090/_/" target="_blank" class="footer-link">
        ↗ PocketBase Admin UI öffnen
      </a>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
