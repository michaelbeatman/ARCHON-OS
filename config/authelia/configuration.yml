# config/authelia/configuration.yml
# Authelia 2FA / SSO Konfiguration für Archon OS 2026

server:
  host: 0.0.0.0
  port: 9091

log:
  level: info

theme: dark

jwt_secret: ${AUTHELIA_JWT_SECRET}

default_redirection_url: http://localhost/

totp:
  issuer: ArchonOS
  period: 30
  skew: 1

webauthn:
  disable: false
  display_name: Archon OS Passkey

authentication_backend:
  file:
    path: /config/users_database.yml
    password:
      algorithm: argon2

access_control:
  default_policy: deny
  rules:
    # Öffentliche Health- und Metrik-Endpunkte passieren ohne 2FA
    - domain:
        - localhost
        - 127.0.0.1
      resources:
        - "^/health$"
        - "^/metrics$"
        - "^/api/operations/metrics$"
      policy: bypass

    # Alle administrativen Dienste erfordern Zwei-Faktor-Authentifizierung (TOTP / Passkey)
    - domain:
        - localhost
        - 127.0.0.1
      resources:
        - "^/hermes.*"
        - "^/n8n.*"
        - "^/grafana.*"
        - "^/prometheus.*"
        - "^/uptime.*"
      policy: two_factor

    # Kernzugriff auf das Operations Dashboard erfordert mindestens Ein-Faktor
    - domain:
        - localhost
        - 127.0.0.1
      policy: one_factor

session:
  name: archon_session
  same_site: lax
  secret: ${AUTHELIA_SESSION_SECRET}
  expiration: 1h
  inactivity: 15m

regulation:
  max_retries: 5
  find_time: 2m
  ban_time: 10m

storage:
  local:
    path: /config/db.sqlite3

notifier:
  filesystem:
    filename: /config/notification.txt
