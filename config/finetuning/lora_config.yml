# ==============================================================================
# Archon OS 2026 - LoRA Fine-Tuning Configuration
# Target: Small Local Routing & Triage Models (Qwen2.5-7B, Llama-3.1-8B)
# ==============================================================================

# Base Model Selection
model:
  base_model: "Qwen/Qwen2.5-7B-Instruct"  # Alternative: "meta-llama/Llama-3.1-8B-Instruct"
  torch_dtype: "bfloat16"
  load_in_4bit: true                     # QLoRA for consumer GPUs (12GB - 24GB VRAM)
  device_map: "auto"

# LoRA (Low-Rank Adaptation) Hyperparameters
lora:
  r: 16                                  # Rank dimension
  lora_alpha: 32                         # Scaling factor (usually 2 * r)
  lora_dropout: 0.05
  bias: "none"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  task_type: "CAUSAL_LM"

# Dataset Settings
data:
  train_file: "data/finetuning/train_chat.jsonl"
  eval_file: "data/finetuning/eval_chat.jsonl"
  format: "chat"                         # chat (OpenAI/TRL), alpaca, or sharegpt
  max_seq_length: 2048
  packing: false                         # Sequence packing for faster training

# Training Hyperparameters (TRL SFTConfig / Unsloth)
training:
  output_dir: "models/archon-router-lora-v1"
  num_train_epochs: 3
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4        # Effective batch size = 16
  learning_rate: 0.0002                  # 2e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.05
  weight_decay: 0.01
  optim: "adamw_8bit"                    # 8-bit Adam for VRAM optimization
  fp16: false
  bf16: true                             # Recommended for Ampere (RTX 30xx/40xx)
  logging_steps: 10
  eval_strategy: "steps"
  eval_steps: 50
  save_strategy: "steps"
  save_steps: 50
  save_total_limit: 3
  seed: 42

# Export & Serving
export:
  merge_lora_and_save: true             # Merge LoRA weights into base model
  export_gguf: true                      # Quantize to GGUF (Q4_K_M) for Ollama/Hermes
  gguf_quantization: "q4_k_m"
  ollama_model_name: "archon-routine:7b"
