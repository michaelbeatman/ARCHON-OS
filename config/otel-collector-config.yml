# Archon OS — OpenTelemetry Collector Configuration (D16 / P1, Re-Audit R-B6)
#
# Kein toter Default-Endpunkt mehr: ohne explizit gesetzten Downstream bleiben
# die Spans in einem lokalen file-Exporter (immer erreichbar). Das EOL-
# Langfuse-v2-Artefakt ist aus Compose und Startern entfernt (Audit D09/D10,
# D-D8); ein aktuelles Langfuse wird nur ueber die LANGFUSE_*-Werte als
# direkter App-Export angebunden und meldet ohne Keys ehrlich `not_configured`.
# EHR-LICHER STATUS (D16/HIGH, S-1.5): collector_downstream =
# not_configured/local_only. Es ist KEIN Tempo/Jaeger/Langfuse-Downstream
# verdrahtet; die Spans landen ausschliesslich in debug + file/traces-local.
# backend/otel_tracer.get_tracing_status() meldet exakt diesen Zustand, statt
# einen nicht gestarteten Consumer zu behaupten. Ein echter Downstream muss
# aktiv (Compose + Volume + Grafana-Datasource) verdrahtet werden — A1.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 5s
    limit_mib: 256
    spike_limit_mib: 64
  # Sampling hart auch im Collector (zusaetzlich zum Tracer). Spans mit
  # archon.sampled=false werden verworfen, nicht nur markiert.
  filter/unsampled:
    error_mode: ignore
    traces:
      span:
        - 'attributes["archon.sampled"] == false'
  batch:
    send_batch_size: 256
    timeout: 5s

exporters:
  debug:
    verbosity: basic
  # Immer erreichbarer Default-Sink; kein Verweis auf einen nicht gestarteten Container.
  file/traces-local:
    path: /tmp/archon-otel-traces.json

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, filter/unsampled, batch]
      exporters: [debug, file/traces-local]
