# Archon OS — OpenTelemetry Collector Configuration (D16 / P1, Re-Audit R-B6)
#
# Kein toter Default-Endpunkt mehr: ohne explizit gesetzten Downstream bleiben
# die Spans in einem lokalen file-Exporter (immer erreichbar). Langfuse v2 ist
# EOL und Opt-in (Profil `langfuse`, NICHT in tracing/observability/all/full);
# der App-Export dorthin laeuft direkt ueber LANGFUSE_* und meldet ehrlich
# `not_configured` (S-1.5), wenn die Keys fehlen.
# Ein echter OTLP-Consumer (Tempo/Langfuse v4) muss von P0 aktiv verdrahtet
# werden — kein Default auf einen nicht gestarteten Container.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 5s
    limit_mib: 256
    spike_limit_mib: 64
  # Sampling hart auch im Collector (zusaetzlich zum Tracer). Spans mit
  # archon.sampled=false werden verworfen, nicht nur markiert.
  filter/unsampled:
    error_mode: ignore
    traces:
      span:
        - 'attributes["archon.sampled"] == false'
  batch:
    send_batch_size: 256
    timeout: 5s

exporters:
  debug:
    verbosity: basic
  # Immer erreichbarer Default-Sink; kein Verweis auf einen nicht gestarteten Container.
  file/traces-local:
    path: /tmp/archon-otel-traces.json

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, filter/unsampled, batch]
      exporters: [debug, file/traces-local]
