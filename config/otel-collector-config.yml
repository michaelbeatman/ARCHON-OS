# Archon OS — OpenTelemetry Collector Configuration (D16 / P1, Re-Audit R-B6)
#
# Zwei echte Traces-Pipelines am selben OTLP-Receiver (vom Collector offiziell
# supported): `traces` archiviert lokal, `traces/downstream` schickt die Spans
# an Grafana Tempo. Damit ist die Kausalkette nicht mehr nur in der lokalen
# SQLite-DB bzw. im Container-/tmp, sondern in einer abfragbaren
# Trace-Backend-Instanz rekonstruierbar (Soll §3, H-16-2).
#
# Der lokale file-Exporter bleibt als immer erreichbarer Fallback erhalten;
# sein Ziel liegt jetzt auf einem Compose-Volume (otel_local_traces), nicht
# mehr auf einem fluechtigen /tmp im Container. Ein extern betriebenes
# Langfuse wird weiterhin direkt aus der App ueber LANGFUSE_* angebunden
# (kein EOL-Langfuse-v2-Container, kein toter Default-Endpunkt).
#
# EHR-LICHER STATUS (H-16-1, S-1.5): Dies ist W3C Trace Context + lokaler
# SQLite-Span-Recorder, KEIN OTel-SDK. Die App erzeugt W3C-IDs und sendet
# OTLP/HTTP-JSON per urllib an diesen Collector; es gibt keinen
# TracerProvider/BatchSpanProcessor aus dem SDK. `get_tracing_status()`
# weist das explizit aus (otel_sdk=false, implementation=...).

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 5s
    limit_mib: 256
    spike_limit_mib: 64
  # Sampling hart auch im Collector (zusaetzlich zum Tracer). Spans mit
  # archon.sampled=false werden verworfen, nicht nur markiert.
  filter/unsampled:
    error_mode: ignore
    traces:
      span:
        - 'attributes["archon.sampled"] == false'
  batch:
    send_batch_size: 256
    timeout: 5s

exporters:
  debug:
    verbosity: basic
  # Immer erreichbarer lokaler Sink auf einem persistenten Volume.
  file/traces-local:
    path: /var/lib/otel/traces-local.json
  # H-16-2: echter zentraler Downstream. Tempo laeuft im selben Netz unter
  # `tempo` und nimmt OTLP/HTTP auf 4318 entgegen (siehe docker-compose.yml).
  otlphttp/downstream:
    endpoint: http://tempo:4318
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, filter/unsampled, batch]
      exporters: [debug, file/traces-local]
    # Eigene Pipeline fuer den zentralen Trace-Store. Der Receiver fan-outet
    # dieselben Spans an beide Pipelines; die Processor-Instanzen sind
    # pipeline-lokal (kein geteilter Zustand).
    traces/downstream:
      receivers: [otlp]
      processors: [memory_limiter, filter/unsampled, batch]
      exporters: [otlphttp/downstream]
