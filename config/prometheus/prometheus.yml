# config/prometheus/prometheus.yml
# Prometheus Scrape-Konfiguration für Archon OS und Docker-Dienste

global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Re-Audit H7: Exemplare (trace_id/span_id) muessen explizit aktiviert werden
# (`--enable-feature=exemplar-storage` im Prometheus-Container, see
# docker-compose.yml). Der Ringpuffer ist pro Serie begrenzt; der App-Scrape
# muss Exemplare im OpenMetrics-Format liefern, sonst bleiben sie leer.
storage:
  exemplars:
    max_exemplars: 100000

# SLO-/Burn-Rate-Regeln (reine Konfiguration, kein neuer Python-Service).
# ACHTUNG (compose): Die Datei muss zusätzlich nach /etc/prometheus/alerts.yml
# gemountet werden, sonst startet Prometheus nicht ("no such file").
rule_files:
  - /etc/prometheus/alerts.yml

# Alertmanager läuft im selben Docker-Netz (agentic_mesh) wie Prometheus.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "archon-os"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["archon-os:8501"]
        labels:
          environment: "production"
          service: "archon-fastapi-core"

  - job_name: "omniroute"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["omniroute:20128"]
        labels:
          environment: "production"
          service: "llm-router"
