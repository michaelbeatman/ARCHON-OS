# ---------------------------------------------------------------------------
# docker-socket-proxy — korrigierte Fassung (Paket 1, Teil C)
#
# VORBEREITUNG, NICHT ANGEWENDET. Die laufende Datei im Container
# (docker-socket-proxy:/tmp/haproxy.cfg) matchte Praefixe:
#     http-request allow if { path ... -i ^(/v[\d\.]+)?/containers } { env(CONTAINERS) -m bool }
# Damit war jede Unterseite von /containers erlaubt, sobald CONTAINERS=1 gesetzt
# war — auch /containers/<x>/restart, /stop, /kill und /exec. Folge (gemessen
# 2026-11-07 gegen den laufenden Proxy): POST /containers/<nicht-existent>/restart
# und /stop lieferten 404 von Docker statt 403 vom Proxy; ALLOW_RESTARTS=0 und
# ALLOW_STOP=0 waren wirkungslos.
#
# Diese Fassung ankert jeden Pfad, fuer den es ein eigenes Flag gibt ($-Anker).
# Namespace-Flags ohne Unter-Flags (images, networks, volumes, tasks, services)
# bleiben bewusst Subtree-Matches — dort ist "ganzer Namespace" die Semantik.
#
# Quelle der laufenden Datei: docker exec docker-socket-proxy cat /tmp/haproxy.cfg
# Pfad-Inventar und Flag-Matrix: siehe README.md in diesem Verzeichnis.
# ---------------------------------------------------------------------------

global
    log stdout format raw daemon "${LOG_LEVEL}"

    pidfile /run/haproxy.pid
    maxconn 4000

    # Turn on stats unix socket
    server-state-file /var/lib/haproxy/server-state

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option http-server-close
    option redispatch
    retries 3
    timeout http-request 10s
    timeout queue 1m
    timeout connect 10s
    timeout client 10m
    timeout server 10m
    timeout http-keep-alive 10s
    timeout check 10s
    maxconn 3000

    # Allow seamless reloads
    load-server-state-from-file global

    # Use provided example error pages
    errorfile 400 /usr/local/etc/haproxy/errors/400.http
    errorfile 403 /usr/local/etc/haproxy/errors/403.http
    errorfile 408 /usr/local/etc/haproxy/errors/408.http
    errorfile 500 /usr/local/etc/haproxy/errors/500.http
    errorfile 502 /usr/local/etc/haproxy/errors/502.http
    errorfile 503 /usr/local/etc/haproxy/errors/503.http
    errorfile 504 /usr/local/etc/haproxy/errors/504.http

backend dockerbackend
    server dockersocket $SOCKET_PATH

backend docker-events
    server dockersocket $SOCKET_PATH
    timeout server 0

frontend dockerfrontend
    bind [::]:2375 v4v6

    # Methode zuerst: GET immer, POST nur mit POST=1. DELETE/PUT/PATCH fallen
    # damit grundsaetzlich in das deny am Ende.
    http-request deny unless METH_GET || { env(POST) -m bool }

    # --- Lese-Endpunkte: exakt, weil sie von einem Flag mit Unter-Flags geteilt werden ---
    # Health/Meta
    http-request allow if { path,url_dec -m reg -i ^(/v[0-9.]+)?/_ping$ }   { env(PING) -m bool }
    http-request allow if { path,url_dec -m reg -i ^(/v[0-9.]+)?/version$ } { env(VERSION) -m bool }
    http-request allow if { path,url_dec -m reg -i ^(/v[0-9.]+)?/info$ }    { env(INFO) -m bool }

    # Container-Liste, -Inspect, -Logs, -Stats (alle unter CONTAINERS)
    http-request allow if { path,url_dec -m reg -i ^(/v[0-9.]+)?/containers/json$ }                    { env(CONTAINERS) -m bool }
    http-request allow if { path,url_dec -m reg -i ^(/v[0-9.]+)?/containers/[A-Za-z0-9_.-]+/json$ }    { env(CONTAINERS) -m bool }
    http-request allow if { path,url_dec -m reg -i ^(/v[0-9.]+)?/containers/[A-Za-z0-9_.-]+/logs$ }    { env(CONTAINERS) -m bool }
    http-request allow if { path,url_dec -m reg -i ^(/v[0-9.]+)?/containers/[A-Za-z0-9_.-]+/stats$ }   { env(CONTAINERS) -m bool }

    # --- Container-Aktionen: je Aktion das eigene Flag, exakt ---
    # `stop` steht wie im Original unter ALLOW_RESTARTS (Upstream-Semantik von
    # tecnativa/docker-socket-proxy: "restart/stop/kill") UND zusaetzlich unter
    # ALLOW_STOP. Wer nur ALLOW_STOP=1 setzt, kann stoppen; wer nur
    # ALLOW_RESTARTS=1 setzt, ebenfalls — wie bisher dokumentiert.
    http-request allow if { path,url_dec -m reg -i ^(/v[0-9.]+)?/containers/[A-Za-z0-9_.-]+/(restart|stop|kill)$ } { env(ALLOW_RESTARTS) -m bool }
    http-request allow if { path,url_dec -m reg -i ^(/v[0-9.]+)?/containers/[A-Za-z0-9_.-]+/start$ }   { env(ALLOW_START) -m bool }
    http-request allow if { path,url_dec -m reg -i ^(/v[0-9.]+)?/containers/[A-Za-z0-9_.-]+/stop$ }    { env(ALLOW_STOP) -m bool }
    http-request allow if { path,url_dec -m reg -i ^(/v[0-9.]+)?/containers/[A-Za-z0-9_.-]+/pause$ }   { env(ALLOW_PAUSE) -m bool }
    http-request allow if { path,url_dec -m reg -i ^(/v[0-9.]+)?/containers/[A-Za-z0-9_.-]+/unpause$ } { env(ALLOW_UNPAUSE) -m bool }

    # --- Exec: Erstellung UND Start hinter demselben Flag (EXEC) ---
    # Vorher war nur die Erstellung durch die /containers-Praefixregel erlaubt und
    # der Start (/exec/<id>/start) durch EXEC=0 gesperrt — eine halbe Sperre:
    # Erstellen allein fuehrt nichts aus, aber die Absicht "kein exec" war nur
    # zufaellig eingehalten. Jetzt haengen beide Enden am selben Flag.
    http-request allow if { path,url_dec -m reg -i ^(/v[0-9.]+)?/containers/[A-Za-z0-9_.-]+/exec$ } { env(EXEC) -m bool }
    http-request allow if { path,url_dec -m reg -i ^(/v[0-9.]+)?/exec/[A-Za-z0-9_.-]+/(start|json|resize)$ } { env(EXEC) -m bool }

    # --- Namespaces mit eigenem Flag (Subtree ist hier die Semantik) ---
    http-request allow if { path,url_dec -m reg -i ^(/v[0-9.]+)?/auth(/.*)?$ }         { env(AUTH) -m bool }
    http-request allow if { path,url_dec -m reg -i ^(/v[0-9.]+)?/build(/.*)?$ }        { env(BUILD) -m bool }
    http-request allow if { path,url_dec -m reg -i ^(/v[0-9.]+)?/commit(/.*)?$ }       { env(COMMIT) -m bool }
    http-request allow if { path,url_dec -m reg -i ^(/v[0-9.]+)?/configs(/.*)?$ }      { env(CONFIGS) -m bool }
    http-request allow if { path,url_dec -m reg -i ^(/v[0-9.]+)?/distribution(/.*)?$ } { env(DISTRIBUTION) -m bool }
    http-request allow if { path,url_dec -m reg -i ^(/v[0-9.]+)?/events$ }             { env(EVENTS) -m bool }
    http-request allow if { path,url_dec -m reg -i ^(/v[0-9.]+)?/grpc(/.*)?$ }         { env(GRPC) -m bool }
    http-request allow if { path,url_dec -m reg -i ^(/v[0-9.]+)?/images(/.*)?$ }       { env(IMAGES) -m bool }
    http-request allow if { path,url_dec -m reg -i ^(/v[0-9.]+)?/networks(/.*)?$ }     { env(NETWORKS) -m bool }
    http-request allow if { path,url_dec -m reg -i ^(/v[0-9.]+)?/nodes(/.*)?$ }        { env(NODES) -m bool }
    http-request allow if { path,url_dec -m reg -i ^(/v[0-9.]+)?/plugins(/.*)?$ }      { env(PLUGINS) -m bool }
    http-request allow if { path,url_dec -m reg -i ^(/v[0-9.]+)?/secrets(/.*)?$ }      { env(SECRETS) -m bool }
    http-request allow if { path,url_dec -m reg -i ^(/v[0-9.]+)?/services(/.*)?$ }     { env(SERVICES) -m bool }
    http-request allow if { path,url_dec -m reg -i ^(/v[0-9.]+)?/session(/.*)?$ }      { env(SESSION) -m bool }
    http-request allow if { path,url_dec -m reg -i ^(/v[0-9.]+)?/swarm(/.*)?$ }        { env(SWARM) -m bool }
    http-request allow if { path,url_dec -m reg -i ^(/v[0-9.]+)?/system(/.*)?$ }       { env(SYSTEM) -m bool }
    http-request allow if { path,url_dec -m reg -i ^(/v[0-9.]+)?/tasks(/.*)?$ }        { env(TASKS) -m bool }
    http-request allow if { path,url_dec -m reg -i ^(/v[0-9.]+)?/volumes(/.*)?$ }      { env(VOLUMES) -m bool }

    # Alles, was keine der Regeln oben trifft: 403 vom Proxy, nicht 404 von Docker.
    http-request deny
    default_backend dockerbackend

    use_backend docker-events if { path,url_dec -m reg -i ^(/v[0-9.]+)?/events$ }
