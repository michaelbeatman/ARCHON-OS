# ---------------------------------------------------------------------------
# docker-socket-proxy — korrigierte Fassung (Paket 1, Teil C)
#
# VORBEREITUNG, NICHT ANGEWENDET. Die laufende Datei im Container
# (docker-socket-proxy:/tmp/haproxy.cfg) matchte Praefixe:
#     http-request allow if { path,url_dec -m reg -i ^(/v[0-9.]+)?/containers-Praefix } ...
# (Praefix-Match auf den kompletten Container-Teilbaum, ohne $-Anker)
# Damit war jede Unterseite erlaubt, sobald CONTAINERS=1 gesetzt war — auch
# /containers/<x>/restart, /stop, /kill und /exec. Folge (gemessen 2026-11-07
# gegen den laufenden Proxy): POST /containers/<nicht-existent>/restart und /stop
# lieferten 404 von Docker statt 403 vom Proxy; ALLOW_RESTARTS=0 und ALLOW_STOP=0
# waren wirkungslos.
#
# Diese Fassung ankert jeden Pfad, fuer den es ein eigenes Flag gibt ($-Anker).
# Namespace-Flags ohne Unter-Flags (images, networks, volumes, tasks, services)
# bleiben bewusst Subtree-Matches — dort ist "ganzer Namespace" die Semantik.
#
# Quelle der laufenden Datei: docker exec docker-socket-proxy cat /tmp/haproxy.cfg
# Pfad-Inventar und Flag-Matrix: siehe README.md in diesem Verzeichnis.
# ---------------------------------------------------------------------------

global
    log stdout format raw daemon "${LOG_LEVEL}"

    pidfile /run/haproxy.pid
    maxconn 4000

    # Turn on stats unix socket
    server-state-file /var/lib/haproxy/server-state

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option http-server-close
    option redispatch
    retries 3
    timeout http-request 10s
    timeout queue 1m
    timeout connect 10s
    timeout client 10m
    timeout server 10m
    timeout http-keep-alive 10s
    timeout check 10s
    maxconn 3000

    # Allow seamless reloads
    load-server-state-from-file global

    # Use provided example error pages
    errorfile 400 /usr/local/etc/haproxy/errors/400.http
    errorfile 403 /usr/local/etc/haproxy/errors/403.http
    errorfile 408 /usr/local/etc/haproxy/errors/408.http
    errorfile 500 /usr/local/etc/haproxy/errors/500.http
    errorfile 502 /usr/local/etc/haproxy/errors/502.http
    errorfile 503 /usr/local/etc/haproxy/errors/503.http
    errorfile 504 /usr/local/etc/haproxy/errors/504.http

backend dockerbackend
    server dockersocket $SOCKET_PATH

backend docker-events
    server dockersocket $SOCKET_PATH
    timeout server 0

frontend dockerfrontend
    # F20 (Cluster 3): Der Listener ist per Compose nur noch im internen Netz
    # `archon-admin_net` erreichbar (Mitglieder: ARCHON-OS, hermes). Damit ist die
    # Netzzugehoerigkeit die erste Authentisierungsstufe — ein kompromittierter
    # Fach-Container (anything-llm, n8n, CRM, ...) kommt nicht mehr an den Daemon.
    #
    # Optional zweite Stufe (bewusst NICHT aktiv, weil die Clients
    # utils/docker_client.py heute keine Credentials senden — erst aktivieren,
    # wenn Client und Secret zusammen ausgerollt werden):
    #     userlist proxy_users
    #         user archon password $2y$05$<bcrypt-hash-aus-.env>
    #     acl proxy_needs_auth always_true
    #     http-request auth realm archon-docker-api if proxy_needs_auth !{ env(PROXY_AUTH_DISABLED) -m bool }
    bind [::]:2375 v4v6

    # ---------------------------------------------------------------------
    # Methoden-ACL (Stufe 1): erlaubt sind ausschliesslich GET und POST.
    # Die alte Zeile `deny unless METH_GET || { env(POST) -m bool }` liess bei
    # POST=1 JEDE Methode durch, die eine Pfadregel fand — DELETE, PUT, PATCH
    # eingeschlossen. Gemessen am 2026-11-07: DELETE /images/gibtsnicht:latest
    # -> 404 (also bis Docker durchgekommen). Reihenfolge ist wesentlich:
    # diese denies stehen VOR allen allow-Regeln und koennen nicht ueberstimmt
    # werden. Bewusst keine Ausnahme: kein Aufrufer im Repo nutzt DELETE, PUT
    # oder PATCH ueber den Proxy (Belege im Bericht / README).
    # ---------------------------------------------------------------------
    # Whitelist statt Einzelverbote: haproxy 3.4 kennt kein METH_PATCH-Aequivalent
    # (haproxy -c: "no such ACL : 'METH_PATCH'"), deshalb ist die Umkehrung
    # richtig — nur GET und POST sind ueberhaupt zulaessig, alles andere
    # (DELETE, PUT, PATCH, HEAD, OPTIONS, CONNECT, TRACE, ...) faellt hier raus,
    # bevor ein Pfad geprueft wird. POST bleibt zusaetzlich am Master-Flag POST
    # (Upstream-Semantik), damit POST=0 weiterhin alle POSTs sperrt.
    acl proxy_post_allowed env(POST) -m bool
    acl proxy_delete_allowed env(ALLOW_CONTAINER_DELETE) -m bool
    http-request deny unless METH_GET || METH_POST || METH_DELETE
    http-request deny if METH_POST !proxy_post_allowed
    http-request deny if METH_DELETE !proxy_delete_allowed

    # Methoden-ACL (Stufe 2): JEDE allow-Regel nennt zusaetzlich ihre Methode.
    # Eine Allow-Regel ohne METH_* waere eine Erlaubnis fuer alle Methoden —
    # genau der alte Defekt. GET-Regeln: METH_GET. POST-Regeln: METH_POST.
    # HEAD/OPTIONS sind damit ebenfalls gesperrt (kein Aufrufer im Repo).

    # --- Lese-Endpunkte: exakt, weil sie von einem Flag mit Unter-Flags geteilt werden ---
    # Health/Meta
    http-request allow if { path,url_dec -m reg -i ^(/v[0-9.]+)?/_ping$ }   METH_GET { env(PING) -m bool }
    http-request allow if { path,url_dec -m reg -i ^(/v[0-9.]+)?/version$ } METH_GET { env(VERSION) -m bool }
    http-request allow if { path,url_dec -m reg -i ^(/v[0-9.]+)?/info$ }    METH_GET { env(INFO) -m bool }

    # Container-Liste, -Inspect, -Logs, -Stats (alle unter CONTAINERS)
    http-request allow if { path,url_dec -m reg -i ^(/v[0-9.]+)?/containers/json$ }                    METH_GET { env(CONTAINERS) -m bool }
    http-request allow if { path,url_dec -m reg -i ^(/v[0-9.]+)?/containers/[A-Za-z0-9_.-]+/json$ }    METH_GET { env(CONTAINERS) -m bool }
    http-request allow if { path,url_dec -m reg -i ^(/v[0-9.]+)?/containers/[A-Za-z0-9_.-]+/logs$ }    METH_GET { env(CONTAINERS) -m bool }
    http-request allow if { path,url_dec -m reg -i ^(/v[0-9.]+)?/containers/[A-Za-z0-9_.-]+/stats$ }   METH_GET { env(CONTAINERS) -m bool }

    # --- Container-Aktionen: je Aktion das eigene Flag, exakt ---
    # `stop` steht wie im Original unter ALLOW_RESTARTS (Upstream-Semantik von
    # tecnativa/docker-socket-proxy: "restart/stop/kill") UND zusaetzlich unter
    # ALLOW_STOP. Wer nur ALLOW_STOP=1 setzt, kann stoppen; wer nur
    # ALLOW_RESTARTS=1 setzt, ebenfalls — wie bisher dokumentiert.
    http-request allow if { path,url_dec -m reg -i ^(/v[0-9.]+)?/containers/[A-Za-z0-9_.-]+/(restart|stop|kill)$ } METH_POST { env(ALLOW_RESTARTS) -m bool }
    http-request allow if { path,url_dec -m reg -i ^(/v[0-9.]+)?/containers/[A-Za-z0-9_.-]+/start$ }   METH_POST { env(ALLOW_START) -m bool }
    http-request allow if { path,url_dec -m reg -i ^(/v[0-9.]+)?/containers/[A-Za-z0-9_.-]+/stop$ }    METH_POST { env(ALLOW_STOP) -m bool }
    http-request allow if { path,url_dec -m reg -i ^(/v[0-9.]+)?/containers/[A-Za-z0-9_.-]+/pause$ }   METH_POST { env(ALLOW_PAUSE) -m bool }
    http-request allow if { path,url_dec -m reg -i ^(/v[0-9.]+)?/containers/[A-Za-z0-9_.-]+/unpause$ } METH_POST { env(ALLOW_UNPAUSE) -m bool }

    # --- Updater (Etappe 2): Container neu aufbauen — je Schritt ein eigenes Flag ---
    # `create` verlangt ?name=…, `rename` verlangt ?name=…: haproxy matcht `path`
    # OHNE Query, die Namenspflicht steht deshalb in der Allowlist des Aufrufers
    # (utils/docker_client.py, DockerAdminClient). Beide Flags Default 0.
    http-request allow if { path,url_dec -m reg -i ^(/v[0-9.]+)?/containers/create$ }                    METH_POST { env(ALLOW_CONTAINER_CREATE) -m bool }
    http-request allow if { path,url_dec -m reg -i ^(/v[0-9.]+)?/containers/[A-Za-z0-9_.-]+/rename$ }    METH_POST { env(ALLOW_CONTAINER_RENAME) -m bool }

    # --- Updater (Etappe 2): Backup-Container entfernen, eigenes Flag ---
    # Einziger DELETE-Pfad ueberhaupt; Stufe 1 laesst DELETE nur durch, wenn
    # ALLOW_CONTAINER_DELETE=1 gesetzt ist (acl proxy_delete_allowed oben).
    # Absichtlich auf den Namenssuffix `_old_backup` verengt: der Updater legt
    # seinen Backup-Container genau so an (hermes_updater.py: backup_name =
    # f"{container_name}_old_backup"). Damit ist DELETE /containers/hermes-agent
    # auch bei gesetztem Flag weiterhin gesperrt — die Aussenkante ist enger als
    # die Allowlist im Aufrufer (utils/docker_client.py).
    http-request allow if { path,url_dec -m reg -i ^(/v[0-9.]+)?/containers/[A-Za-z0-9_.-]+_old_backup$ } METH_DELETE { env(ALLOW_CONTAINER_DELETE) -m bool }

    # --- Exec: Erstellung UND Start hinter demselben Flag (EXEC) ---
    # Vorher war nur die Erstellung durch die /containers-Praefixregel erlaubt und
    # der Start (/exec/<id>/start) durch EXEC=0 gesperrt — eine halbe Sperre:
    # Erstellen allein fuehrt nichts aus, aber die Absicht "kein exec" war nur
    # zufaellig eingehalten. Jetzt haengen beide Enden am selben Flag.
    http-request allow if { path,url_dec -m reg -i ^(/v[0-9.]+)?/containers/[A-Za-z0-9_.-]+/exec$ } METH_POST { env(EXEC) -m bool }
    http-request allow if { path,url_dec -m reg -i ^(/v[0-9.]+)?/exec/[A-Za-z0-9_.-]+/(start|json|resize)$ } METH_POST { env(EXEC) -m bool }
    # Aufraeumpfad einer Exec-Instanz: DELETE /exec/<id> wird von keinem Aufrufer
    # benutzt (Belege im Bericht) und bleibt durch die Stufe-1-Sperre zu.

    # --- Namespaces mit eigenem Flag (Subtree ist hier die Semantik) ---
    http-request allow if { path,url_dec -m reg -i ^(/v[0-9.]+)?/auth(/.*)?$ }         METH_GET { env(AUTH) -m bool }
    http-request allow if { path,url_dec -m reg -i ^(/v[0-9.]+)?/build(/.*)?$ }        METH_GET { env(BUILD) -m bool }
    http-request allow if { path,url_dec -m reg -i ^(/v[0-9.]+)?/commit(/.*)?$ }       METH_GET { env(COMMIT) -m bool }
    http-request allow if { path,url_dec -m reg -i ^(/v[0-9.]+)?/configs(/.*)?$ }      METH_GET { env(CONFIGS) -m bool }
    http-request allow if { path,url_dec -m reg -i ^(/v[0-9.]+)?/distribution(/.*)?$ } METH_GET { env(DISTRIBUTION) -m bool }
    http-request allow if { path,url_dec -m reg -i ^(/v[0-9.]+)?/events$ }             METH_GET { env(EVENTS) -m bool }
    http-request allow if { path,url_dec -m reg -i ^(/v[0-9.]+)?/grpc(/.*)?$ }         METH_GET { env(GRPC) -m bool }
    http-request allow if { path,url_dec -m reg -i ^(/v[0-9.]+)?/images(/.*)?$ }       METH_GET { env(IMAGES) -m bool }

    # --- Updater (Etappe 2): Image-Pull und -Tag als POST, je eigenes Flag ---
    # Die GET-Zeile fuer /images direkt darueber bleibt unveraendert (IMAGES deckt
    # weiterhin nur Lesen ab). Diese zwei Regeln sind der einzige POST-Zugang
    # unter /images; Default 0, also ohne Env-Schalter weiterhin 403.
    http-request allow if { path,url_dec -m reg -i ^(/v[0-9.]+)?/images/create$ }                      METH_POST { env(ALLOW_IMAGE_PULL) -m bool }
    http-request allow if { path,url_dec -m reg -i ^(/v[0-9.]+)?/images/[A-Za-z0-9][A-Za-z0-9_.:/-]*/tag$ } METH_POST { env(ALLOW_IMAGE_TAG) -m bool }
    http-request allow if { path,url_dec -m reg -i ^(/v[0-9.]+)?/networks(/.*)?$ }     METH_GET { env(NETWORKS) -m bool }
    http-request allow if { path,url_dec -m reg -i ^(/v[0-9.]+)?/nodes(/.*)?$ }        METH_GET { env(NODES) -m bool }
    http-request allow if { path,url_dec -m reg -i ^(/v[0-9.]+)?/plugins(/.*)?$ }      METH_GET { env(PLUGINS) -m bool }
    http-request allow if { path,url_dec -m reg -i ^(/v[0-9.]+)?/secrets(/.*)?$ }      METH_GET { env(SECRETS) -m bool }
    http-request allow if { path,url_dec -m reg -i ^(/v[0-9.]+)?/services(/.*)?$ }     METH_GET { env(SERVICES) -m bool }
    http-request allow if { path,url_dec -m reg -i ^(/v[0-9.]+)?/session(/.*)?$ }      METH_GET { env(SESSION) -m bool }
    http-request allow if { path,url_dec -m reg -i ^(/v[0-9.]+)?/swarm(/.*)?$ }        METH_GET { env(SWARM) -m bool }
    http-request allow if { path,url_dec -m reg -i ^(/v[0-9.]+)?/system(/.*)?$ }       METH_GET { env(SYSTEM) -m bool }
    http-request allow if { path,url_dec -m reg -i ^(/v[0-9.]+)?/tasks(/.*)?$ }        METH_GET { env(TASKS) -m bool }
    http-request allow if { path,url_dec -m reg -i ^(/v[0-9.]+)?/volumes(/.*)?$ }      METH_GET { env(VOLUMES) -m bool }

    # Alles, was keine der Regeln oben trifft: 403 vom Proxy, nicht 404 von Docker.
    http-request deny
    default_backend dockerbackend

    use_backend docker-events if { path,url_dec -m reg -i ^(/v[0-9.]+)?/events$ }
