services:
  archon:
    image: archon-os-dev:latest
    container_name: ARCHON-OS
    user: "1000:1000"
    group_add:
      - "973"
    working_dir: /app
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8501", "--reload"]
    env_file:
      - .env.archon
    environment:
      HOME: /tmp
      ENVIRONMENT: development
      # Etappe 3: der Updater laeuft ueber den Proxy statt ueber den rohen Socket.
      # DOCKER_ADMIN_HOST gilt nur fuer DockerAdminClient (utils/docker_client.py);
      # DOCKER_HOST bleibt bewusst ungesetzt, damit main.py, archon/routers/* und
      # ephemeral_sandbox ihren Transport behalten.
      HERMES_UPDATER_DOCKER_CLIENT: "1"
      DOCKER_ADMIN_HOST: "tcp://docker-socket-proxy:2375"
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - /mnt/raid/AgenticOS-2026:/app
      - /mnt/raid/AgenticOS-2026/agent_workspace:/app/agent_workspace
      - /mnt/raid/AgenticOS-2026/data:/app/data
      - /home/micha/.hermes:/opt/data
      - /mnt/raid/Mein Obsidian:/opt/data/obsidian
      # BLEIBT (Blocker-Befund Etappe 3, Schritt 6): main.py, archon/routers/* und
      # ephemeral_sandbox nutzen den gemeinsamen DockerClient ohne DOCKER_HOST und
      # fallen damit auf diesen Socket zurueck. Zeile erst entfernen, wenn diese
      # Aufrufer auf den Proxy umgestellt sind.
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    networks:
      - agents_net

  # Docker-API-Proxy: einziger durch die Anwendung genutzter Weg zum Daemon.
  # Ist-Stand 1:1 übernommen (netzwerk-, mount- und env-gleich), bewusst nur
  # eine Abweichung: EXEC=1 (Paperclip braucht exec, siehe
  # backend/post_task_pipeline.py:522/526). Die Regeln kommen NICHT mehr aus
  # der Env-Generierung (Pfad-Praefix-Match, siehe deploy/docker-socket-proxy/
  # README.md), sondern aus der geprueften, read-only gemounteten Soll-Cfg.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: docker-socket-proxy
    restart: unless-stopped
    # Entrypoint rendert weiterhin /tmp/haproxy.cfg aus dem Image-Template
    # (unbenutzt, kollidiert nicht mit unserem Pfad) und ruft dann
    # `haproxy -W -db <command>` auf. Deshalb zeigt -f auf unsere Datei unter
    # /usr/local/etc/haproxy/ (eigener Name, nicht haproxy.cfg.template),
    # damit der Nachbarordner /usr/local/etc/haproxy/errors/ fuer die
    # errorfile-Direktiven erhalten bleibt.
    command: ["haproxy", "-f", "/usr/local/etc/haproxy/socket-proxy.cfg"]
    environment:
      # Updater (Etappe 2): nur die Fuenf Schritte des Image-/Container-Austauschs
      # freigegeben, jeder hinter seinem eigenen Flag. Start/Stop werden gebraucht,
      # Restart/Kill/Pause bleiben zu (ALLOW_RESTARTS=0). Default im Cfg-File: 0.
      ALLOW_CONTAINER_CREATE: "1"
      ALLOW_CONTAINER_DELETE: "1"
      ALLOW_CONTAINER_RENAME: "1"
      ALLOW_IMAGE_PULL: "1"
      ALLOW_IMAGE_TAG: "1"
      ALLOW_RESTARTS: "0"
      ALLOW_START: "1"
      ALLOW_STOP: "1"
      AUTH: "0"
      BUILD: "0"
      COMMIT: "0"
      CONFIGS: "0"
      CONTAINERS: "1"
      DELETE: "0"
      DISABLE_IPV6: "0"
      DISTRIBUTION: "0"
      EVENTS: "1"
      EXEC: "1"
      GRPC: "0"
      IMAGES: "1"
      INFO: "1"
      LOG_LEVEL: "info"
      NETWORKS: "1"
      NODES: "0"
      PING: "1"
      PLUGINS: "0"
      POST: "1"
      SECRETS: "0"
      SERVICES: "1"
      SESSION: "0"
      SWARM: "0"
      SYSTEM: "0"
      TASKS: "1"
      VERSION: "1"
      VOLUMES: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./deploy/docker-socket-proxy/haproxy.cfg:/usr/local/etc/haproxy/socket-proxy.cfg:ro
    networks:
      - agents_net

networks:
  agents_net:
    external: true
    name: archon-os-dev_agents_net
