name: PAPERCLIP

services:
  paperclip:
    build:
      context: ./paperclip
      dockerfile: Dockerfile
    image: paperclip-orchestrator:latest
    container_name: paperclip-orchestrator
    restart: unless-stopped
    ports:
      - "3180:3100"
    environment:
      HOST: "0.0.0.0"
      PORT: "3100"
      PAPERCLIP_HOME: "/paperclip"
      PAPERCLIP_BIND: "all-interfaces"
      PAPERCLIP_DEPLOYMENT_MODE: "authenticated"
      PAPERCLIP_DEPLOYMENT_EXPOSURE: "private"
      PAPERCLIP_PUBLIC_URL: "http://localhost:3180"
      BETTER_AUTH_URL: "http://localhost:3180"
      BETTER_AUTH_TRUSTED_ORIGINS: "http://localhost:8501,http://localhost:3180,http://127.0.0.1:8501,http://127.0.0.1:3180,http://localhost:3100,http://127.0.0.1:3100"
      PAPERCLIP_ALLOWED_HOSTNAMES: "localhost,127.0.0.1"
      BETTER_AUTH_SECRET: "archon-os-paperclip-secure-secret-key-2026-auth"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
    user: "1000:1000"
    entrypoint: ["node", "--import", "./server/node_modules/tsx/dist/loader.mjs", "server/dist/index.js"]
    volumes:
      - paperclip_volume:/paperclip

volumes:
  paperclip_volume:
