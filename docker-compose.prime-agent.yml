# Prime Agent - Docker Compose Override
# ======================================
# Bindet Prime Agent (Self-improving RLM Agent) in den AGENTIC-OS-SYSTEM Stack ein.
#
# Nutzung (Vollstack):
#   docker compose -f docker-compose.yml -f docker-compose.prime-agent.yml up -d prime-agent
#
# Nutzung (nur Prime Agent, eigenes Compose-Projekt):
#   docker compose -f docker-compose.prime-agent.yml up -d prime-agent
#
# Interaktive TUI im laufenden Container:
#   docker exec -it prime-agent prime-agent
#
# Non-interaktiv (One-shot):
#   docker exec prime-agent prime-agent -p "Fasse dieses Repo zusammen" --cwd /workspace

name: AGENTIC-OS-SYSTEM

services:
  # ------------------------------------------------------------
  # Prime Agent - Self-Improving RLM Agent
  # Build: docker build -f prime-agent/Dockerfile -t prime-agent:latest .
  # ------------------------------------------------------------
  prime-agent:
    build:
      context: .
      dockerfile: prime-agent/Dockerfile
    image: prime-agent:latest
    container_name: prime-agent
    restart: unless-stopped
    ports:
      - "7681:7681"
    working_dir: /workspace
    volumes:
      # Arbeitsverzeichnis: hier arbeitet der Agent (Dateien lesen/ändern)
      - ./:/workspace
      # Persistenz: Sessions, Skills, Memory ueberleben Container-Neustarts
      - prime-agent-data:/root/.local/share/prime-agent
      - prime-agent-sessions:/root/.local/share/prime-agent-node
    environment:
      # Model-Provider ueber OmniRoute (dein Router) statt Cloud-Key direkt
      # - PRIME_AGENT_BASE_URL=http://omniroute:20128/v1
      # - PRIME_AGENT_API_KEY=<dein-key>
      - PYTHONUNBUFFERED=1
    # TTY + stdin offen fuer die interaktive TUI
    stdin_open: true
    tty: true

volumes:
  prime-agent-data:
  prime-agent-sessions:
