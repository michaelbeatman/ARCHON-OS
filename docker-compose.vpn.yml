services:
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:latest
    container_name: wg-easy
    restart: unless-stopped
    networks:
      - agentic_mesh
    ports:
      - "51820:51820/udp"
      - "51821:51821/tcp"
    environment:
      - WG_HOST=77.22.185.93
      - PASSWORD_HASH=$$2a$$12$$l6MbqYLFYPxiqpb8ewnvP.NKBK8ymQ7OA4aUEJw9l4gw71qjSTskm
      - WG_DEFAULT_DNS=1.1.1.1,1.0.0.1
      - WG_ALLOWED_IPS=0.0.0.0/0, ::/0
      - WG_PORT=51820
      - PORT=51821
      - WG_DEFAULT_ADDRESS=10.8.0.x
      - WG_DEVICE=eth0
      - LANG=de
      - UI_TRAFFIC_STATS=true
      - WG_POST_UP=iptables -t nat -A POSTROUTING -s 10.8.0.0/24 -o eth0 -j MASQUERADE; iptables -A INPUT -p udp -m udp --dport 51820 -j ACCEPT; iptables -A FORWARD -i wg0 -j ACCEPT; iptables -A FORWARD -o wg0 -j ACCEPT; iptables -t nat -A PREROUTING -d 10.8.0.1 -p tcp --dport 8501 -j DNAT --to-destination 192.168.0.230:8501; iptables -t nat -A PREROUTING -d 10.8.0.1 -p tcp --dport 8420 -j DNAT --to-destination 192.168.0.230:8420;
      - WG_POST_DOWN=iptables -t nat -D POSTROUTING -s 10.8.0.0/24 -o eth0 -j MASQUERADE; iptables -D INPUT -p udp -m udp --dport 51820 -j ACCEPT; iptables -D FORWARD -i wg0 -j ACCEPT; iptables -D FORWARD -o wg0 -j ACCEPT; iptables -t nat -D PREROUTING -d 10.8.0.1 -p tcp --dport 8501 -j DNAT --to-destination 192.168.0.230:8501; iptables -t nat -D PREROUTING -d 10.8.0.1 -p tcp --dport 8420 -j DNAT --to-destination 192.168.0.230:8420;
    volumes:
      - ./data/wireguard:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1

networks:
  agentic_mesh:
    name: archon-os-dev_agents_net
    external: true
