name: archon-os

networks:
  agentic_mesh:
    driver: bridge
  archon-admin_net:
    internal: true

services:
  archon-os:
    build:
      context: .
      dockerfile: Dockerfile
    image: agent-os-container:v0.5.2.1
    container_name: ${ARCHON_CONTAINER_NAME:-ARCHON-OS}
    restart: unless-stopped
    user: "${ARCHON_UID:-1000}:${ARCHON_GID:-1000}"
    networks:
      - agentic_mesh
      # Dedicated admin network for Zero-Trust Docker Socket Proxy
      - archon-admin_net
    depends_on:
      - docker-socket-proxy
      - omniroute
    ports:
      - "${ARCHON_BIND_IP:-127.0.0.1}:${ARCHON_HOST_PORT:-8501}:8501"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ARCHON_LANGUAGE=${ARCHON_LANGUAGE:-en}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OMNIROUTE_URL=${OMNIROUTE_CONTAINER_URL:-http://omniroute:20128/v1}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - PRIVACY_ZERO_EGRESS=${PRIVACY_ZERO_EGRESS:-false}
      # Zero-Trust Docker access strictly via allowlisted socket proxy (no raw docker.sock mount)
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
    volumes:
      - ./:/app
      - ./data/inbox:/opt/data/inbox
      - ./agent_workspace/builds:/projects/builds
      - ${ARCHON_HERMES_DIR:-./.hermes}:/opt/data
      - ${ARCHON_OBSIDIAN_DIR:-./obsidian_vault}:/opt/data/obsidian
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 2g
    memswap_limit: 2g
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
      - /var/cache:rw,size=64m
      - /home/streamlituser/.cache:rw,size=64m
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    deploy:
      resources:
        limits:
          memory: 2048M
          cpus: "2.0"
          pids: 200

  # -------------------------------------------------------------
  # OMNIROUTE MULTI-PROVIDER AI ROUTER (Port 20128)
  # -------------------------------------------------------------
  omniroute:
    image: ${OMNIROUTE_IMAGE:-diegosouzapw/omniroute:3.8.50}
    container_name: ${OMNIROUTE_CONTAINER_NAME:-omniroute}
    restart: unless-stopped
    networks:
      - agentic_mesh
    ports:
      - "${ARCHON_BIND_IP:-127.0.0.1}:${OMNIROUTE_HOST_PORT:-20128}:20128"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PORT=20128
      - HOSTNAME=0.0.0.0
      - DATA_DIR=/app/data
      - OMNIROUTE_MEMORY_MB=1024
      - NODE_OPTIONS=--max-old-space-size=1024
      - INITIAL_PASSWORD=${OMNIROUTE_INITIAL_PASSWORD:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - omniroute_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:20128/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: "1.0"

  # -------------------------------------------------------------
  # n8n WORKFLOW MESH (Optional Full Profile, Localhost-Bound)
  # -------------------------------------------------------------
  n8n:
    image: ${N8N_IMAGE:-n8nio/n8n:2.36.8}
    container_name: ${N8N_CONTAINER_NAME:-n8n}
    restart: unless-stopped
    profiles: ["automation", "full", "all"]
    networks:
      - agentic_mesh
    ports:
      - "${ARCHON_BIND_IP:-127.0.0.1}:${N8N_HOST_PORT:-5678}:5678"
    environment:
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_HOST=localhost
      - N8N_EDITOR_BASE_URL=http://localhost:5678/
      - WEBHOOK_URL=http://localhost:5678/
      - N8N_PREVIEW_MODE=true
      - N8N_XFRAME_BYPASS=true
      - N8N_SECURE_COOKIE=false
      - N8N_SAMESITE_COOKIE=lax
      - N8N_USER_MANAGEMENT_JWT_SECRET=${N8N_USER_MANAGEMENT_JWT_SECRET:-}
      - N8N_USER_MANAGEMENT_JWT_DURATION_HOURS=168
      - N8N_USER_MANAGEMENT_JWT_REFRESH_TIMEOUT_HOURS=144
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=false
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_HIRING_BANNER_ENABLED=false
      - N8N_UNVERIFIED_PACKAGES_ENABLED=true
      - N8N_RUNNERS_TASK_TIMEOUT=300
      - GENERIC_TIMEZONE=${TZ:-UTC}
      - TZ=${TZ:-UTC}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./scripts/patches/n8n_auth_service.js:/usr/local/lib/node_modules/n8n/dist/auth/auth.service.js:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: "1.5"

  # -------------------------------------------------------------
  # DOCKER SOCKET PROXY (Zero-Trust Read/Lifecycle ACL)
  # -------------------------------------------------------------
  docker-socket-proxy:
    image: ${SOCKET_PROXY_IMAGE:-tecnativa/docker-socket-proxy:v0.5.0}
    container_name: ${SOCKET_PROXY_CONTAINER_NAME:-docker-socket-proxy}
    restart: unless-stopped
    networks:
      - archon-admin_net
    environment:
      - CONTAINERS=1
      - IMAGES=0
      - INFO=1
      - PING=1
      - VERSION=1
      - NETWORKS=0
      - SERVICES=0
      - TASKS=0
      - VOLUMES=0
      - POST=1
      - DELETE=0
      - EXEC=${ARCHON_PROXY_ALLOW_EXEC:-0}
      - ALLOW_START=1
      - ALLOW_STOP=1
      - ALLOW_RESTARTS=0
      - ALLOW_CONTAINER_CREATE=${ARCHON_PROXY_ALLOW_UPDATER:-0}
      - ALLOW_CONTAINER_DELETE=${ARCHON_PROXY_ALLOW_UPDATER:-0}
      - ALLOW_CONTAINER_RENAME=${ARCHON_PROXY_ALLOW_UPDATER:-0}
      - ALLOW_IMAGE_PULL=${ARCHON_PROXY_ALLOW_UPDATER:-0}
      - ALLOW_IMAGE_TAG=${ARCHON_PROXY_ALLOW_UPDATER:-0}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:2375/version >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # -------------------------------------------------------------
  # HERMES AGENT ORCHESTRATOR (Pinned v0.23.1 Multi-Arch)
  # -------------------------------------------------------------
  hermes:
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent:v0.23.1}
    container_name: ${HERMES_CONTAINER_NAME:-hermes}
    restart: unless-stopped
    networks:
      agentic_mesh:
        aliases:
          - hermes-agent
      archon-admin_net:
        aliases:
          - hermes-admin
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      - docker-socket-proxy
      - omniroute
    ports:
      - "127.0.0.1:${HERMES_HOST_PORT:-8644}:8642"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${ARCHON_HERMES_DIR:-./.hermes}:/opt/data
      - ${ARCHON_OBSIDIAN_DIR:-./obsidian_vault}:/opt/data/obsidian
      - ./agent_workspace:/projects
      - ./scripts/patches/hermes_telegram_adapter.py:/opt/hermes/plugins/platforms/telegram/adapter.py:ro
    environment:
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
      - API_SERVER_HOST=0.0.0.0
      - HERMES_HOME=/opt/data
      - OMNIROUTE_URL=${OMNIROUTE_CONTAINER_URL:-http://omniroute:20128/v1}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - HERMES_DASHBOARD_SESSION_TOKEN=${HERMES_DASHBOARD_SESSION_TOKEN:-}
    command: ["gateway", "run"]
    healthcheck:
      test: ["CMD", "/opt/hermes/.venv/bin/hermes", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 3072M
          cpus: "2.5"

  # -------------------------------------------------------------
  # HERMES DASHBOARD (Metrics & Trace on Port 9119)
  # -------------------------------------------------------------
  hermes-dashboard:
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent:v0.23.1}
    container_name: ${HERMES_DASHBOARD_CONTAINER_NAME:-hermes-dashboard}
    restart: unless-stopped
    profiles: ["dashboard", "observability", "all"]
    networks:
      - agentic_mesh
    depends_on:
      - hermes
    volumes:
      - ${ARCHON_HERMES_DIR:-./.hermes}:/opt/data
      - ${ARCHON_OBSIDIAN_DIR:-./obsidian_vault}:/opt/data/obsidian
      - ./agent_workspace:/projects
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - HERMES_DASHBOARD_SESSION_TOKEN=${HERMES_DASHBOARD_SESSION_TOKEN:-}
    ports:
      - "127.0.0.1:9119:9119"
    command: ["dashboard", "--host", "127.0.0.1", "--port", "9120", "--no-open"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9120/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: "1.0"

  hermes-dashboard-proxy:
    image: alpine/socat:1.8.0.1
    container_name: ${HERMES_PROXY_CONTAINER_NAME:-hermes-dashboard-proxy}
    restart: unless-stopped
    profiles: ["dashboard", "observability", "all"]
    network_mode: "service:hermes-dashboard"
    depends_on:
      - hermes-dashboard
    entrypoint: ["socat"]
    command: ["tcp-listen:9119,fork,reuseaddr", "tcp-connect:127.0.0.1:9120"]
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.2"

  anything-llm:
    image: mintplexlabs/anythingllm:1.7.4
    container_name: ${ANYTHINGLLM_CONTAINER_NAME:-anything-llm}
    restart: unless-stopped
    networks:
      - agentic_mesh
    ports:
      - "${ARCHON_BIND_IP:-127.0.0.1}:${ANYTHINGLLM_HOST_PORT:-3001}:3001"
    environment:
      - STORAGE_DIR=/app/server/storage
      - SERVER_PORT=3001
      - DISABLE_TELEMETRY=true
      - EMBEDDING_ENGINE=${ANYTHINGLLM_EMBEDDING_ENGINE:-native}
      - EMBEDDING_BASE_PATH=${ANYTHINGLLM_EMBEDDING_BASE_PATH:-}
      - EMBEDDING_MODEL_PREF=${ANYTHINGLLM_EMBEDDING_MODEL:-}
      - GENERIC_OPEN_AI_EMBEDDING_API_KEY=${ANYTHINGLLM_EMBEDDING_API_KEY:-}
      - EMBEDDING_MODEL_MAX_CHUNK_LENGTH=8192
      - VECTOR_DB=${ANYTHINGLLM_VECTOR_DB:-chroma}
      - CHROMA_ENDPOINT=${CHROMA_ENDPOINT:-http://chroma:8000}
    volumes:
      - anythingllm_storage:/app/server/storage
      - ${ARCHON_OBSIDIAN_DIR:-./obsidian_vault}:/app/server/storage/obsidian_vault:ro
    deploy:
      resources:
        limits:
          memory: 2048M
          cpus: "2.0"

  ollama-embed:
    image: ollama/ollama:0.5.7
    container_name: ${OLLAMA_EMBED_CONTAINER_NAME:-ollama-embed}
    restart: unless-stopped
    profiles: ["rag", "full", "all"]
    networks:
      - agentic_mesh
    volumes:
      - ollama_embed_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_NUM_PARALLEL=2
    deploy:
      resources:
        limits:
          memory: 4096M
          cpus: "3.0"

  chroma:
    image: chromadb/chroma:0.6.3
    container_name: ${CHROMA_CONTAINER_NAME:-chroma}
    restart: unless-stopped
    networks:
      - agentic_mesh
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    deploy:
      resources:
        limits:
          memory: 2048M
          cpus: "2.0"

  litestream:
    image: litestream/litestream:0.3.13
    container_name: litestream
    restart: unless-stopped
    profiles: ["backup", "replication", "all"]
    networks:
      - agentic_mesh
    volumes:
      - ./config/litestream.yml:/etc/litestream.yml:ro
      - ${ARCHON_HERMES_DIR:-./.hermes}:/opt/data
      - ./:/app
      - ./data/litestream_replicas:/opt/litestream_replicas
    command: ["replicate", "--config", "/etc/litestream.yml"]
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  langfuse:
    image: langfuse/langfuse:2
    container_name: langfuse
    restart: unless-stopped
    profiles: ["tracing", "observability", "all"]
    networks:
      - agentic_mesh
    ports:
      - "${ARCHON_BIND_IP:-127.0.0.1}:3000:3000"
    environment:
      - DATABASE_URL=${LANGFUSE_DATABASE_URL:-}
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-}
      - SALT=${LANGFUSE_SALT:-}
      - TELEMETRY_ENABLED=false
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: "1.5"

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    restart: unless-stopped
    profiles: ["monitoring", "observability", "all"]
    networks:
      - agentic_mesh
    ports:
      - "${ARCHON_BIND_IP:-127.0.0.1}:9090:9090"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  grafana:
    image: grafana/grafana:11.1.0
    container_name: grafana
    restart: unless-stopped
    profiles: ["monitoring", "observability", "all"]
    networks:
      - agentic_mesh
    # Host port 3003 avoids collision with anything-llm on port 3001
    ports:
      - "${ARCHON_BIND_IP:-127.0.0.1}:3003:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./config/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-}
      - GF_USERS_ALLOW_SIGN_UP=false
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: unless-stopped
    profiles: ["monitoring", "observability", "all"]
    networks:
      - agentic_mesh
    ports:
      - "${ARCHON_BIND_IP:-127.0.0.1}:3002:3001"
    volumes:
      - uptime_kuma_data:/app/data
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  caddy:
    image: caddy:2.8.4-alpine
    container_name: caddy-gateway
    restart: unless-stopped
    profiles: ["gateway", "proxy", "all"]
    networks:
      - agentic_mesh
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  authelia:
    image: authelia/authelia:4.38
    container_name: authelia-sso
    restart: unless-stopped
    profiles: ["gateway", "proxy", "all"]
    networks:
      - agentic_mesh
    ports:
      - "${ARCHON_BIND_IP:-127.0.0.1}:9091:9091"
    volumes:
      - ./config/authelia:/config
    environment:
      - AUTHELIA_JWT_SECRET=${AUTHELIA_JWT_SECRET:-}
      - AUTHELIA_SESSION_SECRET=${AUTHELIA_SESSION_SECRET:-}
      - AUTHELIA_STORAGE_KEY=${AUTHELIA_STORAGE_KEY:-}
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  loki:
    image: grafana/loki:3.1.0
    container_name: loki
    restart: unless-stopped
    profiles: ["logging", "observability", "all"]
    networks:
      - agentic_mesh
    ports:
      - "${ARCHON_BIND_IP:-127.0.0.1}:3100:3100"
    volumes:
      - ./config/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  promtail:
    image: grafana/promtail:3.1.0
    container_name: promtail
    restart: unless-stopped
    profiles: ["logging", "observability", "all"]
    networks:
      - agentic_mesh
    volumes:
      - ./config/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${DATA_DIR:-./data}/logs:/opt/data/logs:ro
    command: -config.file=/etc/promtail/config.yml
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.3"

  metabase:
    image: metabase/metabase:v0.50.23
    container_name: metabase-bi
    restart: unless-stopped
    profiles: ["bi", "analytics", "all"]
    networks:
      - agentic_mesh
    ports:
      - "${ARCHON_BIND_IP:-127.0.0.1}:3030:3000"
    volumes:
      - metabase_data:/metabase-data
      - ${DATA_DIR:-./data}:/opt/data:ro
    environment:
      - MB_DB_FILE=/metabase-data/metabase.db
      - MB_ANON_TRACKING_ENABLED=false
      - MB_SITE_NAME=Archon OS Business Intelligence
      - JAVA_OPTS=-Xmx512m
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: "1.0"

  docuseal:
    image: docuseal/docuseal:1.8.4
    container_name: docuseal-esign
    restart: unless-stopped
    profiles: ["esign", "legal", "all"]
    networks:
      - agentic_mesh
    ports:
      - "${ARCHON_BIND_IP:-127.0.0.1}:3080:3000"
    volumes:
      - docuseal_data:/data
    environment:
      - DOCUSEAL_DATABASE_URL=sqlite3:/data/docuseal.sqlite3
      - PORT=3000
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

volumes:
  omniroute_data:
  n8n_data:
  paperclip_volume:
  anythingllm_storage:
  ollama_embed_data:
  chroma_data:
  prometheus_data:
  grafana_data:
  uptime_kuma_data:
  caddy_data:
  caddy_config:
  loki_data:
  metabase_data:
  docuseal_data:
