name: ARCHON-OS

networks:
  agentic_mesh:
    name: archon-os-dev_agents_net
    external: true

services:
  archon-os:
    build:
      context: .
      dockerfile: Dockerfile
    image: agent-os-container:latest
    container_name: ARCHON-OS
    restart: unless-stopped
    user: root
    networks:
      - agentic_mesh
    ports:
      - "8501:8501"
    environment:
      # Telegram-Push (nur sendMessage — Polling macht ausschließlich der
      # telegram_bot-Gateway im hermes-Container; paralleles Senden ist Telegram-konform)
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      # Docker-Zugriff ueber den Socket-Proxy (Allowlist) statt roher Socket.
      # utils/docker_client.py faellt automatisch auf /var/run/docker.sock
      # zurueck, falls der Proxy nicht erreichbar ist.
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
    volumes:
      - //var/run/docker.sock:/var/run/docker.sock  # Legacy-Fallback; bevorzugt DOCKER_HOST
      - ./:/app
      - ./data/inbox:/opt/data/inbox
      - ./agent_workspace/builds:/projects/builds
      - ${USERPROFILE}/.hermes:/opt/data
      - C:\Mein Obsidian:/opt/data/obsidian
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 2048M
          cpus: "2.0"

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    networks:
      - agentic_mesh
    ports:
      - "5678:5678"
    environment:
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_HOST=localhost
      - N8N_EDITOR_BASE_URL=http://localhost:5678/
      - WEBHOOK_URL=http://localhost:5678/
      - N8N_PREVIEW_MODE=true
      - N8N_XFRAME_BYPASS=true
      - N8N_SECURE_COOKIE=false
      - N8N_SAMESITE_COOKIE=lax
      - N8N_USER_MANAGEMENT_JWT_SECRET=***REMOVED_N8N_JWT_SECRET***
      - N8N_USER_MANAGEMENT_JWT_DURATION_HOURS=8760
      - N8N_USER_MANAGEMENT_JWT_REFRESH_TIMEOUT_HOURS=8000
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=false
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_HIRING_BANNER_ENABLED=false
      - N8N_UNVERIFIED_PACKAGES_ENABLED=true
      - N8N_RUNNERS_TASK_TIMEOUT=300
      - GENERIC_TIMEZONE=Europe/Berlin
      - TZ=Europe/Berlin
    volumes:
      - n8n_data:/home/node/.n8n
      - ./scripts/patches/n8n_auth_service.js:/usr/local/lib/node_modules/n8n/dist/auth/auth.service.js:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: "1.5"

  # -------------------------------------------------------------
  # DOCKER SOCKET PROXY (Safe API Access for Agents / Paperclip)
  # -------------------------------------------------------------
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: docker-socket-proxy
    restart: unless-stopped
    networks:
      - agentic_mesh
    environment:
      - CONTAINERS=1
      - IMAGES=1
      - INFO=1
      - NETWORKS=1
      - SERVICES=1
      - TASKS=1
      - VOLUMES=1
      - POST=1
      - DELETE=0
      # EXEC=1 noetig fuer /containers/{id}/exec + /exec/{id}/start
      # (Log-/Datei-/Skill-Ansicht im Panel). Angriffsoberflaeche bleibt
      # auf die im Proxy aktivierten Endpunkte begrenzt.
      - EXEC=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:2375/version >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # -------------------------------------------------------------
  # HERMES AGENT ORCHESTRATOR (Core Gateway on Port 8644)
  # -------------------------------------------------------------
  hermes:
    image: hermes-agent-plus:latest
    container_name: hermes
    restart: unless-stopped
    networks:
      agentic_mesh:
        aliases:
          - hermes-agent
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      - docker-socket-proxy
    ports:
      - "127.0.0.1:8644:8642"
    volumes:
      - ${USERPROFILE}/.hermes:/opt/data
      - C:\Mein Obsidian:/opt/data/obsidian
      - ./agent_workspace:/projects
      - ./scripts/patches/hermes_telegram_adapter.py:/opt/hermes/plugins/platforms/telegram/adapter.py
    environment:
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
      - API_SERVER_HOST=0.0.0.0
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - HERMES_DASHBOARD_SESSION_TOKEN=${HERMES_DASHBOARD_SESSION_TOKEN:-***REMOVED_HERMES_DASHBOARD_SESSION_TOKEN***}
    command: ["gateway", "run"]
    healthcheck:
      test: ["CMD", "/opt/hermes/.venv/bin/hermes", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 3072M
          cpus: "2.5"

  # -------------------------------------------------------------
  # HERMES DASHBOARD (Metrics & Trace on Port 9119)
  # -------------------------------------------------------------
  hermes-dashboard:
    image: hermes-agent-plus:latest
    container_name: hermes-dashboard
    restart: unless-stopped
    networks:
      - agentic_mesh
    depends_on:
      - hermes
    volumes:
      - ${USERPROFILE}/.hermes:/opt/data
      - C:\Mein Obsidian:/opt/data/obsidian
      - ./agent_workspace:/projects
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - HERMES_DASHBOARD_SESSION_TOKEN=${HERMES_DASHBOARD_SESSION_TOKEN:-***REMOVED_HERMES_DASHBOARD_SESSION_TOKEN***}
    ports:
      - "127.0.0.1:9119:9119"
    command: ["dashboard", "--host", "127.0.0.1", "--port", "9120", "--no-open"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9120/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: "1.0"

  hermes-dashboard-proxy:
    image: alpine/socat:latest
    container_name: hermes-dashboard-proxy
    restart: unless-stopped
    network_mode: "service:hermes-dashboard"
    depends_on:
      - hermes-dashboard
    entrypoint: ["socat"]
    command: ["tcp-listen:9119,fork,reuseaddr", "tcp-connect:127.0.0.1:9120"]
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.2"

  anything-llm:
    image: mintplexlabs/anythingllm:latest
    container_name: anything-llm
    restart: unless-stopped
    networks:
      - agentic_mesh
    ports:
      - "0.0.0.0:3001:3001"
    environment:
      - STORAGE_DIR=/app/server/storage
      - SERVER_PORT=3001
      - DISABLE_TELEMETRY=true
      # Embedder: lokaler Ollama-Container (sonst stirbt der eingebaute "native"
      # Embedder auf dieser CPU mit SIGILL und reisst den Node-Prozess mit).
      - EMBEDDING_ENGINE=ollama
      - EMBEDDING_BASE_PATH=http://ollama-embed:11434
      - EMBEDDING_MODEL_PREF=nomic-embed-text
      - EMBEDDING_MODEL_MAX_CHUNK_LENGTH=2048
      # Vektor-Store: Chroma ueber HTTP statt LanceDB. LanceDB zieht ein natives
      # Modul, das AVX2 voraussetzt — die CPU dieses Hosts (i5-3470) hat nur AVX
      # und der Node-Prozess stirbt mit "Illegal instruction".
      - VECTOR_DB=chroma
      - CHROMA_ENDPOINT=http://chroma:8000
    volumes:
      - anythingllm_storage:/app/server/storage
      - /mnt/raid/AgenticOS-2026/agent_workspace/obsidian_vault:/app/server/storage/obsidian_vault:ro
    deploy:
      resources:
        limits:
          memory: 2048M
          cpus: "2.0"

  # Embedding-Backend fuer AnythingLLM. Bewusst als eigener Container: der
  # native Embedder von AnythingLLM stirbt auf dieser CPU (Illegal instruction),
  # und das Ollama auf dem Host lauscht nur auf 127.0.0.1 — aus dem Netz nicht
  # erreichbar. Modell: nomic-embed-text (768 Dimensionen, CPU-tauglich).
  ollama-embed:
    image: ollama/ollama:latest
    container_name: ollama-embed
    restart: unless-stopped
    networks:
      - agentic_mesh
    volumes:
      - ollama_embed_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_NUM_PARALLEL=2
    deploy:
      resources:
        limits:
          memory: 4096M
          cpus: "3.0"

  # Vektor-Store fuer AnythingLLM. Chroma laeuft als eigener Dienst ueber HTTP —
  # bewusst nicht LanceDB: dessen natives Modul setzt AVX2 voraus, diese CPU
  # (i5-3470) hat nur AVX und der Node-Prozess stirbt mit SIGILL.
  chroma:
    image: chromadb/chroma:latest
    container_name: chroma
    restart: unless-stopped
    networks:
      - agentic_mesh
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    deploy:
      resources:
        limits:
          memory: 2048M
          cpus: "2.0"

  litestream:
    image: litestream/litestream:0.3.13
    container_name: litestream
    restart: unless-stopped
    profiles: ["backup", "replication", "all"]
    networks:
      - agentic_mesh
    volumes:
      - ./config/litestream.yml:/etc/litestream.yml:ro
      - ${USERPROFILE}/.hermes:/opt/data
      - ./:/app
      - ./data/litestream_replicas:/opt/litestream_replicas
    command: ["replicate", "--config", "/etc/litestream.yml"]
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  langfuse:
    image: langfuse/langfuse:2
    container_name: langfuse
    restart: unless-stopped
    profiles: ["tracing", "observability", "all"]
    networks:
      - agentic_mesh
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=${LANGFUSE_DATABASE_URL:-}
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-archon-langfuse-secret-key-2026}
      - SALT=${LANGFUSE_SALT:-archon-langfuse-salt-2026}
      - TELEMETRY_ENABLED=false
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: "1.5"

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    restart: unless-stopped
    profiles: ["monitoring", "observability", "all"]
    networks:
      - agentic_mesh
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  grafana:
    image: grafana/grafana:11.1.0
    container_name: grafana
    restart: unless-stopped
    profiles: ["monitoring", "observability", "all"]
    networks:
      - agentic_mesh
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./config/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-archon_admin_2026}
      - GF_USERS_ALLOW_SIGN_UP=false
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: unless-stopped
    profiles: ["monitoring", "observability", "all"]
    networks:
      - agentic_mesh
    ports:
      - "3002:3001"
    volumes:
      - uptime_kuma_data:/app/data
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  caddy:
    image: caddy:2.8.4-alpine
    container_name: caddy-gateway
    restart: unless-stopped
    profiles: ["gateway", "proxy", "all"]
    networks:
      - agentic_mesh
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  authelia:
    image: authelia/authelia:4.38
    container_name: authelia-sso
    restart: unless-stopped
    profiles: ["gateway", "proxy", "all"]
    networks:
      - agentic_mesh
    ports:
      - "9091:9091"
    volumes:
      - ./config/authelia:/config
    environment:
      - AUTHELIA_JWT_SECRET=${AUTHELIA_JWT_SECRET:-archon_jwt_secret_dev_2026}
      - AUTHELIA_SESSION_SECRET=${AUTHELIA_SESSION_SECRET:-archon_session_secret_dev_2026}
      - AUTHELIA_STORAGE_KEY=${AUTHELIA_STORAGE_KEY:-archon_storage_key_dev_2026}
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  loki:
    image: grafana/loki:3.1.0
    container_name: loki
    restart: unless-stopped
    profiles: ["logging", "observability", "all"]
    networks:
      - agentic_mesh
    ports:
      - "3100:3100"
    volumes:
      - ./config/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  promtail:
    image: grafana/promtail:3.1.0
    container_name: promtail
    restart: unless-stopped
    profiles: ["logging", "observability", "all"]
    networks:
      - agentic_mesh
    volumes:
      - ./config/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DATA_DIR:-./data}/logs:/opt/data/logs:ro
    command: -config.file=/etc/promtail/config.yml
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.3"

  metabase:
    image: metabase/metabase:v0.50.23
    container_name: metabase-bi
    restart: unless-stopped
    profiles: ["bi", "analytics", "all"]
    networks:
      - agentic_mesh
    ports:
      - "3030:3000"
    volumes:
      - metabase_data:/metabase-data
      - ${DATA_DIR:-./data}:/opt/data:ro
    environment:
      - MB_DB_FILE=/metabase-data/metabase.db
      - MB_ANON_TRACKING_ENABLED=false
      - MB_SITE_NAME=Archon OS Business Intelligence
      - JAVA_OPTS=-Xmx512m
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: "1.0"

  docuseal:
    image: docuseal/docuseal:latest
    container_name: docuseal-esign
    restart: unless-stopped
    profiles: ["esign", "legal", "all"]
    networks:
      - agentic_mesh
    ports:
      - "3080:3000"
    volumes:
      - docuseal_data:/data
    environment:
      - DOCUSEAL_DATABASE_URL=sqlite3:/data/docuseal.sqlite3
      - PORT=3000
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

volumes:
  n8n_data:
  paperclip_volume:
  anythingllm_storage:
  ollama_embed_data:
  chroma_data:
  prometheus_data:
  grafana_data:
  uptime_kuma_data:
  caddy_data:
  caddy_config:
  loki_data:
  metabase_data:
  docuseal_data:
