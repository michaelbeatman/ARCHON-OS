  anything-llm:
    image: mintplexlabs/anythingllm:latest
    container_name: anything-llm
    restart: unless-stopped
    networks:
      - agentic_mesh
    ports:
      - "0.0.0.0:3001:3001"
    environment:
      - STORAGE_DIR=/app/server/storage
      - SERVER_PORT=3001
      - DISABLE_TELEMETRY=true
    volumes:
      - anythingllm_storage:/app/server/storage
