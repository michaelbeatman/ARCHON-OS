name: archon-os

# D: einheitliche JSON-Log-Rotation fuer alle Dienste. Bestehende explizite
# logging:-Bloecke (z. B. archon-os) bleiben unberuehrt.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

# Audit D10: Beobachter-Profil-Schalter. `ARCHON_OBSERVABILITY=full` wird von
# den Startpfaden (start.bat/install.sh/Ansible) auf die vier Einzelprofile
# monitoring, logging, replication und tracing abgebildet — nicht auf einen
# `--profile full`-Fan-in. Alertmanager startet zusaetzlich nur mit gesetzten
# Telegram-Secrets; ohne Secrets bleibt der Status ehrlich `alerts_not_configured`.
# Das EOL-Langfuse-v2-Artefakt wurde entfernt (Audit D09/D10, D-D8).

networks:
  agentic_mesh:
    driver: bridge
  archon-admin_net:
    internal: true
  archon-worker-zero-egress_net:
    driver: bridge
    # Strict Zero-Egress network for workers: no default internet route, no NAT gateway.
    internal: true
  archon-sandbox_net:
    driver: bridge
    internal: true

services:
  archon-os:
    build:
      context: .
      dockerfile: Dockerfile
    image: agent-os-container:v0.5.7
    container_name: ${ARCHON_CONTAINER_NAME:-ARCHON-OS}
    init: true
    restart: unless-stopped
    user: "${ARCHON_UID:-1000}:${ARCHON_GID:-1000}"
    networks:
      - agentic_mesh
      # Dedicated admin network for Zero-Trust Docker Socket Proxy
      - archon-admin_net
      # Internal Zero-Egress bridge to isolated workers & On-Premise inference
      - archon-worker-zero-egress_net
    # H10 (Audit 23.11.2026): nicht nur "Container gestartet", sondern
    # echte Readiness — sonst nimmt Archon Requests an, während OmniRoute
    # und der Socket-Proxy noch nicht antworten.
    depends_on:
      docker-socket-proxy:
        condition: service_healthy
      # W3: omniroute darf den Start nicht blockieren — die Anwendung hat
      # echte Provider-Fallbacks (OpenRouter/Ollama) und die Laufzeit-
      # Unhealthigkeit wird über /readyz (Dependency-Probes) gemeldet.
      omniroute:
        condition: service_started
    ports:
      - "${ARCHON_BIND_IP:-127.0.0.1}:${ARCHON_HOST_PORT:-8501}:8501"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ARCHON_LANGUAGE=${ARCHON_LANGUAGE:-en}
      # KRITISCH: auth_service._must_force_auth() liest diese Variablen.
      # Ohne Durchreichung glaubt die App im Container trotz 0.0.0.0-Bind
      # sie laufe lokal und bleibt unauthentifiziert offen.
      - ARCHON_BIND_IP=${ARCHON_BIND_IP:-127.0.0.1}
      # Audit D05/D10 (F-01): Produktion ist der Default-Deploy-Modus. Er
      # aktiviert die Audit-Fail-Closed-Pruefungen und den echten /readyz-Gate.
      - ENVIRONMENT=${ENVIRONMENT:-production}
      # Erzwingt die externen Dependency-Probes auch bei bewusst gesetztem
      # ENVIRONMENT=development (isolierte Lokalentwicklung).
      - ARCHON_READINESS_PROBES=${ARCHON_READINESS_PROBES:-1}
      # K2/C01: auf `true` setzen, sobald ARCHON_SERVICE_TOKEN hinterlegt und
      # die n8n-Workflows damit deployt sind. Production erzwingt Auth bereits
      # ueber ENVIRONMENT; dieser Schalter deckt zusaetzlich Mesh-Deployments
      # im Development-Modus ab. Default false = akzeptierter lokaler Dev-Fall.
      - ARCHON_REQUIRE_AUTH=${ARCHON_REQUIRE_AUTH:-false}
      - ARCHON_CONTENT_PUBLISH_WEBHOOK=${ARCHON_CONTENT_PUBLISH_WEBHOOK:-}
      # Watchdog-Killswitch: im Container darf localhost NICHT auf den
      # Archon-Prozess selbst zeigen — echte Service-Namen verwenden.
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://n8n:5678/webhook/archon-watchdog-abort}
      - HERMES_API_BASE=${HERMES_API_BASE:-http://hermes:8642}
      - HERMES_DASHBOARD_BASE=${HERMES_DASHBOARD_BASE:-http://hermes:9119}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - OMNIROUTE_API_KEY=${OMNIROUTE_API_KEY:-}
      - ARCHON_SERVICE_TOKEN=${ARCHON_SERVICE_TOKEN:-}
      - OBSIDIAN_VAULT_PATH=${OBSIDIAN_VAULT_PATH:-/opt/data/obsidian}
      - POCKETBASE_ENABLED=${POCKETBASE_ENABLED:-false}
      - OMNIROUTE_URL=${OMNIROUTE_CONTAINER_URL:-http://omniroute:20128/v1}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - PRIVACY_ZERO_EGRESS=${PRIVACY_ZERO_EGRESS:-false}
      # Zero-Trust Docker access strictly via allowlisted socket proxy (no raw docker.sock mount)
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
      # Audit-Keys: drei getrennte Secrets, NUR aus .env/ENV (nie als Datei
      # oder im Image). H-05-2: Anker default-aktiv auf getrenntem Volume;
      # leer = fail-closed in Produktion (kein stilles Inaktiv-Sein).
      - ARCHON_AUDIT_HMAC_KEY=${ARCHON_AUDIT_HMAC_KEY:-}
      - ARCHON_RECEIPT_HMAC_KEY=${ARCHON_RECEIPT_HMAC_KEY:-}
      - ARCHON_AUDIT_ANCHOR_KEY=${ARCHON_AUDIT_ANCHOR_KEY:-}
      # D04/H-04-2: API-Key-Peppler nicht hartcodiert — Pflicht-Secret in Produktion.
      - ARCHON_API_KEY_PEPPER=${ARCHON_API_KEY_PEPPER:-}
      - ARCHON_AUDIT_HMAC_EPOCHS=${ARCHON_AUDIT_HMAC_EPOCHS:-}
      - ARCHON_AUDIT_HMAC_EPOCH_FROM=${ARCHON_AUDIT_HMAC_EPOCH_FROM:-0}
      - ARCHON_RECEIPT_HMAC_EPOCHS=${ARCHON_RECEIPT_HMAC_EPOCHS:-}
      - ARCHON_RECEIPT_HMAC_EPOCH_FROM=${ARCHON_RECEIPT_HMAC_EPOCH_FROM:-0}
      - ARCHON_AUDIT_ANCHOR_EPOCHS=${ARCHON_AUDIT_ANCHOR_EPOCHS:-}
      - ARCHON_AUDIT_ANCHOR_EPOCH_FROM=${ARCHON_AUDIT_ANCHOR_EPOCH_FROM:-0}
      - ARCHON_AUDIT_STRICT=${ARCHON_AUDIT_STRICT:-1}
      - ARCHON_AUDIT_ANCHOR_PATH=${ARCHON_AUDIT_ANCHOR_PATH:-/app/audit_anchor/audit_anchor.log}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GH_TOKEN=${GH_TOKEN:-}
      # F-075: Langfuse/OTel-Export — nur aus .env, keine Defaults.
      - LANGFUSE_HOST=${LANGFUSE_HOST:-}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      # H-16-2: echter Compose-Default — der App-Export geht an den lokalen
      # Collector im selben Netz. Ohne Wert war der Export faktisch aus.
      # Ueberschreibung nur bewusst ueber .env (z. B. externer Collector).
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      # Audit D16/P1: Dienstname für OTel-Spans (Collector/ downstream)
      - OTEL_SERVICE_NAME=archon-os
      # H-16-2: der Collector exportiert per config an Tempo; der Status
      # meldet die *konfigurierte* Zielkette (keine Liveness-Garantie).
      - ARCHON_OTEL_COLLECTOR_DOWNSTREAM=${ARCHON_OTEL_COLLECTOR_DOWNSTREAM:-tempo}
      # Audit D16 (Agent I): Sampling. Audit-Spans setzen force_sample_audit()
      # im Code und umgehen damit die Ratio. Keine echten Keys/Endpunkte hier.
      - OTEL_TRACES_SAMPLER=${OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
      - OTEL_TRACES_SAMPLER_ARG=${OTEL_TRACES_SAMPLER_ARG:-1.0}
      # Audit D10: OPTIONALE, vom Betreiber in .env zu setzende Dead-Man-URL.
      # Kein erfundenes externes Ziel. Ohne Wert bleibt der Selbstheilungs-
      # Report bewusst `dead_man_switch_configured: false`.
      - ARCHON_HEARTBEAT_WEBHOOK_URL=${ARCHON_HEARTBEAT_WEBHOOK_URL:-}
      # Audit D10 / E2E 24.11.2026: Liveness-Schwellen an den 3-s-Healthcheck-
      # Timeout angleichen (mit 15 s/5000 ms blieb /livez bei 4-s-Haengern 200).
      - ARCHON_LIVEZ_MAX_HEARTBEAT_AGE_S=${ARCHON_LIVEZ_MAX_HEARTBEAT_AGE_S:-8}
      - ARCHON_LIVEZ_MAX_LOOP_LAG_MS=${ARCHON_LIVEZ_MAX_LOOP_LAG_MS:-2000}
      # Audit D10: tote Heartbeat-Variablen entfernt. Der echte Dead-Man-
      # Switch ist die Prometheus-Metrik archon_heartbeat_timestamp_seconds
      # (Regel time() - ... > 300 → critical); der optionale externe Webhook
      # laeuft ueber ARCHON_HEARTBEAT_WEBHOOK_URL (siehe oben).
      # Watchdog-Altersschwelle im Daemon — mit AUTOHEAL_WATCHDOG_MAX_AGE_S
      # im externen Autoheal abzustimmen (Audit D10).
      - ARCHON_WATCHDOG_MAX_LAST_SEEN_AGE_S=${ARCHON_WATCHDOG_MAX_LAST_SEEN_AGE_S:-120}
      # Egress-Guard: der Alertmanager ist ein interner Zielhost und muss
      # explizit freigegeben werden (safe_http_request / check_target_url).
      - ARCHON_PROXY_ALLOWED_TARGETS=${ARCHON_PROXY_ALLOWED_TARGETS:-alertmanager:9093}
    volumes:
      # P0-11: KEIN `./:/app` mehr. Der alte Bind-Mount legte die .env mit dem
      # Audit-HMAC-Key als /app/.env lesbar in den Container. Der Anwendungscode
      # kommt jetzt ausschliesslich aus dem gebauten Image; nur echte
      # Laufzeitdaten werden eingehängt. Die HMAC-Keys gehen weiterhin NUR über
      # `environment:` in den Prozess, nie als Datei.
      # H-05-2: Anker auf PHYSISCH GETRENNTEM Volume (nicht ./data) — ein
      # Prinzipal mit DB-Schreibzugriff soll nicht zugleich den Anker löschen
      # können. Ziel wird mit 0600 angelegt; WORM-Mount empfohlen.
      - ${ARCHON_AUDIT_ANCHOR_DIR:-./audit_anchor}:/app/audit_anchor
      - ./data:/app/data
      - ./agent_workspace:/app/agent_workspace
      - ./obsidian_vault:/app/obsidian_vault
      - ./plugins:/app/plugins
      - ./config:/app/config
      # C14: Die von backend/* genutzte settings.json (/app/settings.json) lag
      # bisher nur im Image und war wegen read_only:true nicht beschreibbar ->
      # Feature-Flags, Schwellen und Auth-Konfiguration konnten zur Laufzeit
      # nicht gespeichert werden. Bind-Mount macht sie persistent; der Schreiber
      # in backend/settings_json.py behandelt den Mount-Point (EBUSY) korrekt.
      - ./settings.json:/app/settings.json:rw
      - ${ARCHON_HERMES_DIR:-./.hermes}:/app/.hermes
      - ./data/inbox:/opt/data/inbox
      - ./agent_workspace/builds:/projects/builds
      - ${ARCHON_HERMES_DIR:-./.hermes}:/opt/data
      - ${ARCHON_OBSIDIAN_DIR:-./obsidian_vault}:/opt/data/obsidian
    healthcheck:
      # Audit D10 + P0-Followup: /livez statt /health — Antigravitys
      # Loop-Liveness meldet bei Event-Loop-Hang 503, Docker restartet dann.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/livez', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 2g
    memswap_limit: 2g
    # W3: Docker-Log-Rotation (sonst wächst das JSON-Log unbegrenzt).
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
      - /var/cache:rw,size=64m
      - /home/streamlituser/.cache:rw,size=64m
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    deploy:
      resources:
        limits:
          memory: 2048M
          cpus: "2.0"
          pids: 512

  # -------------------------------------------------------------
  # OMNIROUTE MULTI-PROVIDER AI ROUTER (Port 20128)
  # -------------------------------------------------------------
  omniroute:
    image: ${OMNIROUTE_IMAGE:-diegosouzapw/omniroute:3.8.50@sha256:085c57adf499a8aaa9f35ccde95c0df9c11bd9ecd18d6c9edbf3b68b8079ba9d}
    container_name: ${OMNIROUTE_CONTAINER_NAME:-omniroute}
    logging:
      <<: *default-logging
    restart: unless-stopped
    networks:
      - agentic_mesh
    ports:
      - "${ARCHON_BIND_IP:-127.0.0.1}:${OMNIROUTE_HOST_PORT:-20128}:20128"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PORT=20128
      - HOSTNAME=0.0.0.0
      - DATA_DIR=/app/data
      - OMNIROUTE_MEMORY_MB=1024
      - NODE_OPTIONS=--max-old-space-size=1024
      - INITIAL_PASSWORD=${OMNIROUTE_INITIAL_PASSWORD:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - omniroute_data:/app/data
    # W3: der alte wget-/'-Probe schlug bei Images ohne wget bzw. bei
    # umgeleiteter Root-Route fehl -> omniroute dauerhaft "unhealthy", obwohl
    # der Router lief. Node ist im Image garantiert vorhanden. Jede HTTP-
    # Antwort < 500 (auch 401 mit Password-Auth) bedeutet: Service lebt.
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:20128/v1/models',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: "1.0"

  # -------------------------------------------------------------
  # n8n WORKFLOW MESH (Optional Full Profile, Localhost-Bound)
  # -------------------------------------------------------------
  n8n:
    image: ${N8N_IMAGE:-n8nio/n8n:2.36.8@sha256:cfe2704ff858395503d42548206c2c99ea351a205e941063a9d9b77b0f404478}
    container_name: ${N8N_CONTAINER_NAME:-n8n}
    logging:
      <<: *default-logging
    restart: unless-stopped
    profiles: ["automation", "full", "all"]
    networks:
      - agentic_mesh
    ports:
      - "${ARCHON_BIND_IP:-127.0.0.1}:${N8N_HOST_PORT:-5678}:5678"
    environment:
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_HOST=localhost
      - N8N_EDITOR_BASE_URL=http://localhost:5678/
      - WEBHOOK_URL=http://localhost:5678/
      - N8N_PREVIEW_MODE=true
      # Supply-Chain/Session-Haertung: X-Frame-Bypass und unpruefbare
      # Community-Pakete waren standardmaessig aktiv.
      - N8N_XFRAME_BYPASS=false
      # Secure-Cookie erfordert TLS (Reverse-Proxy). Für reines Localhost-
      # Development kann in .env N8N_SECURE_COOKIE=false gesetzt werden.
      - N8N_SECURE_COOKIE=${N8N_SECURE_COOKIE:-true}
      - N8N_SAMESITE_COOKIE=lax
      # MUSS in .env auf einen langen Zufallswert gesetzt werden (CI nutzt
      # das leere Template — dort darf der Start nicht abbrechen).
      - N8N_USER_MANAGEMENT_JWT_SECRET=${N8N_USER_MANAGEMENT_JWT_SECRET:-}
      - N8N_USER_MANAGEMENT_JWT_DURATION_HOURS=168
      - N8N_USER_MANAGEMENT_JWT_REFRESH_TIMEOUT_HOURS=144
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_HIRING_BANNER_ENABLED=false
      - N8N_UNVERIFIED_PACKAGES_ENABLED=false
      - N8N_RUNNERS_TASK_TIMEOUT=300
      # H5: derselbe Secret wie beim Sender — n8n-Code-Node prueft die Signatur
      - ARCHON_WEBHOOK_HMAC_SECRET=${ARCHON_WEBHOOK_HMAC_SECRET:-}
      - GENERIC_TIMEZONE=${TZ:-UTC}
      - TZ=${TZ:-UTC}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./scripts/patches/n8n_auth_service.js:/usr/local/lib/node_modules/n8n/dist/auth/auth.service.js:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: "1.5"

  # -------------------------------------------------------------
  # DOCKER SOCKET PROXY (Zero-Trust Read/Lifecycle ACL)
  # -------------------------------------------------------------
  docker-socket-proxy:
    image: ${SOCKET_PROXY_IMAGE:-tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459}
    container_name: ${SOCKET_PROXY_CONTAINER_NAME:-docker-socket-proxy}
    logging:
      <<: *default-logging
    restart: unless-stopped
    networks:
      - archon-admin_net
    environment:
      - CONTAINERS=1
      - IMAGES=0
      - INFO=1
      - PING=1
      - VERSION=1
      - NETWORKS=0
      - SERVICES=0
      - TASKS=0
      - VOLUMES=0
      - POST=1
      - DELETE=0
      - EXEC=${ARCHON_PROXY_ALLOW_EXEC:-0}
      - ALLOW_START=1
      - ALLOW_STOP=1
      - ALLOW_RESTARTS=0
      - ALLOW_CONTAINER_CREATE=${ARCHON_PROXY_ALLOW_UPDATER:-0}
      - ALLOW_CONTAINER_DELETE=${ARCHON_PROXY_ALLOW_UPDATER:-0}
      - ALLOW_CONTAINER_RENAME=${ARCHON_PROXY_ALLOW_UPDATER:-0}
      - ALLOW_IMAGE_PULL=${ARCHON_PROXY_ALLOW_UPDATER:-0}
      - ALLOW_IMAGE_TAG=${ARCHON_PROXY_ALLOW_UPDATER:-0}
      - LOG_LEVEL=${DOCKER_PROXY_LOG_LEVEL:-info}
      - SOCKET_PATH=${DOCKER_SOCKET_PATH:-/var/run/docker.sock}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./deploy/docker-socket-proxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    # F20: Die geprüfte ACL wird nur wirksam, wenn der Entrypoint nicht sein
    # eigenes /tmp/haproxy.cfg-Template startet (siehe docker-compose.dev.yml).
    # Ohne diesen Override greifen POST=1/EXEC=0/DELETE=0 nicht.
    command: ["haproxy", "-f", "/usr/local/etc/haproxy/haproxy.cfg"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:2375/version >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # -------------------------------------------------------------
  # HERMES AGENT ORCHESTRATOR (Pinned v0.23.1 Multi-Arch)
  # -------------------------------------------------------------
  hermes:
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent:v0.23.1@sha256:276d44685c65c0cb2a25f190b63c65c8906f9dc76486fb1c05ae71b5826bda08}
    container_name: ${HERMES_CONTAINER_NAME:-hermes}
    logging:
      <<: *default-logging
    restart: unless-stopped
    networks:
      agentic_mesh:
        aliases:
          - hermes-agent
      archon-admin_net:
        aliases:
          - hermes-admin
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      docker-socket-proxy:
        condition: service_healthy
      # W3: omniroute darf den Start nicht blockieren — die Anwendung hat
      # echte Provider-Fallbacks (OpenRouter/Ollama) und die Laufzeit-
      # Unhealthigkeit wird über /readyz (Dependency-Probes) gemeldet.
      omniroute:
        condition: service_started
    ports:
      - "127.0.0.1:${HERMES_HOST_PORT:-8644}:8642"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${ARCHON_HERMES_DIR:-./.hermes}:/opt/data
      - ${ARCHON_OBSIDIAN_DIR:-./obsidian_vault}:/opt/data/obsidian
      - ./agent_workspace:/projects
      - ./scripts/patches/hermes_telegram_adapter.py:/opt/hermes/plugins/platforms/telegram/adapter.py:ro
    environment:
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
      - API_SERVER_HOST=0.0.0.0
      - HERMES_HOME=/opt/data
      - OMNIROUTE_URL=${OMNIROUTE_CONTAINER_URL:-http://omniroute:20128/v1}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - HERMES_DASHBOARD_SESSION_TOKEN=${HERMES_DASHBOARD_SESSION_TOKEN:-}
    command: ["gateway", "run"]
    healthcheck:
      test: ["CMD", "/opt/hermes/.venv/bin/hermes", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 3072M
          cpus: "2.5"

  # -------------------------------------------------------------
  # HERMES DASHBOARD (Metrics & Trace on Port 9119)
  # -------------------------------------------------------------
  hermes-dashboard:
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent:v0.23.1@sha256:276d44685c65c0cb2a25f190b63c65c8906f9dc76486fb1c05ae71b5826bda08}
    container_name: ${HERMES_DASHBOARD_CONTAINER_NAME:-hermes-dashboard}
    logging:
      <<: *default-logging
    restart: unless-stopped
    profiles: ["dashboard", "observability", "all", "full"]
    networks:
      - agentic_mesh
    depends_on:
      - hermes
    volumes:
      - ${ARCHON_HERMES_DIR:-./.hermes}:/opt/data
      - ${ARCHON_OBSIDIAN_DIR:-./obsidian_vault}:/opt/data/obsidian
      - ./agent_workspace:/projects
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - HERMES_DASHBOARD_SESSION_TOKEN=${HERMES_DASHBOARD_SESSION_TOKEN:-}
    ports:
      - "127.0.0.1:9119:9119"
    command: ["dashboard", "--host", "127.0.0.1", "--port", "9120", "--no-open"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9120/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: "1.0"

  hermes-dashboard-proxy:
    image: alpine/socat:1.8.0.1@sha256:87d88ff79bf42ca723fb360e9585c40e2923a2f4df9b9d148b127568ef6b99e7
    container_name: ${HERMES_PROXY_CONTAINER_NAME:-hermes-dashboard-proxy}
    logging:
      <<: *default-logging
    restart: unless-stopped
    profiles: ["dashboard", "observability", "all", "full"]
    network_mode: "service:hermes-dashboard"
    depends_on:
      - hermes-dashboard
    entrypoint: ["socat"]
    command: ["tcp-listen:9119,fork,reuseaddr", "tcp-connect:127.0.0.1:9120"]
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.2"

  anything-llm:
    image: mintplexlabs/anythingllm:1.7.4@sha256:db45b3f9242b87e650e46081b81fb9004b88971c2e53cc85047200df7e110ee8
    container_name: ${ANYTHINGLLM_CONTAINER_NAME:-anything-llm}
    logging:
      <<: *default-logging
    restart: unless-stopped
    # H: bekannter Endpunkt /api/ping; node ist im Image garantiert vorhanden.
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3001/api/ping',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - agentic_mesh
      - archon-worker-zero-egress_net
    ports:
      - "${ARCHON_BIND_IP:-127.0.0.1}:${ANYTHINGLLM_HOST_PORT:-3001}:3001"
    environment:
      - STORAGE_DIR=/app/server/storage
      - SERVER_PORT=3001
      - DISABLE_TELEMETRY=true
      - EMBEDDING_ENGINE=${ANYTHINGLLM_EMBEDDING_ENGINE:-native}
      - EMBEDDING_BASE_PATH=${ANYTHINGLLM_EMBEDDING_BASE_PATH:-}
      - EMBEDDING_MODEL_PREF=${ANYTHINGLLM_EMBEDDING_MODEL:-}
      - GENERIC_OPEN_AI_EMBEDDING_API_KEY=${ANYTHINGLLM_EMBEDDING_API_KEY:-}
      - EMBEDDING_MODEL_MAX_CHUNK_LENGTH=8192
      - VECTOR_DB=${ANYTHINGLLM_VECTOR_DB:-chroma}
      - CHROMA_ENDPOINT=${CHROMA_ENDPOINT:-http://chroma:8000}
    volumes:
      - anythingllm_storage:/app/server/storage
      - ${ARCHON_OBSIDIAN_DIR:-./obsidian_vault}:/app/server/storage/obsidian_vault:ro
    deploy:
      resources:
        limits:
          memory: 2048M
          cpus: "2.0"

  ollama-embed:
    image: ollama/ollama:0.5.7@sha256:7e672211886f8bd4448a98ed577e26c816b9e8b052112860564afaa2c105800e
    container_name: ${OLLAMA_EMBED_CONTAINER_NAME:-ollama-embed}
    logging:
      <<: *default-logging
    restart: unless-stopped
    profiles: ["rag", "full", "all"]
    networks:
      - agentic_mesh
      - archon-worker-zero-egress_net
    volumes:
      - ollama_embed_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_NUM_PARALLEL=2
    deploy:
      resources:
        limits:
          memory: 4096M
          cpus: "3.0"

  chroma:
    image: chromadb/chroma:0.6.3@sha256:e0e78dc7609a599b63c99753442c7d01b1d3d369ce0e3bf3e0540536fec4fa7a
    container_name: ${CHROMA_CONTAINER_NAME:-chroma}
    logging:
      <<: *default-logging
    restart: unless-stopped
    networks:
      - archon-worker-zero-egress_net
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    deploy:
      resources:
        limits:
          memory: 2048M
          cpus: "2.0"

  # Audit D10/D01: der frühere `archon-worker` war nur
  # `python -c "time.sleep(86400)"` — ein Platzhalter ohne Queue-Consumer.
  # Entfernt statt Scheinbetrieb. Reale Isolierung erfolgt on-demand ueber
  # backend/ephemeral_sandbox.py im Netz `archon-worker-zero-egress_net`
  # (internal: true, cap_drop ALL, read_only, kein Internet-Route).

  litestream:
    image: litestream/litestream:0.5.1@sha256:b6b174e740f00e624fe15053f65348ab7e42daa3cc3ce1fa4cf6b89db5e3788d
    container_name: litestream
    logging:
      <<: *default-logging
    restart: unless-stopped
    profiles: ["backup", "replication", "all", "full"]
    networks:
      - agentic_mesh
    volumes:
      - ./config/litestream.yml:/etc/litestream.yml:ro
      - ${ARCHON_HERMES_DIR:-./.hermes}:/opt/data
      # P0-11: nur der Datenordner statt ./:/app (keine .env im Container).
      - ./data:/app/data
      # Audit D10: Replikat liegt bewusst NICHT mehr unter ./data — ein
      # Volume-Verlust der Primaer-DB darf das Replikat nicht mitnehmen.
      # Produktion: ARCHON_LITESTREAM_REPLICA_DIR auf ein gemountetes
      # externes Volume/NAS setzen (RPO ~5-10 s, RTO-Ziel <= 30 min,
      # Restore-Test scripts/automated_restore_test.py alle 6 h).
      - ${ARCHON_LITESTREAM_REPLICA_DIR:-./dr_replicas}:/opt/litestream_replicas
    command: ["replicate", "--config", "/etc/litestream.yml"]
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # Audit D16/P1: OTel Collector (gRPC 4317 / HTTP 4318). Nur mit Profil
  # tracing/observability/all aktiv; Konfiguration aus config/otel-collector-config.yml.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0@sha256:37fa87091cfaaec7234a27e4e395a40c31c2bfaea97a349a4afef6d9e9681197
    container_name: ${ARCHON_OTEL_COLLECTOR_CONTAINER_NAME:-archon-otel-collector}
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    logging:
      <<: *default-logging
    restart: unless-stopped
    profiles: ["tracing", "observability", "all", "full"]
    networks:
      - agentic_mesh
    ports:
      - "${ARCHON_BIND_IP:-127.0.0.1}:4317:4317"
      - "${ARCHON_BIND_IP:-127.0.0.1}:4318:4318"
    depends_on:
      tempo:
        condition: service_healthy
    volumes:
      - ./config/otel-collector-config.yml:/etc/otelcol-contrib/config.yaml:ro
      # H-16-2: der lokale file-Exporter lag vorher in /tmp ohne Volume und
      # verlor beim Container-Neustart alle Spans. Jetzt persistent.
      - otel_local_traces:/var/lib/otel
    environment:
      # H-16-2: der zentrale Downstream ist fix in der Collector-Config auf
      # http://tempo:4318 verdrahtet. Der tote OTEL_DOWNSTREAM_OTLP_ENDPOINT-
      # Knopf wurde aus .env.example entfernt (kein uneffektiver Default).
      - LANGFUSE_HOST=${LANGFUSE_HOST:-}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - OTEL_TRACES_SAMPLER=${OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
      - OTEL_TRACES_SAMPLER_ARG=${OTEL_TRACES_SAMPLER_ARG:-1.0}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4318/"]
      interval: 30s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  # H-16-2: zentraler Trace-Store. Der OTel-Collector exportiert OTLP/HTTP an
  # tempo:4318; Grafana fragt tempo:3200 ab. Nur mit tracing/observability-
  # Profil aktiv — wie der Collector. Das Image enthaelt keine Default-Config,
  # daher wird sie beim Start in /tmp geschrieben (kein extra Mount noetig).
  tempo:
    image: grafana/tempo:2.5.0@sha256:f0200a9bff6d14eb3a4332194f7b77c37ee1a3535e7e41db024d95aab6f1b4e8
    container_name: archon-tempo
    logging:
      <<: *default-logging
    restart: unless-stopped
    profiles: ["tracing", "observability", "all", "full"]
    networks:
      - agentic_mesh
    ports:
      - "${ARCHON_BIND_IP:-127.0.0.1}:3200:3200"
    volumes:
      - tempo_data:/var/tempo
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        cat > /tmp/tempo.yaml <<'YAML'
        server:
          http_listen_port: 3200
        distributor:
          receivers:
            otlp:
              protocols:
                grpc:
                  endpoint: 0.0.0.0:4317
                http:
                  endpoint: 0.0.0.0:4318
        storage:
          trace:
            backend: local
            local:
              path: /var/tempo/traces
            wal:
              path: /var/tempo/wal
        usage_report:
          reporting_enabled: false
        YAML
        exec /tempo -config.file=/tmp/tempo.yaml
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3200/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  # Audit D09/D10 (D-D8): das EOL-Langfuse-v2-Artefakt ist entfernt. Eine
  # v4-Migration braucht Worker/ClickHouse/Redis/S3 und wird nicht durch einen
  # Image-Tag-Wechsel vorgetaeuscht. Ein extern betriebenes, aktuelles Langfuse
  # wird ausschliesslich ueber die LANGFUSE_*-Werte in .env als OTLP-Ziel
  # angebunden; ohne Keys bleibt get_tracing_status() ehrlich `not_configured`.

  prometheus:
    image: prom/prometheus:v2.54.1@sha256:f6639335d34a77d9d9db382b92eeb7fc00934be8eae81dbc03b31cfe90411a94
    container_name: prometheus
    logging:
      <<: *default-logging
    restart: unless-stopped
    # H: prom/prometheus hat einen dokumentierten /-/healthy-Endpunkt.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    profiles: ["monitoring", "observability", "all", "full"]
    networks:
      - agentic_mesh
    ports:
      - "${ARCHON_BIND_IP:-127.0.0.1}:9090:9090"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
      # Re-Audit H7: ohne Flag verwirft Prometheus Exemplare (trace_id/span_id)
      # bereits beim Scrape; storage.exemplars in prometheus.yml allein reicht nicht.
      - "--enable-feature=exemplar-storage"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  alertmanager:
    image: prom/alertmanager:v0.28.1@sha256:27c475db5fb156cab31d5c18a4251ac7ed567746a2483ff264516437a39b15ba
    container_name: alertmanager
    logging:
      <<: *default-logging
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9093/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    profiles: ["monitoring", "observability", "all", "full"]
    networks:
      - agentic_mesh
    ports:
      - "${ARCHON_BIND_IP:-127.0.0.1}:9093:9093"
    volumes:
      - ./config/alertmanager/alertmanager.yml:/etc/alertmanager-template/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    environment:
      # Keine Defaults: ohne Telegram-Secrets bleibt der Status ehrlich
      # `alerts_not_configured`. Der Entrypoint rendert dann eine gueltige
      # no-op-Config statt einer leeren chat_id — kein Crashloop (Audit D10).
      # Die Starter nehmen alertmanager nur bei gesetzten Secrets mit.
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        mkdir -p /etc/alertmanager/secrets
        if [ -z "$$TELEGRAM_BOT_TOKEN" ] || [ -z "$$TELEGRAM_CHAT_ID" ]; then
          echo "alerts_not_configured: Telegram-Secrets fehlen; no-op-Receiver aktiv (keine Zustellung)." >&2
          printf 'route:\n  receiver: noop\nreceivers:\n  - name: noop\n' > /etc/alertmanager/alertmanager.yml
        else
          printf '%s' "$$TELEGRAM_BOT_TOKEN" > /etc/alertmanager/secrets/telegram_bot_token
          chmod 600 /etc/alertmanager/secrets/telegram_bot_token
          sed "s/__TELEGRAM_CHAT_ID__/$$TELEGRAM_CHAT_ID/" \
            /etc/alertmanager-template/alertmanager.yml > /etc/alertmanager/alertmanager.yml
        fi
        exec /bin/alertmanager \
          --config.file=/etc/alertmanager/alertmanager.yml \
          --storage.path=/alertmanager
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  grafana:
    image: grafana/grafana:11.1.0@sha256:079600c9517b678c10cda6006b4487d3174512fd4c6cface37df7822756ed7a5
    container_name: grafana
    logging:
      <<: *default-logging
    restart: unless-stopped
    # H: grafana/grafana hat einen dokumentierten /api/health-Endpunkt.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    profiles: ["monitoring", "observability", "all", "full"]
    networks:
      - agentic_mesh
    # Host port 3003 avoids collision with anything-llm on port 3001
    ports:
      - "${ARCHON_BIND_IP:-127.0.0.1}:3003:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./config/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-}
      - GF_USERS_ALLOW_SIGN_UP=false
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  uptime-kuma:
    image: louislam/uptime-kuma:1@sha256:70233f4acb5163fd2a59a49909cf01e44415cecff13dba69e3a86647a2919f83
    container_name: uptime-kuma
    logging:
      <<: *default-logging
    restart: unless-stopped
    profiles: ["monitoring", "observability", "all", "full"]
    networks:
      - agentic_mesh
    ports:
      - "${ARCHON_BIND_IP:-127.0.0.1}:3002:3001"
    volumes:
      - uptime_kuma_data:/app/data
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  caddy:
    image: caddy:2.8.4-alpine@sha256:af32e97399febea808609119bb21544d0265c58a02836576e32a2d082c262c17
    container_name: caddy-gateway
    logging:
      <<: *default-logging
    restart: unless-stopped
    profiles: ["gateway", "proxy", "all"]
    networks:
      - agentic_mesh
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  authelia:
    image: authelia/authelia:4.38@sha256:46021dc20efdcc5cdc38a29e3050b8835429a155ae6215388ed3b793a02eb0ab
    container_name: authelia-sso
    logging:
      <<: *default-logging
    restart: unless-stopped
    profiles: ["gateway", "proxy", "all"]
    networks:
      - agentic_mesh
    ports:
      - "${ARCHON_BIND_IP:-127.0.0.1}:9091:9091"
    volumes:
      - ./config/authelia:/config
    environment:
      - AUTHELIA_JWT_SECRET=${AUTHELIA_JWT_SECRET:-}
      - AUTHELIA_SESSION_SECRET=${AUTHELIA_SESSION_SECRET:-}
      - AUTHELIA_STORAGE_KEY=${AUTHELIA_STORAGE_KEY:-}
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  loki:
    image: grafana/loki:3.1.0@sha256:d947e68a84d9e44915dfa08c3bec27e2124efd5ba6c83443eb53578101ec69e3
    container_name: loki
    logging:
      <<: *default-logging
    restart: unless-stopped
    # H: grafana/loki hat einen dokumentierten /-/healthy-Endpunkt.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3100/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    profiles: ["logging", "observability", "all", "full"]
    networks:
      - agentic_mesh
    ports:
      - "${ARCHON_BIND_IP:-127.0.0.1}:3100:3100"
    volumes:
      - ./config/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  promtail:
    image: grafana/promtail:3.1.0@sha256:b3db8e7b1cba0e8c45ce2ae72ebddfd88ebdcae86383f1680edf0074e9010ff6
    container_name: promtail
    logging:
      <<: *default-logging
    restart: unless-stopped
    profiles: ["logging", "observability", "all", "full"]
    networks:
      - agentic_mesh
      # Nur über den gehärteten Proxy an die Docker-API, nie mit dem rohen Socket.
      - archon-admin_net
    volumes:
      - ./config/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      # Kein /var/run/docker.sock mehr: der Socket erlaubt Exec/Start/Stop und
      # umgeht damit die ACL des docker-socket-proxy vollständig.
      - ${DATA_DIR:-./data}/logs:/opt/data/logs:ro
    command: -config.file=/etc/promtail/config.yml
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.3"

  metabase:
    image: metabase/metabase:v0.50.23@sha256:489b7f9c943fb7bf36c46acbad41fed895118952e78cf2495e6283dfe4cc40eb
    container_name: metabase-bi
    logging:
      <<: *default-logging
    restart: unless-stopped
    profiles: ["bi", "analytics", "all"]
    networks:
      - agentic_mesh
    ports:
      - "${ARCHON_BIND_IP:-127.0.0.1}:3030:3000"
    volumes:
      - metabase_data:/metabase-data
      - ${DATA_DIR:-./data}:/opt/data:ro
    environment:
      - MB_DB_FILE=/metabase-data/metabase.db
      - MB_ANON_TRACKING_ENABLED=false
      - MB_SITE_NAME=Archon OS Business Intelligence
      - JAVA_OPTS=-Xmx512m
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: "1.0"

  docuseal:
    image: docuseal/docuseal:1.8.4@sha256:664690ea8a1e50e83f1c6810db297633929e49de274539c71a3566c4b630fbb6
    container_name: docuseal-esign
    logging:
      <<: *default-logging
    restart: unless-stopped
    profiles: ["esign", "legal", "all"]
    networks:
      - agentic_mesh
    ports:
      - "${ARCHON_BIND_IP:-127.0.0.1}:3080:3000"
    volumes:
      - docuseal_data:/data
    environment:
      - DOCUSEAL_DATABASE_URL=sqlite3:/data/docuseal.sqlite3
      - PORT=3000
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  # Audit D10 / E2E 24.11.2026: externer Autoheal. Der Docker-Healthcheck
  # markiert einen Haenger nur als unhealthy; restartet wird nur bei Exit.
  # Dieser Prozess prueft /livez von aussen und nutzt ALLOW_START/ALLOW_STOP
  # des Socket-Proxy — kein ALLOW_RESTARTS, kein roher docker.sock-Mount.
  archon-autoheal:
    image: python:3.13-slim@sha256:e48f59cdba69a3cbd9ed2cf0f348d90d45a8d350d98134cf1070bc106ee9ed90
    container_name: ${AUTOHEAL_CONTAINER_NAME:-archon-autoheal}
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    logging:
      <<: *default-logging
    networks:
      - agentic_mesh
      - archon-admin_net
    depends_on:
      docker-socket-proxy:
        condition: service_healthy
      # Audit D10: der externe Autoheal ist ein echter Default-Stack-Dienst
      # (kein Profil). Er startet erst, wenn das Ziel /livez wirklich bereit
      # ist — sonst wertet er den Boot als Haenger und restartet ihn.
      archon-os:
        condition: service_healthy
    healthcheck:
      # Der Prozess laeuft als PID 1 im Container; /proc ist vorhanden.
      test: ["CMD-SHELL", "python -c \"import os,sys; sys.exit(0 if any(b'archon_autoheal.py' in open('/proc/'+p+'/cmdline','rb').read() for p in os.listdir('/proc') if p.isdigit()) else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    environment:
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
      - AUTOHEAL_TARGET_URL=${AUTOHEAL_TARGET_URL:-http://archon-os:8501/livez}
      # Audit D10: optionaler Dead-Man-Webhook (Betreiber setzt ihn in .env;
      # ohne Wert bleibt dead_man_switch_configured=false — kein erfundenes Ziel).
      - ARCHON_HEARTBEAT_WEBHOOK_URL=${ARCHON_HEARTBEAT_WEBHOOK_URL:-}
      - AUTOHEAL_CONTAINER=${ARCHON_CONTAINER_NAME:-ARCHON-OS}
      - AUTOHEAL_INTERVAL_S=${AUTOHEAL_INTERVAL_S:-30}
      - AUTOHEAL_FAILURES=${AUTOHEAL_FAILURES:-5}
      - AUTOHEAL_COOLDOWN_S=${AUTOHEAL_COOLDOWN_S:-900}
      - AUTOHEAL_PROBE_TIMEOUT_S=${AUTOHEAL_PROBE_TIMEOUT_S:-5}
      - AUTOHEAL_HEALTH_GATE=${AUTOHEAL_HEALTH_GATE:-1}
      # Audit D10: Altersschwelle des Watchdog-Heartbeats im externen Probe.
      # Muss mit ARCHON_WATCHDOG_MAX_LAST_SEEN_AGE_S im Daemon abstimmen, sonst
      # meldet /livez frueher als dieser Probe greift.
      - AUTOHEAL_WATCHDOG_MAX_AGE_S=${AUTOHEAL_WATCHDOG_MAX_AGE_S:-120}
    volumes:
      - ./scripts/archon_autoheal.py:/app/archon_autoheal.py:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    command: ["python", "-u", "/app/archon_autoheal.py"]

