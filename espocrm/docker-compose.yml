version: '3.8'

services:
  mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: espocrm
      MYSQL_USER: espocrm
      MYSQL_PASSWORD: espocrm_password
    volumes:
      - mysql-data:/var/lib/mysql
    restart: always

  espocrm:
    image: espocrm/espocrm:latest
    environment:
      ESPOCRM_DATABASE_PLATFORM: Mysql
      ESPOCRM_DATABASE_HOST: mysql
      ESPOCRM_DATABASE_USER: espocrm
      ESPOCRM_DATABASE_PASSWORD: espocrm_password
      ESPOCRM_SITE_URL: "http://localhost:8081"
    ports:
      - "8081:80"
    volumes:
      - espocrm-custom:/var/www/html/custom
      - espocrm-data:/var/www/html/data
      - espocrm-client-custom:/var/www/html/client/custom
    restart: always
    depends_on:
      - mysql

  espocrm-daemon:
    image: espocrm/espocrm:latest
    volumes:
      - espocrm-custom:/var/www/html/custom
      - espocrm-data:/var/www/html/data
      - espocrm-client-custom:/var/www/html/client/custom
    restart: always
    entrypoint: docker-daemon.sh
    depends_on:
      - espocrm

volumes:
  mysql-data:
  espocrm-custom:
  espocrm-data:
  espocrm-client-custom:
