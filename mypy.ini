# F002 / Audit D09 (H1): MyPy-SSOT für Archon OS.
# Es wird KEIN `# mypy: ignore-errors` aus Python-Dateien entfernt — das ist F044 (W4).
# Diese Datei legt nur die Konfiguration fest, gegen die F044 die Module einzeln öffnet.
[mypy]
# Referenz-Interpreter der lokalen Toolchain ist .ci_venv (Python 3.11).
# Die CI läuft auf 3.13; 3.11 ist die konservativere Zielversion für Typ-Pragmas.
python_version = 3.11

# Alte `# type: ignore` müssen ihren Fehlercode weiterhin treffen, sonst rot.
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = True
check_untyped_defs = True
show_error_codes = True
pretty = True

# Drei Plugin-Verzeichnisse enthalten jeweils `plugin.py` (cost_guard,
# system_metrics, security_audit_hook). Ohne explizite Package-Bases meldet
# mypy „Duplicate module named plugin" und bricht den Full-Run ab. Diese
# Einstellung betrifft NUR die statische Modulzuordnung, nicht den Laufzeit-
# Plugin-Loader.
explicit_package_bases = True
mypy_path = .

# Legacy-Bestand bleibt zunächst untyped (F044 öffnet Modul für Modul).
# NEUE Module werden unten per Namespace freigeschaltet und zusätzlich im
# CI-Ratchet für per Diff neu hinzugefügte Dateien erzwungen (siehe ci.yml).
disallow_untyped_defs = False

# Optionale Integrationen (n8n, Hermes, Langfuse, PocketBase, Browser-Treiber)
# liefern keine Typstubs; das Gate soll an echten Codefehlern scheitern,
# nicht an fehlenden .pyi-Dateien Dritter.
ignore_missing_imports = True
follow_imports = silent

exclude = (?x)(^|/)(\.ci_venv|\.venv-tools|\.mypy_cache|\.ruff_cache|node_modules|archive|_archive_legacy|scratch|dist|site|quartz_app|notebooklm)/

# --- Neue Module: volle Typpflicht (bei jedem neuen Namespace ergänzen) ---
[mypy-archon.services.*]
disallow_untyped_defs = True

# --- Bekannte Stubs-führende Pakete: echte Importprüfung statt Blind-Ignore ---
[mypy-requests.*]
ignore_missing_imports = False

[mypy-pydantic.*]
ignore_missing_imports = False

[mypy-fastapi.*]
ignore_missing_imports = False
