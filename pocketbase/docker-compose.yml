name: CRM

services:
  CRM:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: crm-frontend:latest
    container_name: CRM
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:3002"
    environment:
      - PORT=3002

  Pocketbase:
    image: ghcr.io/muchobien/pocketbase:0.42.0@sha256:103b349f32ef5d6b423978ddc3446233b82cda44110eecc53c8b3ebcc6a2f05c
    container_name: Pocketbase
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - ./pb_data:/pb_data
      - ./pb_hooks:/pb_hooks
      - ./pb_public:/pb_public
