[pytest]
pythonpath = .
# W6: Tests können mit ARCHON_TEST_DB_ISOLATION=1 gegen ein temporäres
# Datenverzeichnis laufen (tests/conftest.py) — dann stört ein laufender
# ARCHON-OS-Container nicht. Empfohlen: .\scripts\run_tests_isolated.ps1
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# DeprecationWarnings were previously ignored globally — das verbirgt
# API-Drift (FastAPI/Pydantic/asyncio). Nur bekannte, externe Warnungen
# gezielt unterdruecken, nicht die gesamte Kategorie.
filterwarnings =
    ignore::DeprecationWarning:urllib3
    ignore::DeprecationWarning:pkg_resources
