[pytest]
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# DeprecationWarnings were previously ignored globally — das verbirgt
# API-Drift (FastAPI/Pydantic/asyncio). Nur bekannte, externe Warnungen
# gezielt unterdruecken, nicht die gesamte Kategorie.
filterwarnings =
    ignore::DeprecationWarning:urllib3
    ignore::DeprecationWarning:pkg_resources
