        <!-- SUB-VIEW 2: KANBAN BOARD (Vollwertiges Operations-Kanban in Mission Control) -->
        <main id="ops-view-kanban" class="hidden flex-1 w-full p-3 flex flex-col gap-2.5 min-h-0 overflow-hidden rounded-2xl border border-[var(--border)] bg-[var(--card)] shadow-xs">
          <!-- BOARD-TOOLBAR: Neue Aufgabe links vom Suchfeld, Filter, WIP, Stats, Sync links vom Archiv -->
          <div id="ops-kanban-toolbar" class="flex items-center gap-2 shrink-0 flex-wrap">
            <button onclick="openNewTaskModal()" class="h-8 px-3 rounded-lg bg-[var(--primary)] hover:opacity-90 text-[var(--primary-foreground)] font-semibold transition cursor-pointer text-xs flex items-center gap-1.5 shadow-xs shrink-0">
              <i data-lucide="plus" class="w-3.5 h-3.5"></i>
              <span>Neue Aufgabe</span>
            </button>
            <div class="relative">
              <i data-lucide="search" class="w-3.5 h-3.5 absolute left-2.5 top-1/2 -translate-y-1/2 text-muted-custom/60 pointer-events-none"></i>
              <input id="ops-kanban-search" type="text" placeholder="Suchen… (Titel, Text, ID)" oninput="onOpsKanbanFilterChange()"
                class="pl-8 pr-2.5 h-8 w-52 rounded-lg border border-[var(--border)] bg-[var(--background)] text-xs text-primary-custom focus:outline-none focus:ring-1 focus:ring-indigo-500" />
            </div>
            <select id="ops-kanban-filter-assignee" onchange="onOpsKanbanFilterChange()" class="h-8 px-2 rounded-lg border border-[var(--border)] bg-[var(--background)] text-xs text-primary-custom cursor-pointer focus:outline-none">
              <option value="">Alle Agenten</option>
            </select>
            <select id="ops-kanban-filter-prio" onchange="onOpsKanbanFilterChange()" class="h-8 px-2 rounded-lg border border-[var(--border)] bg-[var(--background)] text-xs text-primary-custom cursor-pointer focus:outline-none" title="Priorität filtern">
              <option value="">Alle Prioritäten</option>
              <option value="3">P0 (Kritisch)</option>
              <option value="2">P1 (Hoch)</option>
              <option value="1">P2 (Mittel)</option>
              <option value="0">P3 (Normal)</option>
            </select>
            <select id="ops-kanban-sort" onchange="onOpsKanbanFilterChange()" class="h-8 px-2 rounded-lg border border-[var(--border)] bg-[var(--background)] text-xs text-primary-custom cursor-pointer focus:outline-none" title="Sortierung in den Spalten">
              <option value="default">Sortierung: Engine</option>
              <option value="prio">Nach Priorität</option>
              <option value="newest">Neueste zuerst</option>
              <option value="title">Titel (A–Z)</option>
            </select>
            <div class="flex items-center gap-1 h-8 pl-2 pr-1 rounded-lg border border-[var(--border)] bg-[var(--background)]" title="WIP-Limit je Spalte (0 = aufheben)">
              <span class="text-[10px] font-mono font-bold text-muted-custom">WIP</span>
              <select id="ops-kanban-wip-col" class="h-6 px-1 text-xs bg-transparent text-primary-custom focus:outline-none cursor-pointer">
                <option value="todo">To-Do</option>
                <option value="in_progress">In Arbeit</option>
                <option value="review">Review</option>
                <option value="blocked">Blockiert</option>
                <option value="done">Erledigt</option>
              </select>
              <input id="ops-kanban-wip-n" type="number" min="0" max="99" placeholder="n" class="w-10 h-6 px-1 text-xs bg-transparent text-primary-custom focus:outline-none" />
              <button onclick="saveOpsKanbanWip()" class="h-6 px-1.5 rounded bg-[var(--secondary)] hover:opacity-80 text-xs font-bold cursor-pointer text-primary-custom" title="WIP-Limit speichern">✓</button>
            </div>
            <div id="ops-kanban-stats" class="flex items-center gap-2.5 text-[10px] font-mono text-muted-custom"></div>
            <div class="ml-auto flex items-center gap-1.5 shrink-0">
              <button onclick="loadOperationsData()" class="h-8 px-2.5 rounded-lg border border-[var(--border)] bg-[var(--background)] hover:bg-[var(--secondary)] text-[var(--foreground)] text-xs font-mono font-medium transition cursor-pointer flex items-center gap-1.5 shadow-2xs" title="Aktualisieren">
                <i data-lucide="refresh-cw" class="w-3.5 h-3.5 text-blue-500"></i>
                <span>Sync</span>
              </button>
              <button id="ops-kanban-archive-btn" onclick="toggleOpsKanbanArchive()" class="h-8 px-2.5 rounded-lg border border-[var(--border)] bg-[var(--background)] hover:bg-[var(--secondary)] text-xs font-bold text-primary-custom transition cursor-pointer flex items-center gap-1.5">
                <i data-lucide="archive" class="w-3.5 h-3.5"></i> <span>Archiv (…)</span>
              </button>
            </div>
          </div>
          <!-- ARCHIV-ANSICHT (versteckt, Toggle über Toolbar-Button) -->
          <div id="ops-kanban-archive" class="hidden flex-1 min-h-0 overflow-y-auto rounded-xl border border-[var(--border)] bg-[var(--background)] p-3">
            <div class="flex items-center justify-between mb-2.5">
              <h4 class="text-xs font-bold uppercase font-mono tracking-wider text-primary-custom">🗂 Archivierte Tasks</h4>
              <button onclick="toggleOpsKanbanArchive(false)" class="h-7 px-2.5 rounded-lg border border-[var(--border)] text-xs font-bold cursor-pointer hover:bg-[var(--secondary)] text-primary-custom">Schließen ✕</button>
            </div>
            <div id="ops-kanban-archive-list" class="space-y-2"></div>
          </div>
          <div id="ops-kanban-columns-container" class="flex gap-1.5 w-full flex-1 min-h-0 overflow-x-auto pb-1">
            <!-- Dynamische Spalten -->
          </div>
        </main>

        <!-- SUB-VIEW 3: ORGANISATION & TEAMS (ABLAUFDIAGRAMM & TEAMS) -->
        <main id="ops-view-org" class="hidden flex-1 w-full flex flex-col min-h-0 rounded-2xl border border-[var(--border)] bg-[var(--card)] shadow-xs overflow-hidden">
          <!-- ORG TOOLBAR -->
          <div class="px-4 py-2.5 border-b border-[var(--border)] bg-[var(--card)] flex items-center justify-between shrink-0 shadow-2xs gap-3">
            <div class="flex items-center gap-2">
              <span class="text-xs font-mono font-bold uppercase tracking-wider text-primary-custom flex items-center gap-1.5">
                <i data-lucide="network" class="w-4 h-4 text-[#d42a2b]"></i>
                <span>Ablaufdiagramm &amp; Organigramm</span>
              </span>
              <button type="button" onclick="openContextHelp('org')" title="Hilfe zum Ablaufdiagramm &amp; Organigramm" class="w-5 h-5 rounded-md hover:bg-[var(--secondary)] text-[var(--muted-foreground)] hover:text-sky-500 flex items-center justify-center transition cursor-pointer">
                <i data-lucide="help-circle" class="w-3.5 h-3.5"></i>
              </button>
              <span class="text-[10px] text-muted-custom font-mono hidden md:inline">· Klicke auf eine Kachel für Eigenschaften &amp; Ergebnisse · Ziehe Verbindungspunkte für Berichtslinien</span>
            </div>

            <!-- View Mode Switcher: Flowchart vs. Grid -->
            <div class="flex items-center gap-1.5 bg-[var(--secondary)] p-1 rounded-xl border border-[var(--border)] text-xs font-mono">
              <button id="ops-org-mode-flow" onclick="setOpsOrgViewMode('flow')" class="px-3 py-1 rounded-lg font-bold transition flex items-center gap-1.5 cursor-pointer bg-[var(--card)] text-primary-custom shadow-xs border border-[var(--border)]">
                <i data-lucide="git-branch" class="w-3.5 h-3.5"></i>
                <span>Interaktiver Flowchart-Baum</span>
              </button>
              <button id="ops-org-mode-grid" onclick="setOpsOrgViewMode('grid')" class="px-3 py-1 rounded-lg font-medium transition flex items-center gap-1.5 cursor-pointer text-muted-custom hover:text-primary-custom">
                <i data-lucide="grid" class="w-3.5 h-3.5"></i>
                <span>Kompakte Team-Karten</span>
              </button>
            </div>

            <!-- Flowchart Actions -->
            <div class="flex items-center gap-2">
              <button onclick="resetOrgHierarchyToDefault()" class="px-2.5 py-1.5 rounded-lg border border-[var(--border)] bg-[var(--background)] hover:bg-[var(--secondary)] text-muted-custom hover:text-primary-custom transition cursor-pointer text-xs flex items-center gap-1.5" title="Setzt auf die 6 Standard-Teams zurück">
                <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
                <span>Reset (6 Teams)</span>
              </button>
              <button onclick="autoAlignOrgHierarchy()" class="px-2.5 py-1.5 rounded-lg border border-[var(--border)] bg-[var(--background)] hover:bg-[var(--secondary)] text-muted-custom hover:text-primary-custom transition cursor-pointer text-xs flex items-center gap-1.5" title="Richtet alle Knoten überlappungsfrei am 20px-Raster aus">
                <i data-lucide="layout-grid" class="w-3.5 h-3.5"></i>
                <span>Am Raster ausrichten</span>
              </button>
              <button onclick="saveCurrentOrgHierarchy()" class="px-3.5 py-1.5 rounded-lg bg-[#d42a2b] hover:bg-[#b82223] text-white font-semibold transition cursor-pointer text-xs flex items-center gap-1.5 shadow-xs">
                <i data-lucide="save" class="w-3.5 h-3.5"></i>
                <span>Hierarchie speichern</span>
              </button>
            </div>
          </div>

          <!-- FLOWCHART CANVAS VIEW -->
          <div id="ops-org-flow-container" class="flex-1 w-full relative overflow-auto bg-[var(--page-bg)] select-none" style="background-image: radial-gradient(var(--border) 1.2px, transparent 1.2px); background-size: 20px 20px;">
            <svg id="ops-org-flow-svg" class="absolute inset-0 pointer-events-none" style="min-width: 3200px; min-height: 4000px; width: 3200px; height: 4000px; z-index: 5;">
              <defs>
                <marker id="flow-arrow-down" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                  <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#71717a" />
                </marker>
                <marker id="flow-arrow-hover" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                  <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d42a2b" />
                </marker>
              </defs>
              <g id="ops-flow-links-group" style="pointer-events: auto;"></g>
              <path id="ops-flow-temp-line" d="" fill="none" stroke="#d42a2b" stroke-width="2" stroke-dasharray="6 4" class="hidden opacity-90 pointer-events-none" />
            </svg>
            <div id="ops-org-flow-nodes" class="absolute inset-0 pointer-events-auto" style="min-width: 3200px; min-height: 4000px; width: 3200px; height: 4000px; z-index: 10;">
              <!-- Dynamische Ablaufdiagramm-Karten -->
            </div>
          </div>

          <!-- GRID VIEW (FALLBACK / KOMPAKTE KARTEN) -->
          <div id="ops-org-grid-container" class="hidden flex-1 w-full p-6 overflow-y-auto min-h-0 bg-[var(--page-bg)] space-y-8">
            <div id="ops-org-chart-container" class="max-w-7xl mx-auto space-y-8">
              <!-- Dynamisches Team-Karten Organigramm -->
            </div>
          </div>
        </main>

        <!-- SUB-VIEW 4: INTERNE KOMMUNIKATION -->
        <main id="ops-view-comm" class="hidden flex-1 w-full flex overflow-hidden min-h-0 rounded-2xl border border-[var(--border)] bg-[var(--card)] shadow-xs os-island">
          <!-- LINKS: KANÄLE & FILTER -->
          <aside class="w-72 border-r border-[var(--border)] bg-[var(--card)] flex flex-col shrink-0">
            <div class="p-3 border-b border-[var(--border)]">
              <span class="text-[11px] font-mono uppercase font-bold text-[var(--muted-foreground)]">Filter nach Agent / Bereich</span>
            </div>
            <div id="ops-comm-channels" class="p-2 space-y-1 overflow-y-auto flex-1">
              <!-- Kanalliste -->
            </div>
          </aside>
          <!-- RECHTS: NACHRICHTEN FEED -->
          <section class="flex-1 flex flex-col bg-[var(--background)] overflow-hidden">
            <div class="p-3 border-b border-[var(--border)] bg-[var(--card)] flex items-center justify-between">
              <span id="ops-comm-active-title" class="text-xs font-bold text-[var(--foreground)] font-mono">📡 Gesamt-Funkverkehr aller Agenten</span>
              <span class="text-[10px] text-[var(--muted-foreground)] font-mono">Live-Events aus kanban.db</span>
            </div>
            <div id="ops-comm-messages" class="flex-1 p-4 overflow-y-auto space-y-3 os-console">
              <!-- Nachrichtenfeed -->
            </div>
          </section>
        </main>
