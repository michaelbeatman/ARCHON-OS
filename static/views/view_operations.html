<div id="view-operations" class="hidden flex-1 w-full h-full flex flex-col bg-[var(--background)] overflow-hidden" style="height: 100vh; width: 100%;">
        
        <!-- TOPBAR: OPERATIONS HEADER & TABS -->
        <header id="ops-header-bar" class="h-[72px] px-4 md:px-5 border-b border-[var(--border)] bg-[var(--card)] flex items-center justify-between shrink-0 font-sans shadow-2xs">
          <div class="flex items-center gap-2">
            <h1 class="text-sm font-semibold tracking-tight text-[var(--foreground)]">Operations</h1>
            <button type="button" onclick="openContextHelp('operations')" title="Hilfe zu Operations" class="w-5 h-5 rounded-md hover:bg-[var(--secondary)] text-[var(--muted-foreground)] hover:text-sky-500 flex items-center justify-center transition cursor-pointer">
              <i data-lucide="help-circle" class="w-3.5 h-3.5"></i>
            </button>
            <span class="hidden sm:inline text-[11px] text-[var(--muted-foreground)] ml-1 border-l border-[var(--border)] pl-2">Kanban Board, Ablaufdiagramm &amp; Interne Kommunikation</span>
          </div>

          <!-- SUB-TAB SWITCHER IM AGENTEN-KADER STIL -->
          <div class="flex items-center gap-1.5 sm:gap-2 shrink-0 py-0.5 overflow-x-auto">
            <!-- 1. Kanban -->
            <button 
              type="button" 
              id="ops-subtab-kanban" 
              onclick="setOperationsTab('kanban')" 
              class="ops-header-tile flex flex-col items-center justify-center min-w-[56px] sm:min-w-[62px] py-0.5 px-0.5 bg-transparent border-0 shadow-none opacity-100 cursor-pointer select-none transition-transform hover:scale-105 duration-150"
              title="Kanban Board"
            >
              <div class="tile-icon-wrap w-8 h-8 sm:w-9 sm:h-9 flex items-center justify-center mb-0.5 relative">
                <img src="/static/img/cadre_icons/operations.png?v=2" alt="Kanban" class="w-8 h-8 sm:w-9 sm:h-9 object-contain drop-shadow-xs pointer-events-none">
                <span id="ops-kanban-badge" class="absolute -top-1 -right-1 px-1 py-0.1 rounded-full text-[8px] bg-red-600 text-white font-bold leading-none hidden">0</span>
              </div>
              <span class="ops-tab-label text-[10px] font-mono tracking-tight text-center whitespace-nowrap text-red-600 font-bold">Kanban</span>
            </button>
            <!-- 2. Organisation & Teams -->
            <button 
              type="button" 
              id="ops-subtab-org" 
              onclick="setOperationsTab('org')" 
              class="ops-header-tile flex flex-col items-center justify-center min-w-[56px] sm:min-w-[62px] py-0.5 px-0.5 bg-transparent border-0 shadow-none opacity-75 hover:opacity-100 cursor-pointer select-none transition-transform hover:scale-105 duration-150"
              title="Organisation &amp; Ablaufdiagramm"
            >
              <div class="tile-icon-wrap w-8 h-8 sm:w-9 sm:h-9 flex items-center justify-center mb-0.5 relative">
                <img src="/static/img/cadre_icons/overview.png" alt="Organisation" class="w-8 h-8 sm:w-9 sm:h-9 object-contain drop-shadow-xs pointer-events-none">
              </div>
              <span class="ops-tab-label text-[10px] font-mono tracking-tight text-center whitespace-nowrap text-black dark:text-zinc-100 font-medium">Organisation</span>
            </button>
            <!-- 3. Interne Kommunikation -->
            <button 
              type="button" 
              id="ops-subtab-comm" 
              onclick="setOperationsTab('comm')" 
              class="ops-header-tile flex flex-col items-center justify-center min-w-[56px] sm:min-w-[62px] py-0.5 px-0.5 bg-transparent border-0 shadow-none opacity-75 hover:opacity-100 cursor-pointer select-none transition-transform hover:scale-105 duration-150"
              title="Interne Kommunikation"
            >
              <div class="tile-icon-wrap w-8 h-8 sm:w-9 sm:h-9 flex items-center justify-center mb-0.5 relative">
                <img src="/static/img/cadre_icons/chat.png" alt="Kommunikation" class="w-8 h-8 sm:w-9 sm:h-9 object-contain drop-shadow-xs pointer-events-none">
                <span id="ops-comm-badge" class="absolute -top-1 -right-1 w-2 h-2 rounded-full bg-emerald-500 ring-2 ring-white dark:ring-zinc-900"></span>
              </div>
              <span class="ops-tab-label text-[10px] font-mono tracking-tight text-center whitespace-nowrap text-black dark:text-zinc-100 font-medium">Kommunikation</span>
            </button>
          </div>

          <!-- ACTIONS -->
          <div class="flex items-center gap-2">
            <button onclick="loadOperationsData()" class="h-8 px-2.5 rounded-lg border border-[var(--border)] hover:bg-[var(--secondary)] text-muted-custom hover:text-primary-custom transition cursor-pointer text-xs flex items-center gap-1.5" title="Aktualisieren">
              <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
            </button>
            <button onclick="openNewTaskModal()" class="h-8 px-3 rounded-lg bg-[var(--primary)] hover:opacity-90 text-[var(--primary-foreground)] font-semibold transition cursor-pointer text-xs flex items-center gap-1.5 shadow-xs">
              <i data-lucide="plus" class="w-3.5 h-3.5"></i>
              <span>Neue Aufgabe</span>
            </button>
          </div>
        </header>

        <!-- SUB-VIEW 1: KANBAN BOARD -->
        <main id="ops-view-kanban" class="flex-1 w-full p-4 overflow-x-auto overflow-y-hidden flex gap-4 min-h-0 bg-[var(--page-bg)]">
          <div id="ops-kanban-columns-container" class="flex gap-4 w-full h-full min-w-max pb-2">
            <!-- Dynamische Spalten -->
          </div>
        </main>

        <!-- SUB-VIEW 2: ORGANISATION & TEAMS (ABLAUFDIAGRAMM & TEAMS) -->
        <main id="ops-view-org" class="hidden flex-1 w-full flex flex-col min-h-0 bg-[var(--page-bg)] overflow-hidden">
          <!-- ORG TOOLBAR -->
          <div class="px-5 py-2.5 border-b border-[var(--border)] bg-[var(--card)] flex items-center justify-between shrink-0 shadow-2xs gap-3">
            <div class="flex items-center gap-2">
              <span class="text-xs font-mono font-bold uppercase tracking-wider text-primary-custom flex items-center gap-1.5">
                <i data-lucide="network" class="w-4 h-4 text-[#d42a2b]"></i>
                <span>Ablaufdiagramm &amp; Organigramm</span>
              </span>
              <button type="button" onclick="openContextHelp('org')" title="Hilfe zum Ablaufdiagramm &amp; Organigramm" class="w-5 h-5 rounded-md hover:bg-[var(--secondary)] text-[var(--muted-foreground)] hover:text-sky-500 flex items-center justify-center transition cursor-pointer">
                <i data-lucide="help-circle" class="w-3.5 h-3.5"></i>
              </button>
              <span class="text-[10px] text-muted-custom font-mono hidden md:inline">· Klicke auf eine Kachel für Eigenschaften &amp; Ergebnisse · Ziehe Verbindungspunkte für Berichtslinien</span>
            </div>

            <!-- View Mode Switcher: Flowchart vs. Grid -->
            <div class="flex items-center gap-1.5 bg-[var(--secondary)] p-1 rounded-xl border border-[var(--border)] text-xs font-mono">
              <button id="ops-org-mode-flow" onclick="setOpsOrgViewMode('flow')" class="px-3 py-1 rounded-lg font-bold transition flex items-center gap-1.5 cursor-pointer bg-[var(--card)] text-primary-custom shadow-xs border border-[var(--border)]">
                <i data-lucide="git-branch" class="w-3.5 h-3.5"></i>
                <span>Interaktiver Flowchart-Baum</span>
              </button>
              <button id="ops-org-mode-grid" onclick="setOpsOrgViewMode('grid')" class="px-3 py-1 rounded-lg font-medium transition flex items-center gap-1.5 cursor-pointer text-muted-custom hover:text-primary-custom">
                <i data-lucide="grid" class="w-3.5 h-3.5"></i>
                <span>Kompakte Team-Karten</span>
              </button>
            </div>

            <!-- Flowchart Actions -->
            <div class="flex items-center gap-2">
              <button onclick="resetOrgHierarchyToDefault()" class="px-2.5 py-1.5 rounded-lg border border-[var(--border)] bg-[var(--background)] hover:bg-[var(--secondary)] text-muted-custom hover:text-primary-custom transition cursor-pointer text-xs flex items-center gap-1.5" title="Setzt auf die 6 Standard-Teams zurück">
                <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
                <span>Reset (6 Teams)</span>
              </button>
              <button onclick="autoAlignOrgHierarchy()" class="px-2.5 py-1.5 rounded-lg border border-[var(--border)] bg-[var(--background)] hover:bg-[var(--secondary)] text-muted-custom hover:text-primary-custom transition cursor-pointer text-xs flex items-center gap-1.5" title="Richtet alle Knoten überlappungsfrei am 20px-Raster aus">
                <i data-lucide="layout-grid" class="w-3.5 h-3.5"></i>
                <span>Am Raster ausrichten</span>
              </button>
              <button onclick="saveCurrentOrgHierarchy()" class="px-3.5 py-1.5 rounded-lg bg-[#d42a2b] hover:bg-[#b82223] text-white font-semibold transition cursor-pointer text-xs flex items-center gap-1.5 shadow-xs">
                <i data-lucide="save" class="w-3.5 h-3.5"></i>
                <span>Hierarchie speichern</span>
              </button>
            </div>
          </div>

          <!-- FLOWCHART CANVAS VIEW -->
          <div id="ops-org-flow-container" class="flex-1 w-full relative overflow-auto bg-[var(--page-bg)] select-none" style="background-image: radial-gradient(var(--border) 1.2px, transparent 1.2px); background-size: 20px 20px;">
            <svg id="ops-org-flow-svg" class="absolute inset-0 pointer-events-none" style="min-width: 3200px; min-height: 4000px; width: 3200px; height: 4000px; z-index: 5;">
              <defs>
                <marker id="flow-arrow-down" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                  <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#71717a" />
                </marker>
                <marker id="flow-arrow-hover" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                  <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d42a2b" />
                </marker>
              </defs>
              <g id="ops-flow-links-group" style="pointer-events: auto;"></g>
              <path id="ops-flow-temp-line" d="" fill="none" stroke="#d42a2b" stroke-width="2" stroke-dasharray="6 4" class="hidden opacity-90 pointer-events-none" />
            </svg>
            <div id="ops-org-flow-nodes" class="absolute inset-0 pointer-events-auto" style="min-width: 3200px; min-height: 4000px; width: 3200px; height: 4000px; z-index: 10;">
              <!-- Dynamische Ablaufdiagramm-Karten -->
            </div>
          </div>

          <!-- GRID VIEW (FALLBACK / KOMPAKTE KARTEN) -->
          <div id="ops-org-grid-container" class="hidden flex-1 w-full p-6 overflow-y-auto min-h-0 bg-[var(--page-bg)] space-y-8">
            <div id="ops-org-chart-container" class="max-w-7xl mx-auto space-y-8">
              <!-- Dynamisches Team-Karten Organigramm -->
            </div>
          </div>
        </main>

        <!-- SUB-VIEW 3: INTERNE KOMMUNIKATION -->
        <main id="ops-view-comm" class="hidden flex-1 w-full flex overflow-hidden min-h-0 bg-[var(--page-bg)]">
          <!-- LINKS: KANÄLE & FILTER -->
          <aside class="w-72 border-r border-[var(--border)] bg-[var(--card)] flex flex-col shrink-0">
            <div class="p-3 border-b border-[var(--border)]">
              <span class="text-[11px] font-mono uppercase font-bold text-muted-custom">Filter nach Agent / Bereich</span>
            </div>
            <div id="ops-comm-channels" class="p-2 space-y-1 overflow-y-auto flex-1">
              <!-- Kanalliste -->
            </div>
          </aside>
          <!-- RECHTS: NACHRICHTEN FEED -->
          <section class="flex-1 flex flex-col bg-[var(--background)] overflow-hidden">
            <div class="p-3 border-b border-[var(--border)] bg-[var(--card)] flex items-center justify-between">
              <span id="ops-comm-active-title" class="text-xs font-bold text-primary-custom font-mono">📡 Gesamt-Funkverkehr aller Agenten</span>
              <span class="text-[10px] text-muted-custom font-mono">Live-Events aus kanban.db</span>
            </div>
            <div id="ops-comm-messages" class="flex-1 p-4 overflow-y-auto space-y-3">
              <!-- Nachrichtenfeed -->
            </div>
          </section>
        </main>

      </div>
