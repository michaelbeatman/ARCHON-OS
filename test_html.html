<!DOCTYPE html>
<html>
<head>
<style>
.flex { display: flex; }
.justify-start { justify-content: flex-start; }
.max-w-3xl { max-width: 48rem; }
.bg-card { background: white; border: 1px solid black; padding: 1rem; }
</style>
</head>
<body>
<div id="container"></div>
<script>
const bubbleWrap = document.createElement("div");
bubbleWrap.className = "flex justify-start";
bubbleWrap.innerHTML = `
  <div class="flex gap-3 max-w-3xl">
    <div class="w-12 h-12 bg-red-500">IMG</div>
    <div class="bg-card">
      Hello World
    </div>
  </div>
  <div>Routing Tag</div>
  </div>
`;
document.getElementById("container").appendChild(bubbleWrap);
</script>
</body>
</html>
